"text\":\"Pure randomness is not the same as natural composition. We need dense interiors, quieter gaps and ragged edges. A mask is a map of where grass is allowed: light areas mean yes, dark areas mean no, and gray areas mean partial coverage.\"},{\"kind\":\"p\",\"text\":\"For a first patch, measure each candidate root’s distance from the center. Accept roots well inside and gradually reduce their chance near the boundary. Smooth variation breaks up the circular outline. The full renderer stores the painted zone, local thickness and an estimate of interior depth in a texture, so the planting rules can respond to the shape of the field.\"},{\"kind\":\"code\",\"text\":\"// Use a seeded random generator for repeatable layouts.\\nif (random() \u003c coverageAt(x, z)) plant(x, z);\"},{\"kind\":\"p\",\"text\":\"Interior depth also affects clump height and spread. At the rim, smaller clumps and isolated blades soften the transition to bare ground; farther inside, larger groups build volume. Growth has a stored delay per blade, with nearby blades in a clump receiving related delays. This makes emergence staggered rather than switching the whole field on at once. It is a visual growth model, not a simulation of plant biology.\"},{\"kind\":\"p\",\"text\":\"A seed starts a repeatable sequence of random-looking numbers. Keep it fixed while tuning: otherwise each comparison changes the arrangement as well as the rule. Density cutoff filters stored blades by their random rank and shrinks those near the threshold. Growth controls emergence; width, height and roundness change the surviving blades. Replant gives you another arrangement using the same rules.\"}]},{\"id\":\"ground\",\"title\":\"Use the ground as a palette\",\"navTitle\":\"Ground \u0026 color\",\"demo\":\"grass-ground\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The ground and the blades read the same color field. Each blade samples the color at its root, helping the base blend into the surface underneath. That shared color is part of the painted look: a dense patch can read as one shape while individual leaves remain visible around its edges.\"},{\"kind\":\"p\",\"text\":\"Start with Ground only. Move over it, or choose Sample center, to inspect a texel: one cell in the texture. Change a palette color or the patch strength, then choose Both. The blade roots inherit the same color pattern. Set root shading to zero to see that relationship clearly; increase it to restore depth between the leaves.\"},{\"kind\":\"code\",\"text\":\"vec4 field = fieldAt(iPos.xz);\\nfloat ground = field.a;\\nvec3 green = field.rgb;\"},{\"kind\":\"p\",\"text\":\"The RGB channels store color; alpha stores ground height. A texture is a grid of values, so it can carry data as well as an image. We bake these relatively stable results into a lookup texture and refresh it when their inputs change. The renderer filters neighboring texels while drawing; the sample readout shows the nearest texel.\"}]},{\"id\":\"color\",\"title\":\"Color in patches\",\"demo\":\"grass-color\",\"blocks\":[{\"kind\":\"p\",\"text\":\"If every blade chooses an unrelated color, the field becomes noisy. Shared patches give neighboring roots related colors, with a smaller variation layered on top. Establish the broad color areas first, then add enough local variation to keep them from looking flat.\"},{\"kind\":\"p\",\"text\":\"The palette includes pale leaves, deep teal shadows, warm rusty accents and muted cool areas. This is a deliberate departure from uniformly green grass. Root shading creates separation inside each clump without drawing a dark outline around every leaf. Change Color patches while keeping the seed fixed to judge color without changing the composition.\"},{\"kind\":\"p\",\"text\":\"The baked color-and-height texture also avoids repeating the full field calculation for every blade vertex every frame. Sampling is still work, but it reuses a shared result. Wind and interaction stay dynamic in the vertex shader; they are not frozen into that texture.\"}]},{\"id\":\"wind\",\"title\":\"Move the field together\",\"demo\":\"grass-wind\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Unrelated motion on every blade looks like vibration. Wind should connect neighboring plants. Imagine a sheet of slowly varying values moving across the ground: nearby roots sample similar values, so a gust travels through the field instead of each blade moving on its own.\"},{\"kind\":\"p\",\"text\":\"Noise here means smoothly changing numbers, not sound. The shader combines several scales of noise and adds a smaller, faster flutter. Broad motion gives the field direction; fine motion keeps it from moving as one rigid sheet. Both feed into the same anchored bend we built earlier.\"},{\"kind\":\"code\",\"text\":\"float wave = fbm(iPos.xz * 0.13\\n  - uWindDir * uTime * 1.15) * 2.0 - 1.0;\\nfloat flutter = sin(uTime * 3.3 + phase * 2.1) * 0.09;\\nfloat force = max(0.0,\\n  uWind * (0.42 + uGust * wave) + flutter * uWind);\"},{\"kind\":\"p\",\"text\":\"Adjust Wind strength, Gust strength and Wind direction separately. Scrub Time to compare a particular moment, or press Play. The demos start paused and stop rendering offscreen. Reduced-motion preferences keep automatic playback still, while manual scrubbing remains available. Running fewer frames when nobody is looking is also a performance technique.\"},{\"kind\":\"image\",\"src\":\"/posts/making-stylized-grass/wind.png\",\"alt\":\"A desk fan blows three grass tufts beside a sign: A moving experience. AI-generated watercolor joke.\",\"width\":1536,\"height\":1024}]},{\"id\":\"interaction\",\"title\":\"Push the grass aside\",\"navTitle\":\"Touch \u0026 render\",\"demo\":\"grass-touch\",\"blocks\":[{\"kind\":\"p\",\"text\":\"We do not need to test the pointer against every triangle. Convert its screen position to a point on the ground, then pass that point and a radius to the shader. Each blade compares its root with that point and bends away. Nearby roots receive a stronger push; distant ones receive none.\"},{\"kind\":\"p\",\"text\":\"Smoothstep creates a gradual transition between zero and one. Without it, the edge of the interaction radius would form a visible ring of suddenly bent grass. The small minimum in the denominator prevents division by zero when the pointer is exactly on a root.\"},{\"kind\":\"code\",\"text\":\"vec2 d = iPos.xz - uBall.xz;\\nfloat k = 1.0 - smoothstep(\\n  uBall.w * 0.5, uBall.w * 2.1, length(d));\\npush += vec3(d.x, 0.0, d.y)\\n  / max(length(d), 0.001) * k * 1.7;\"},{\"kind\":\"p\",\"text\":\"Move across the patch, or use Push position with the keyboard. Radius controls the area of influence. This demo isolates the live push; the homepage also supplies eight fading positions to leave a short wake. A small set of shared inputs produces the effect without maintaining a separate physics simulation for every blade.\"}]},{\"id\":\"instances\",\"title\":\"Share the geometry\",\"demo\":\"grass-instances\",\"blocks\":[{\"kind\":\"p\",\"text\":\"We now have one blade mesh and a list of roots. Creating a scene object for each leaf would add CPU bookkeeping and many individual draw submissions. Instancing shares the mesh and supplies a compact record for each copy: its root, height, width, lean and variation. The GPU combines the shared strip with each record.\"},{\"kind\":\"p\",\"text\":\"The renderer uses Three.js InstancedBufferGeometry and custom attributes. Submitted blades changes its actual instanceCount, up to 200,000 in this experiment. Start low and increase it. Unlike Density cutoff, this control changes how many records are submitted for drawing; the cutoff keeps the records and filters blades in the shader. The displayed count is not a frame-rate benchmark.\"},{\"kind\":\"p\",\"text\":\"Instancing reduces overhead and duplicated geometry. It does not make 200,000 blades free: the GPU still processes their vertices and shades overlapping pixels. Keep detail, screen coverage and device capability in mind. A dense field viewed close up can be more expensive than a larger field occupying a small part of the screen.\"},{\"kind\":\"p\",\"text\":\"The ribbons also turn toward the camera around their vertical axis so they do not disappear edge-on. This is billboarding. Together with an orthographic camera, which does not shrink distant objects, it helps the meadow feel closer to a 2D illustration while retaining enough depth to orbit around.\"}]},{\"id\":\"your-meadow\",\"title\":\"Put the field together\",\"navTitle\":\"Try it\",\"demo\":\"grass-live\",\"blocks\":[{\"kind\":\"p\",\"text\":\"This final demo combines the same geometry, planting rules, terrain, colors and motion. It starts at 35,000 submitted blades and allows up to 200,000. Drag to orbit, scroll to zoom, or use the focus icon for more room. Compare roundness and width first, then terrain, color and wind. Keeping one variable fixed makes the next decision easier to see.\"},{\"kind\":\"p\",\"text\":\"Build your own version in this order: one ribbon, an anchored bend, a readable clump, repeatable placement, shared color, wind, then interaction. Decide what should look soft or sharp before increasing the detail budget. Art direction tells you what to preserve; performance work helps you preserve it at a useful frame rate.\"},{\"kind\":\"p\",\"text\":\"When a field feels wrong, inspect its outline and empty spaces before adding more blades. Often a clearer gap or a shorter edge does more than another thousand leaves. That is the nice part of this kind of rendering: sometimes the visual improvement also makes it cheaper.\"},{\"kind\":\"p\",\"text\":\"The grass renderer is on GitHub, at sangloo/stylized-grass: the same modules these demos run, with a small example you can turn and recolor. Follow the links below for what comes next.\",\"inline\":[\"The grass renderer is on GitHub, at \",{\"kind\":\"a\",\"href\":\"https://github.com/sangloo/stylized-grass\",\"children\":[\"sangloo/stylized-grass\"]},\": the same modules these demos run, with a small example you can turn and recolor. Follow the links below for what comes next.\"]},{\"kind\":\"p\",\"text\":\"Further reading: Three.js instanced geometry and shader materials.\",\"inline\":[\"Further reading: Three.js \",{\"kind\":\"a\",\"href\":\"https://threejs.org/docs/pages/InstancedBufferGeometry.html\",\"children\":[\"instanced geometry\"]},\" and \",{\"kind\":\"a\",\"href\":\"https://threejs.org/docs/pages/ShaderMaterial.html\",\"children\":[\"shader materials\"]},\".\"]}]}]},{\"no\":\"003\",\"slug\":\"gtm-engineering-explained-badly\",\"title\":\"GTM engineering, explained badly\",\"year\":2026,\"date\":\"September 29, 2026\",\"publishedAt\":\"2026-09-29\",\"minutes\":8,\"lede\":\"Three months, several acronyms, and an offsite proposal that should not have survived the meeting. By the end, you’ll have more questions.\",\"summary\":\"What GTM (go-to-market) engineering is, explained badly on purpose after three months in the job: ideal customer profiles, data enrichment, intent signals and automated workflows.\",\"sections\":[{\"id\":\"three-months\",\"title\":\"I changed jobs. Sort of.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"For the last three months, I’ve been doing GTM engineering. A little change from engineering engineering, where you spend the day explaining why something does not work. In GTM engineering, you spend the day explaining why something that works has not generated pipeline.\"},{\"kind\":\"p\",\"text\":\"Several people have asked me what that means. Fair question. I have had three months to prepare an answer, and I now own enough vocabulary to avoid giving one.\"},{\"kind\":\"p\",\"text\":\"So let’s fix that. By the end of this article, you will be able to sit in a GTM meeting, nod at the correct intervals, and say “interesting signal” without visibly reaching for help.\"},{\"kind\":\"p\",\"text\":\"Small disclaimer: this is the deliberately bad explanation. The campaign observation is real; the conversations, travel plans, and increasingly expensive conclusions below are comic dramatizations. A useful explanation will follow in another article. Today, usefulness is outside the scope.\"}]},{\"id\":\"definition\",\"title\":\"First, a very clear definition.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"GTM stands for go-to-market. Engineering means we have connected enough things together that unplugging one of them requires a meeting.\"},{\"kind\":\"p\",\"text\":\"Put them together and you get someone who helps the right message reach the right person at the right time, using data, software, and an unreasonable number of tabs.\"},{\"kind\":\"p\",\"text\":\"There. That was dangerously close to an explanation. Let’s make it a tad more complex.\"},{\"kind\":\"p\",\"text\":\"The right person belongs to the right account. The account fits the ICP. The ICP has intent. The intent becomes a signal. The signal enters a workflow. The workflow creates a task. The task goes to a person, who asks where this account came from.\"},{\"kind\":\"p\",\"text\":\"Excellent question. We have a dashboard for that.\"},{\"kind\":\"image\",\"src\":\"/posts/gtm-engineering-explained-badly/machine.png\",\"alt\":\"An engineer feeds a business card into a GTM machine that produces a mountain of acronyms and no money. AI-generated editorial cartoon.\",\"width\":1536,\"height\":1024}]},{\"id\":\"ideal-customer\",\"title\":\"We begin with the ideal person.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"ICP means ideal customer profile. You describe the sort of company that might benefit from what you sell. Size, industry, problems, all that sensible stuff.\"},{\"kind\":\"p\",\"text\":\"Our imaginary company sells software that makes meetings shorter. The ideal customer is therefore a company with meetings. This narrows the market to the market.\"},{\"kind\":\"p\",\"text\":\"Too broad. We add filters. More than fifty employees. Growing team. Recently hired someone whose title contains “operations.” Has publicly expressed an interest in efficiency, preferably during a forty-minute webinar.\"},{\"kind\":\"p\",\"text\":\"Now we have a highly specific list of companies that resemble the list we started with, but the spreadsheet is wider. This is segmentation. Please respect the process.\"}]},{\"id\":\"enrichment\",\"title\":\"The spreadsheet needs vitamins.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Next, we enrich the data. Enrichment means taking a row that knows very little about someone and helping it become considerably more confident.\"},{\"kind\":\"p\",\"text\":\"We find a company website, a job title, perhaps a company size. One source says sixty employees. Another says two hundred. The website says “a small team with a big mission.” So somewhere between sixty and a mission.\"},{\"kind\":\"p\",\"text\":\"We resolve this by assigning a confidence score. A confidence score is a number that allows uncertainty to wear a tie.\"},{\"kind\":\"p\",\"text\":\"Then we deduplicate. This is where David Smith, Dave Smith, and D. Smith become one person, unless they are three people, in which case we have achieved efficiency at the expense of David.\"},{\"kind\":\"p\",\"text\":\"No worries. We can fix it downstream. Downstream is a wonderful place. Every department has one, and nobody appears to work there.\"},{\"kind\":\"image\",\"src\":\"/posts/gtm-engineering-explained-badly/uncertainty-tie.png\",\"alt\":\"An earnest worker gives a giant question mark a necktie while a skeptical colleague watches. AI-generated editorial cartoon.\",\"width\":1536,\"height\":1024}]},{\"id\":\"signals\",\"title\":\"Someone has done something.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A signal is an event that might suggest a relevant moment to contact a company. They hired someone. They opened an office. A real event, with context, can be useful.\"},{\"kind\":\"p\",\"text\":\"In our increasingly fictional workflow, a prospect likes a post about saving time. This tells us they may want to save time. Or they like the person who wrote it. Or their thumb slipped while they were saving time.\"},{\"kind\":\"p\",\"text\":\"We give the event fourteen points.\"},{\"kind\":\"p\",\"text\":\"Why fourteen? Ten felt arbitrary.\"},{\"kind\":\"p\",\"text\":\"At fifty points, the account becomes hot. At seventy, very hot. At ninety, someone says “we should probably reach out.” We have built a thermometer for a conversation that has not happened.\"}]},{\"id\":\"personalization\",\"title\":\"Dear individual human,\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Now we personalize the outreach. People dislike receiving a message that could have been sent to anyone, so we build a system that can send everyone a message that could only have been sent to them.\"},{\"kind\":\"p\",\"text\":\"“Hi David, noticed you’re the Head of Operations at a company. As a Head of Operations at a company, you probably care about operations.”\"},{\"kind\":\"p\",\"text\":\"Uncanny. How did we know?\"},{\"kind\":\"p\",\"text\":\"We improve the prompt. We add context. We remove “hope this finds you well.” We put it back because the new opening sounds like a detective confronting a suspect.\"},{\"kind\":\"p\",\"text\":\"Eventually we produce an email so natural that three engineers and a language model agree a human might have written it. The human replies, “Not interested.”\"},{\"kind\":\"p\",\"text\":\"A reply! Mark that as engagement.\"}]},{\"id\":\"campaign\",\"title\":\"Then LinkedIn gave us an idea.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Here is the actual observation that sent my brain off on a small holiday: in a LinkedIn campaign, our women BDRs were getting roughly twice the connection acceptance rate of our men BDRs. BDR means business development representative. The people doing the reaching out. We were almost educational again. Sorry.\"},{\"kind\":\"p\",\"text\":\"That result alone does not tell us why. Profiles, audiences, messages, timing—there are plenty of things to investigate before announcing that we have discovered a law of human behavior.\"},{\"kind\":\"p\",\"text\":\"Naturally, in the completely irresponsible meeting taking place inside this article, we investigate none of them.\"},{\"kind\":\"p\",\"text\":\"“What if,” I ask, with the calm authority of a man about to misuse a spreadsheet, “next year’s offsite was in Thailand?”\"},{\"kind\":\"p\",\"text\":\"Silence. Someone stops sharing their screen. David and Sean would like to know what this has to do with team building.\"},{\"kind\":\"p\",\"text\":\"Everything, gentlemen. We are becoming data-driven.\"}]},{\"id\":\"offsite\",\"title\":\"David and Sean enter the funnel.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The imaginary offsite now has a costume party, a slide deck, and no return ticket to common sense. Thailand supplies the sunshine. We supply the questionable business reasoning.\"},{\"kind\":\"p\",\"text\":\"In the imaginary offsite presentation, David and Sean reappear as glamorous lady alter egos, armed with wigs, excellent outfits, and the same unresolved CRM permissions. They are visibly delighted to have negotiated the costume budget before anyone checked the hypothesis.\"},{\"kind\":\"p\",\"text\":\"David asks whether the new persona gets a higher base salary. Sean asks whether false eyelashes count as sales enablement. Finance asks whether this could have been a webinar.\"},{\"kind\":\"p\",\"text\":\"The women on the team point out that perhaps we could test the targeting and messages first.\"},{\"kind\":\"p\",\"text\":\"Very sensible. Unfortunately, the slide already says “International Growth Strategy,” and the diagram contains an airplane. You cannot put an airplane back in a box once leadership has seen it.\"},{\"kind\":\"p\",\"text\":\"Nobody changes anything except outfits. The experiment still has no control group. The wigs have better methodology than the deck.\"},{\"kind\":\"image\",\"src\":\"/posts/gtm-engineering-explained-badly/offsite.png\",\"alt\":\"Fictional David and Sean in glamorous costume-party outfits present a chart that leaps from two bars to an airplane, while a colleague questions the reasoning. AI-generated editorial cartoon, not portraits.\",\"width\":1536,\"height\":1024}]},{\"id\":\"conversion\",\"title\":\"We doubled the thing before the thing.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Then somebody asks the worst possible question: “Did the extra accepted connections become useful conversations?”\"},{\"kind\":\"p\",\"text\":\"I beg your pardon. We were celebrating.\"},{\"kind\":\"p\",\"text\":\"A connection is not a meeting. A meeting is not a customer. A customer is not automatically a happy customer. Somewhere along this chain, somebody must actually want what we sell. This introduces a troubling dependency on the product.\"},{\"kind\":\"p\",\"text\":\"Our fictional dashboard solves the problem by showing the first number in very large green type and placing the other numbers under a collapsed section called “Advanced.”\"},{\"kind\":\"p\",\"text\":\"David and Sean are still in the presentation. Their costumes have become a fixed cost. We are now emotionally invested in the hypothesis, which is the most expensive kind of investment because it does not appear in the budget.\"},{\"kind\":\"image\",\"src\":\"/posts/gtm-engineering-explained-badly/celebrating-connections.png\",\"alt\":\"Office workers celebrate a giant upward arrow while a colleague inspects an empty cash drawer. AI-generated editorial cartoon.\",\"width\":1536,\"height\":1024}]},{\"id\":\"automation\",\"title\":\"Luckily, we can automate this.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A webhook is one system telling another system that something happened. Imagine a doorbell, except the doorbell rings another doorbell, which updates a spreadsheet, which sends a message saying the first doorbell could not be reached.\"},{\"kind\":\"p\",\"text\":\"This is my comfortable territory. Finally, a normal engineering problem: retries, missing fields, rate limits, and a timestamp that has arrived from tomorrow.\"},{\"kind\":\"p\",\"text\":\"We build a workflow. A new signal enriches a contact, scores an account, assigns an owner, and creates a task. A human checks the result before anything embarrassing leaves the building. Even in this article, we can afford that step.\"},{\"kind\":\"p\",\"text\":\"The workflow saves six minutes. Maintaining it takes an afternoon. But next week it might save six minutes several thousand times, which is either leverage or the beginning of a support rotation.\"},{\"kind\":\"p\",\"text\":\"We document it with a diagram. The diagram is too wide for the screen. We have achieved architecture.\"},{\"kind\":\"image\",\"src\":\"/posts/gtm-engineering-explained-badly/doorbell-workflow.png\",\"alt\":\"An engineer proudly presents a tangled chain of office doorbells to deliver one message. AI-generated editorial cartoon.\",\"width\":1536,\"height\":1024}]},{\"id\":\"attribution\",\"title\":\"Who gets the credit?\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Imagine somebody eventually buys our meeting software. Great. Why did they buy it?\"},{\"kind\":\"p\",\"text\":\"Sales says the call. Marketing says the campaign. The product team says the product. The customer says a colleague recommended it, which is inconvenient because the colleague is not connected to our attribution model.\"},{\"kind\":\"p\",\"text\":\"First-touch attribution gives credit to the first interaction. Last-touch attribution gives credit to the last one. Our imaginary all-touch attribution gives credit to everyone, producing four customers from one invoice. Remarkable efficiency.\"},{\"kind\":\"p\",\"text\":\"The GTM engineer connects the systems so we can examine what happened. Then the systems disagree, and the GTM engineer becomes a diplomat with API keys.\"},{\"kind\":\"p\",\"text\":\"I used to debug software. Now I debug the sentence “this lead should have been mine.” Career growth takes many forms.\"}]},{\"id\":\"did-you-get-it\",\"title\":\"So. Did you get it?\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Let’s recap. We find the right companies, learn enough to approach them sensibly, notice useful moments, build the plumbing, and measure whether any of it helps.\"},{\"kind\":\"p\",\"text\":\"That sounds almost manageable. Please ignore it.\"},{\"kind\":\"p\",\"text\":\"What we actually do is operationalize an intent-led, signal-enriched, multi-touch revenue motion across the entire customer lifecycle, with a human in the loop and Sean in a very good wig.\"},{\"kind\":\"p\",\"text\":\"Did you get it?\"},{\"kind\":\"p\",\"text\":\"No? Perfect. You are ready for the kickoff.\"},{\"kind\":\"p\",\"text\":\"Your first task is to explain GTM engineering to someone else. If they understand, add another arrow. If they ask about revenue, tell them the dashboard is refreshing. If they ask about Thailand, that initiative is currently downstream.\"},{\"kind\":\"p\",\"text\":\"I’ll write the useful version next: what we actually build, what we measure, and where the engineering helps. For now, I’ve been doing this for three months, and I can confidently say one thing.\"},{\"kind\":\"p\",\"text\":\"We should probably test the message before booking the flight.\"}]}]},{\"no\":\"001\",\"slug\":\"the-boring-state-of-artificial-intelligence\",\"title\":\"The boring state of artificial intelligence\",\"year\":2023,\"date\":\"April 17, 2023\",\"publishedAt\":\"2023-04-17\",\"sourceUrl\":\"https://medium.com/@khalil.alami/the-boring-state-of-artificial-intelligence-152244075d7f\",\"minutes\":24,\"lede\":\"I recently had a debate with a colleague of mine about the intelligence and crazy advancement of AI models in recent months.\",\"sections\":[{\"id\":\"a-friendly-bet\",\"title\":\"A bet at work\",\"blocks\":[{\"kind\":\"p\",\"text\":\"I recently had a debate with a colleague of mine about the intelligence and crazy advancement of AI models in recent months.\"},{\"kind\":\"p\",\"text\":\"While some people are in awe of AI, I don’t quite share their excitement or fear of its current advancements. And so… to make things interesting we made a bet that I would fall for the current AI hype within six months 🙃️.\"},{\"kind\":\"p\",\"text\":\"So, I thought it would be fun to write this blog post and share my perspective in the hopes of convincing a few other bored souls to join my side of the conversation!\"},{\"kind\":\"p\",\"text\":\"Disclaimer N 1 :: This is my first time … writing a blog post (or anything else to be honest), so i’ll do my best 😤.\"}],\"navTitle\":\"The bet\"},{\"id\":\"the-hype\",\"title\":\"Chapter 1: Why are people so hyped/frightened about AI?\",\"blocks\":[{\"kind\":\"h2\",\"text\":\"The first issue is what I like to call the “Wikipedia scientist” syndrome:\"},{\"kind\":\"p\",\"text\":\"This refers to the common tendency for people who lack knowledge in a particular subject to believe that reading one or two articles on the topic makes them an expert. However, this is far from the truth. True mastery of a subject requires much more than just a surface-level understanding. It takes a strong theoretical foundation and, most importantly a humongous amount of practice to develop real expertise.\"},{\"kind\":\"p\",\"text\":\"If you want to become an artist, for example, it will take more than just reading a few books. You’ve got to grab a pen, a brush, or whatever you fancy and start creating. Draw, paint, experiment, and embrace failure until you start to get the hang of it. It takes months, if not years, of hard work and dedication to become a true artist. Of course, if you’re a genius, you might get there a bit quicker! Similarly, reading a blog post, a Wikipedia article, a book, or even a hundred books about rocket science or artificial intelligence won’t make you an expert.\",\"inline\":[\"If you want to become an artist, for example, it will take more than just reading a few books. You’ve got to grab a pen, a brush, or whatever you fancy and start creating. Draw, paint, experiment, and embrace failure until you start to get the hang of it. It takes months, if not years, of hard work and dedication to become a true artist. \",{\"kind\":\"em\",\"children\":[\"Of course, if you’re a genius, you might get there a bit quicker! \",{\"kind\":\"br\"}]},\"Similarly, reading a blog post, a Wikipedia article, a book, or even a hundred books about rocket science or artificial intelligence won’t make you an expert.\"]},{\"kind\":\"p\",\"text\":\"However, the real problem arises when some of these Wikipedia scientists have a large audience of followers -sometimes very religious followers-. This can be particularly concerning, as their lack of genuine expertise and experience can result in the spread of misguided advice and misinformation. It is important to be discerning about the sources of information we rely on and to seek advice from true experts.\",\"inline\":[\"However, the real problem arises when some of these Wikipedia scientists have a large audience of followers -\",{\"kind\":\"em\",\"children\":[\"sometimes very religious followers\"]},\"-. This can be particularly concerning, as their lack of genuine expertise and experience can result in the spread of misguided advice and misinformation. It is important to be discerning about the sources of information we rely on and to seek advice from \",{\"kind\":\"strong\",\"children\":[\"true experts.\"]}]},{\"kind\":\"h2\",\"text\":\"The second issue is “The Early Optimistic” Syndrome :\"},{\"kind\":\"p\",\"text\":\"This tends to occur whenever a new technology first appears. For example, when cars were first invented, people immediately began dreaming of flying cars and futuristic cities, believing that these innovations would appear overnight. More than a hundred years later and ….\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/01.gif\",\"alt\":\"Animated reaction to stop-and-go traffic.\",\"width\":435,\"height\":243},{\"kind\":\"p\",\"text\":\"With AI, this phenomenon has occurred for the N-th time in history. Over the past century, new breakthroughs in AI have arisen every few years, leading people to become overly excited and start making wild predictions about sentient AI, robots taking over, the end of the world, and other bla-bla-bullshit.\"},{\"kind\":\"p\",\"text\":\"Disclaimer N 2 :: Let’s get one thing straight right off the bat. I am by no mean an expert. I’ve been working as a Data Scientist/ Engineer for ~6 years now and i still lack a lo-ooooooo-t. So most of what i’ll be sharing is my own personal understaing of the matter and not the absolute truth. Take it with a grain of salt.With that said, buckle up and let’s dive into the boring/bored and very opniated realm of what i think!\",\"inline\":[\"Disclaimer N 2 :: Let’s get one thing straight right off the bat. I am by no mean an expert. I’ve been working as a Data Scientist/ Engineer for ~6 years now and i still lack a lo-ooooooo-t. So most of what i’ll be sharing is my own personal understaing of the matter and not the absolute truth. Take it with a grain of salt.\",{\"kind\":\"br\"},\"With that said, buckle up and let’s dive into the boring/bored and very opniated realm of what i think!\"]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/02.png\",\"alt\":\"Salt Bae meme: take this with a grain of salt.\",\"width\":700,\"height\":311}],\"navTitle\":\"The hype\"},{\"id\":\"what-is-ai\",\"title\":\"Chapter 2: What is Artificial Intelligence?\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Now that introductions have been introduced let’s dive into the meat of the matter!\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/03.png\",\"alt\":\"Two surreal illustrations introducing AI and the topic of discussion.\",\"width\":700,\"height\":311},{\"kind\":\"p\",\"text\":\"So what is AI?\"},{\"kind\":\"p\",\"text\":\"Here, I’m mostly referring to neural networks. Under suitable conditions and with enough capacity, they are universal approximators. This is the universal approximation theorem, with foundational results by George Cybenko (1989) and Kurt Hornik, Maxwell Stinchcombe, and Halbert White (1989). It means they can approximate continuous functions on a closed, bounded domain arbitrarily closely—not that training will necessarily find the right approximation.\",\"inline\":[\"Here, I’m mostly referring to neural networks. Under suitable conditions and with enough capacity, they are universal approximators. This is the \",{\"kind\":\"a\",\"href\":\"https://en.wikipedia.org/wiki/Universal_approximation_theorem\",\"children\":[\"universal approximation theorem\"]},\", with foundational results by \",{\"kind\":\"a\",\"href\":\"https://doi.org/10.1007/BF02551274\",\"children\":[\"George Cybenko (1989)\"]},\" and \",{\"kind\":\"a\",\"href\":\"https://doi.org/10.1016/0893-6080(89)90020-8\",\"children\":[\"Kurt Hornik, Maxwell Stinchcombe, and Halbert White (1989)\"]},\". It means they can approximate continuous functions on a closed, bounded domain arbitrarily closely—not that training will necessarily find the right approximation.\"]},{\"kind\":\"p\",\"text\":\"That’s it?\"},{\"kind\":\"p\",\"text\":\"No. For now, that’s all that matters and what you should remember more than anything else for the rest of this blog post and the rest of your life!If you want a more boring yet comprehensive definition of AI you can just Wikipedia it 😉\",\"inline\":[\"No. For now, that’s all that matters and what you should remember more than anything else for the rest of this blog post and the rest of your life!\",{\"kind\":\"br\"},\"If you want a more boring yet comprehensive definition of AI you can just \",{\"kind\":\"a\",\"children\":[\"Wikipedia it\"],\"href\":\"https://en.wikipedia.org/wiki/Artificial_intelligence\"},\" 😉\"]},{\"kind\":\"p\",\"text\":\"Disclaimer N 3:: The term “art” is broad and sometimes subjective, encompassing a wide range of creative expressions such as visual arts, performing arts, literature, and more. In this context, I will be specifically referring to 2D art as it is currently the primary medium for Generative Art models.\"}],\"navTitle\":\"What is AI?\"},{\"id\":\"the-artist\",\"title\":\"Chapter 3: Midjourney the Artist AI?\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Our initial exploration will delve into Generative Art models, with a particular emphasis on examining the extent to which they can be considered true artists.\"},{\"kind\":\"p\",\"text\":\"So what is it that makes a true Artist?\"},{\"kind\":\"p\",\"text\":\"That’s an interesting question😤! In my opinion, there are three main components that make a great artist: technical skills, creativity, and control.\"},{\"kind\":\"list\",\"items\":[[\"Technical skills involve a deep understanding and mastery of art fundamentals, such as color theory, form, lighting, anatomy, and composition…. All of these art fundamentals can be defined as pure and beautiful mathematical functions. \",{\"kind\":\"br\"},\"Fundamentals such as anatomy require a high level of precision with very little margin for error.- \",{\"kind\":\"em\",\"children\":[\"if an artist draws the nose or the hand even slightly inaccurately, it will be noticeable and may detract from the overall quality of the art piece. However, intentionally distorting or exaggerating these features can be a deliberate artistic choice that requires an even greater mastery of anatomy. This level of skill allows an artist to manipulate the human form to their will, resulting in a unique and expressive style\"]},\".\",{\"kind\":\"br\"},\"Other fundamentals like the color theory can be inferred. Many artists discover or rediscover the different equations of color through experimentation, which allows for greater creativity and innovation in their work.\"]]},{\"kind\":\"p\",\"text\":\"Below is An example of an anatomical study by Michale Angelo.\"},{\"kind\":\"p\",\"text\":\"The study of human anatomy, in particular, is considered one of the most challenging technical skills for artists to acquire. Some artists even dedicate their entire lives to mastering this subject.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/04.jpeg\",\"alt\":\"Anatomical drawings of the human torso and limbs by Michelangelo.\",\"width\":700,\"height\":394}],\"navTitle\":\"The artist\"},{\"id\":\"creativity-and-control\",\"title\":\"Creativity and control\",\"blocks\":[{\"kind\":\"list\",\"items\":[[\"Creativity is the personal and unique characteristic that defines an artist’s style and imagination. It’s what sets them apart from other artists and allows them to create something truly original and captivating.\"],[\"Control is one of the most challenging skills for any artist. It requires a combination of technical and creative expertise at their highest level. Control is the ability to intentionally manipulate every brush stroke on the canvas with the purpose of eliciting a desired emotional response from the viewer — \",{\"kind\":\"em\",\"children\":[\"whether it be deception, anger, or joy. Every aspect of the artwork, including the colors, lighting, and posture, has a specific meaning and intention behind it\"]},\". A truly skilled artist is able to execute this level of control with finesse and precision, resulting in a work of art that is both captivating and meaningful.\"]]},{\"kind\":\"p\",\"text\":\"An example of an art piece by Piotr Jabłoński , one of my favorite digital artists who demonstrate exceptional mastery in the areas of lighting, color, composition, anatomy, and a unique, unsettling imagination.\",\"inline\":[\"An example of an art piece by \",{\"kind\":\"a\",\"children\":[\"Piotr Jabłoński\"],\"href\":\"https://www.artstation.com/nicponim\"},\" , one of my favorite digital artists who demonstrate exceptional mastery in the areas of lighting, color, composition, anatomy, and a unique, unsettling imagination.\"]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/05.jpeg\",\"alt\":\"Dark fantasy artwork by Piotr Jabłoński.\",\"width\":700,\"height\":936},{\"kind\":\"p\",\"text\":\"Alfred Broge’s “Morning Sunlight” is a beautiful traditional painting that showcases the artist’s mastery of his craft. In fact, many of Broge’s works are considered masterpieces because of the exceptional care and precision he put into every detail. There is very little to criticize in his paintings, as they are executed with such skill and artistry.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/06.jpeg\",\"alt\":\"Morning Sunlight by Alfred Broge: a woman stands in a sunlit doorway.\",\"width\":700,\"height\":525}]},{\"id\":\"midjourney\",\"title\":\"Evaluating Midjourney\",\"blocks\":[{\"kind\":\"p\",\"text\":\"So, can Midjourney be called a true Artist?\"},{\"kind\":\"p\",\"text\":\"In short, the answer is yes. The reason I have chosen to focus on Midjourney as opposed to Stable diffusion or Dall-e is because I believe the individuals behind the Midjourney model possess a keen sensitivity to art.\",\"inline\":[\"In short, the answer is yes. \",{\"kind\":\"br\"},\"The reason I have chosen to focus on Midjourney as opposed to Stable diffusion or Dall-e is because I believe the individuals behind the Midjourney model possess a keen sensitivity to art.\"]},{\"kind\":\"p\",\"text\":\"In my opinion, the quality of the art produced by Midjourney can be attributed to both the dataset and loss function used during training. While Stable Diffusion and Dall-e were trained using a brute force approach, which prioritizes quantity over quality of images during training, it’s possible that Stable Diffusion was trained on a curated dataset. Additionally, it’s possible that some of the art fundamentals were incorporated into the loss function used during training, penalizing the model for producing images that don’t meet a certain standard of quality.\"},{\"kind\":\"p\",\"text\":\"By exclusively being trained on high-quality art pieces, the model is not even familiar with mediocre art, but.\"},{\"kind\":\"p\",\"text\":\"But that’s not enough, While Midjourney may produce amazing art pieces. It is far from being even a good artist.\"},{\"kind\":\"p\",\"text\":\"Let’s evaluate it based on the various components that make an artist.\"},{\"kind\":\"list\",\"items\":[[\"When it comes to technical skills such as lighting, color, and composition, Midjourney’s performance is impressive and may even surpass that of many existing artists.\",{\"kind\":\"br\"},\"However, its performance in terms of anatomy and overall structure is not as strong. The model has been observed to generate some extremely poor anatomical structures for humans and other living or imaginary creatures. Additionally, there are noticeable issues with the overall structure of the generated drawings, such as irregular shapes, misplaced elements, and a lack of coherence.\"],[\"In terms of Creativity and Imagination, it is very hard to judge. \",{\"kind\":\"br\"},\"Imagination is viewed as the ability to form mental images or concepts of things that are not present in the physical environment or that have never been experienced before\",{\"kind\":\"br\"},\"However, this definition can be misleading as it implies that imagination is a mystical or innate ability that requires a special kind of genius.\",{\"kind\":\"br\"},\"In art, imagination is referred to as a “\",{\"kind\":\"strong\",\"children\":[\"visual library\"]},\"”. To improve their imagination skills, artists often begin by studying existing subjects, such as animals, objects, and scenery, and learning to manipulate them through drawing from different perspectives, under different lighting conditions …. Once an artist has mastered a subject, it becomes part of their visual library and can be incorporated into future works, either wholly or partially. Building a large visual library provides artists with the ability to combine elements at will, resulting in the creation of imaginary creatures and fantastical scenery.\",{\"kind\":\"br\"},\"With that in mind, it’s clear that Midjourney possesses an incredibly vast visual library compared to any human artist, having been trained on millions of images. Thus, when it comes to imagination, Midjourney reigns supreme, but.\"],[\"Although Midjourney possesses an extensive visual library that enables it to produce highly imaginative and precise images, it does not actually create art. It is the prompter who provides the input and guidance to generate a specific image. Developing one’s own personal visual library can be a challenging and time-consuming process. Midjourney can be seen more as a tool that enables artists to skip the arduous process of building a personal visual library and instead focus on the art of the matter.\"],[\"In terms of control, there isn’t much to discuss, since Midjourney doesn’t independently create art. Even if we omit this part, the generated art lacks a specific direction or style, it is just random noise shaped to mathematically fit a certain input.\"]]}]},{\"id\":\"artistic-choices\",\"title\":\"Artistic choices\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Disclaimer N 4:: Art is a highly subjective field, and while certain fundamentals may be considered more essential than others, there is no set formula for creating great art. Midjourney apart, many artists deliberately choose to focus on a limited number of fundamentals and can still create astonishing pieces.\"},{\"kind\":\"p\",\"text\":\"In this art piece by Nathan Fawkes. The focus is not on anatomy or structure. Instead, this piece is a study of color and light, with the artist choosing to abstract any details that do not contribute to this goal. As a result, the piece showcases Fawkes’ ability to use color and light in a way that captivates the viewer, while also demonstrating his willingness to prioritize certain fundamentals over others.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/07.png\",\"alt\":\"Nathan Fawkes study of a building, emphasizing color and light.\",\"width\":700,\"height\":702},{\"kind\":\"p\",\"text\":\"On the other hand, Steve Huston, an anatomy master, has created a masterful painting that focuses mostly on the subject’s anatomy and gesture. In this piece, Huston demonstrates his skill in capturing the intricate details of the subject’s anatomical structure while also conveying a sense of movement and expression through the subject’s gesture. The painting showcases Huston’s ability to prioritize and emphasize specific artistic elements, in this case, anatomy and gesture, to create a powerful and engaging work of art.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/08.jpeg\",\"alt\":\"Steve Huston painting of a working man, emphasizing anatomy and gesture.\",\"width\":700,\"height\":466},{\"kind\":\"p\",\"text\":\"In conclusion, while Midjourney’s capacity for generating high-quality images is impressive, it cannot be qualified as an artist in the traditional sense of the term. Midjourney lacks the creative spark, intentionality, and emotional resonance that characterize human-made art. the art generated by Midjourney is not the product of personal expression or cultural context, nor is it part of any larger artistic tradition. Midjourney generates images based on statistical patterns it has learned from its training dataset, without any underlying purpose or meaning. While these algorithms can simulate various styles and techniques, they cannot replicate the nuanced and subjective decision-making that goes into human-made art.\"},{\"kind\":\"p\",\"text\":\"Disclaimer N 5:: I chose to start the discussion on AI with the topic of generative art to establish a common ground for all readers. Art is something that everyone has some degree of familiarity with. By doing so, it will be easier for everyone to comprehend the concepts being discussed …\"}]},{\"id\":\"sparks-of-agi\",\"title\":\"Chapter 4: Sparks of AGI (Artificial General Intelligence) in chatGPT?\",\"blocks\":[{\"kind\":\"p\",\"text\":\"To begin, it’s important to address the concept of intelligence and its definition. Next, we’ll compare it to the current AI models and the way they function to finally try and answer the question of AGI.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/09.png\",\"alt\":\"Illustration of an athletic goat introducing the discussion of intelligence.\",\"width\":700,\"height\":241},{\"kind\":\"p\",\"text\":\"Intelligence is a fascinating and intricate concept that has sparked countless debates among psychologists, philosophers, and computer scientists over the years. While there is no single, all-encompassing definition of intelligence, there is a global-” ish” consensus that intelligence involves a range of mental abilities, including reasoning, planning, problem-solving, abstract thinking, comprehending complex ideas, learning quickly, and applying knowledge gained from experience. -source: https://arxiv.org/pdf/2303.12712.pdf.\",\"inline\":[{\"kind\":\"em\",\"children\":[\"Intelligence is a fascinating and intricate concept that has sparked countless debates among psychologists, philosophers, and computer scientists over the years. While there is no single, all-encompassing definition of intelligence, there is a global-” ish” consensus that intelligence involves a range of mental abilities, including reasoning, planning, problem-solving, abstract thinking, comprehending complex ideas, learning quickly, and applying knowledge gained from experience.\"]},\" -\",{\"kind\":\"em\",\"children\":[\"source: \"]},{\"kind\":\"a\",\"children\":[{\"kind\":\"em\",\"children\":[\"https://arxiv.org/pdf/2303.12712.pdf\"]}],\"href\":\"https://arxiv.org/pdf/2303.12712.pdf\"},{\"kind\":\"em\",\"children\":[\".\"]}]},{\"kind\":\"p\",\"text\":\"The paper titled “Sparks of Artificial General Intelligence: Early Experiments with GPT-4” provides a detailed analysis of each characteristic of intelligence and its relevance to artificial intelligence.So let’s take a different approach.\",\"inline\":[\"The paper titled “\",{\"kind\":\"a\",\"children\":[{\"kind\":\"strong\",\"children\":[\"Sparks of Artificial General Intelligence: Early Experiments with GPT-4\"]}],\"href\":\"https://arxiv.org/pdf/2303.12712.pdf\"},\"” provides a detailed analysis of each characteristic of intelligence and its relevance to artificial intelligence.\",{\"kind\":\"br\"},\"So let’s take a different approach.\"]},{\"kind\":\"p\",\"text\":\"To define intelligence in a manner that enables easy comparison and highlights the differences between human and machine intelligence, I would propose the following definition:\"},{\"kind\":\"p\",\"text\":\"I believe that Intelligence can be described as the ability to use existing information in novel ways, either by applying it to a different field or by creating entirely new knowledge and extending the boundaries of the information domain.\"},{\"kind\":\"p\",\"text\":\"ok, let’s see it in action to have a better understanding:\"},{\"kind\":\"p\",\"text\":\"One of the first events in human history and what did set us apart from other species is fyre-🤓- manipulation. We were able to manipulate existing information -In this case, the information was natural occurrences of fire in nature- to our advantage and create entirely new uses for it.By using fire, we started to cook our food, shape metal, and carry out countless other activities that were previously nonexistent.\",\"inline\":[\"One of the first events in human history and what did set us apart from other species is fyre-🤓- manipulation. We were able to manipulate existing information -\",{\"kind\":\"em\",\"children\":[\"In this case, the information was natural occurrences of fire in nature\"]},\"- to our advantage and create entirely new uses for it.\",{\"kind\":\"br\"},\"By using fire, we started to cook our food, shape metal, and carry out countless other activities that were previously nonexistent.\"]},{\"kind\":\"p\",\"text\":\"While it may appear to be a simple task on the surface, in reality, it is incredibly complex and demands a tremendous amount of intellectual capacity. This is why I believe that the ability to manipulate and harness information in new manners is what intelligence is.\"},{\"kind\":\"p\",\"text\":\"A more visual representation of this concept is shown below. The black box represents the entirety of information that exists. The blue portion represents the combined information domain of all humans, and the white dots represent the personal information domain of a single individual -the scale is not accurate or relevant in this representation-. One of the key factors that distinguishes humans from other beings is our unique ability to expand our domain of information beyond what is currently known or understood.\",\"inline\":[\"A more visual representation of this concept is shown below. The black box represents the entirety of information that exists. The blue portion represents the combined information domain of all humans, and the white dots represent the personal information domain of a single individual -the scale is not accurate or relevant in this representation-. \",{\"kind\":\"br\"},\"One of the key factors that distinguishes humans from other beings is our unique ability to expand our domain of information beyond what is currently known or understood.\"]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/10.png\",\"alt\":\"Diagram of all information, humanity’s knowledge, and individual information domains.\",\"width\":700,\"height\":311}],\"navTitle\":\"Sparks of AGI?\"},{\"id\":\"a-simple-network\",\"title\":\"A simple neural network\",\"blocks\":[{\"kind\":\"p\",\"text\":\"To gain a better understanding of neural networks, let’s construct a simple theoretical network and build upon it to explore the workings of artificial intelligence.\"},{\"kind\":\"p\",\"text\":\"Our initial network will be a basic one that can perform simple addition. This network will consist of two inputs that will take in two numbers, and the output will be the sum of those two numbers.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/11.png\",\"alt\":\"A neural network with two inputs and one output for addition.\",\"width\":700,\"height\":219},{\"kind\":\"p\",\"text\":\"If you remember well, neural networks with suitable activations and enough capacity are universal approximators. But what does this mean exactly? From the moment it is created, a neural network has the ability to approximate any function -that is as complex as the model is built to support. In this case, our NN is very small and can only learn relatively simple functions-However, the initial output will not be correct, as the function has not been trained yet. This is where the process of training comes in.\",\"inline\":[\"If you remember well, neural networks with suitable activations and enough capacity are \",{\"kind\":\"a\",\"href\":\"https://en.wikipedia.org/wiki/Universal_approximation_theorem\",\"children\":[\"universal approximators\"]},\". But what does this mean exactly? \",{\"kind\":\"br\"},\"From the moment it is created, a neural network has the ability to approximate any function -\",{\"kind\":\"em\",\"children\":[\"that is as complex as the model is built to support. In this case, our NN is very small and can only learn relatively simple functions\"]},\"-However, the initial output will not be correct, as the function has not been trained yet. This is where the process of training comes in.\"]},{\"kind\":\"p\",\"text\":\"To train a neural network, we need to provide it with a set of training data and a loss function. The loss function serves as an objective for the model to minimize, guiding the training process. During training, the network updates the weights of its neurons to create better approximations. The output of the network is compared to the ground truth output -which is the desired output- and the model adjusts the weights of the neurons to minimize the difference between the output and the ground truth.\",\"inline\":[\"To train a neural network, we need to provide it with a set of training data and a loss function. The loss function serves as an objective for the model to minimize, guiding the training process. During training, the network updates the weights of its neurons to create better approximations. The output of the network is compared to the ground truth output -\",{\"kind\":\"em\",\"children\":[\"which is the desired output\"]},\"- and the model adjusts the weights of the neurons to minimize the difference between the output and the ground truth.\"]},{\"kind\":\"p\",\"text\":\"In essence, training a neural network involves teaching it to improve the weights of its neurons, thereby making the initial approximate function more useful.\"},{\"kind\":\"p\",\"text\":\"In this example, the NN did not truly learn how to perform addition, but rather, it learned a highly accurate approximation function that mimics addition. This function is simply an encoding of the training dataset. Consequently, the network is only capable of performing addition and lacks the ability to perform other basic arithmetic operations such as subtraction or multiplication.\"},{\"kind\":\"p\",\"text\":\"To address this limitation, we can modify the network architecture to support additional operations. We can introduce a third input that specifies the type of operation to be performed -e.g., addition, subtraction, multiplication, or division-. We can also increase the number of neurons in the network to enable it to encode more complex information.\",\"inline\":[\"To address this limitation, we can modify the network architecture to support additional operations. We can introduce a third input that specifies the type of operation to be performed -\",{\"kind\":\"em\",\"children\":[\"e.g., addition, subtraction, multiplication, or division-\"]},\". We can also increase the number of neurons in the network to enable it to encode more complex information.\"]},{\"kind\":\"p\",\"text\":\"By incorporating these changes, we can train the neural network with our new dataset so that it learns to perform multiple arithmetic operations and enable it to learn a broader range of functions.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/12.png\",\"alt\":\"An expanded neural network with three inputs for multiple arithmetic operations.\",\"width\":700,\"height\":219},{\"kind\":\"p\",\"text\":\"Disclaimer N 5:: Drawing these NN graphs is very boring and annoying. i will assume that now you have enough knowledge to imagine the next description of NN yourself\"}]},{\"id\":\"a-talking-calculator\",\"title\":\"A calculator that talks\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Now let’s improve our model further. Instead of just feeding it two numbers, let’s use natural language as input to perform arithmetic operations. For example, we can ask our model, “Can you please give me the sum of 12 and 35?” and it will respond with a natural language output like, “Sure, the result of 12 + 35 is 47.” To achieve this, we can utilize a large language model -a variant of GPT-, and train it to perform this specific task.\",\"inline\":[\"Now let’s improve our model further. Instead of just feeding it two numbers, let’s use natural language as input to perform arithmetic operations. For example, we can ask our model, “Can you please give me the sum of 12 and 35?” and it will respond with a natural language output like, “Sure, the result of 12 + 35 is 47.” To achieve this, we can utilize a large language model -\",{\"kind\":\"em\",\"children\":[\"a variant of GPT\"]},\"-, and train it to perform this specific task.\"]},{\"kind\":\"p\",\"text\":\"Can our model be considered intelligent now?\"},{\"kind\":\"p\",\"text\":\"No, our NN model is just a calculator, albeit a less perfect one compared to the default calculator. The real value of large language models like GPT lies in their ability to understand and process natural language input, which enables us to perform tasks like arithmetic operations without the need for a separate calculator application.\"},{\"kind\":\"p\",\"text\":\"We can continue to train our model to perform other tasks, such as text summarization, translation, writing style transfer, poetry generation, law document classification, drug discovery analysis, and more. As we continue to train and expand our model, it will become more versatile and capable of handling a wide range of tasks.\"},{\"kind\":\"p\",\"text\":\"The capability of our large language model to perform a vast number of tasks does not necessarily make it more intelligent than the previous calculator model. Instead, It is -mostly- the result of its size, which enables it to encode a large amount of information and develop an approximate function capable of handling different tasks.\",\"inline\":[\"The capability of our large language model to perform a vast number of tasks does not necessarily make it more intelligent than the previous calculator model. Instead, It is -\",{\"kind\":\"em\",\"children\":[\"mostly\"]},\"- the result of its size, which enables it to encode a large amount of information and develop an approximate function capable of handling different tasks.\"]},{\"kind\":\"p\",\"text\":\"This is why I do not find large language models particularly impressive. The tasks that ChatGPT can perform were already possible with previous neural network models. For instance, text summarization, translation, and law document classification were tasks that other models could perform exceptionally well. The only difference now is that we have a single model that can perform all these tasks.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/13.png\",\"alt\":\"Diagram comparing separate task networks with a larger multitask network.\",\"width\":700,\"height\":219},{\"kind\":\"p\",\"text\":\"One of the challenges that arise with LLM networks is their tendency to hallucinate. This is probably due to some of the neurons within these models attempting to learn multiple tasks simultaneously, such as addition and text summarization, becoming just noise and leading to incorrect outputs in some cases. Another issue that comes with LLM is that it becomes more difficult to maintain and optimize the model performance across different tasks.\"},{\"kind\":\"p\",\"text\":\"To address this issue, we build even larger models. which can minimize the interactions between neurons, allowing specific sections of the neural network to focus solely on a particular task.\"}]},{\"id\":\"arithmetic\",\"title\":\"Let’s try some arithmetic\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Let’s explore some of the capabilities/in-capabilities of an LLM model -in this case, ChatGPT Mar 23 Version.- through some fun examples.\",\"inline\":[\"Let’s explore some of the capabilities/in-capabilities of an LLM model -\",{\"kind\":\"em\",\"children\":[\"in this case, ChatGPT Mar 23 Version\"]},\".- through some fun examples.\"]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/14.png\",\"alt\":\"ChatGPT screenshot of the original long-decimal addition experiment.\",\"width\":700,\"height\":194},{\"kind\":\"p\",\"text\":\"The actual result of the operation is 1999999982.99999998.\"},{\"kind\":\"p\",\"text\":\"In this case, the model was unable to perform a simple addition operation correctly, demonstrating two distinct failures.\"},{\"kind\":\"list\",\"items\":[[\"Firstly, it rounded off the result and included numbers after the decimal point. A result of 1999999983 would have been accepted. This highlights one of the limitations of LLM models when it comes to even the most fundamental tasks. The model’s inability to perform a simple addition operation accurately suggests that it may have overfit the training data, resulting in an approximation function that is insufficiently flexible.\"],[\"Furthermore, the model’s failure to reason appropriately is also evident in this example. It unnecessarily performs the entire calculation, whereas in this case, a simple equation of 99–23 + 3 + 3 = 82 and concatenation of the remaining numbers would have been enough.\"]]},{\"kind\":\"p\",\"text\":\"The incapability of LLM models to reason accurately about basic problems is another significant limitation. Reasoning is a fundamental skill that once learned can be applied across various contexts and is not restricted to a single specific case.\"},{\"kind\":\"p\",\"text\":\"Neural network models are very good at approximating the behavior of an existing system, they are not necessarily capable of reproducing or comprehending it, nor are they capable of generalizing it for other purposes. Thus, although it may appear that the model is reasoning, in reality, it is simply mimicking the behavior of a system in a certain case.\"},{\"kind\":\"p\",\"text\":\"I later tried to simplify the operation, and even started a new session\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/15.png\",\"alt\":\"ChatGPT screenshot of a simplified arithmetic attempt.\",\"width\":700,\"height\":171},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/16.png\",\"alt\":\"ChatGPT screenshot of another arithmetic attempt in a new session.\",\"width\":700,\"height\":327}]},{\"id\":\"bananas\",\"title\":\"A banana, a guitar, and a Strogbunroftak\",\"blocks\":[{\"kind\":\"p\",\"text\":\"And here is another different example.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/17.png\",\"alt\":\"ChatGPT response to the nose, guitar, banana, chinchilla, and invented-word stacking question.\",\"width\":700,\"height\":382},{\"kind\":\"p\",\"text\":\"Well,\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/18.png\",\"alt\":\"Laughing reaction image following the stacking response.\",\"width\":700,\"height\":241},{\"kind\":\"p\",\"text\":\"There are several issues with the model’s response. It includes irrelevant information about ethics and gives unhelpful advice about putting a banana on top of a guitar and tries to brag about how it knows that leaving a banana can attract insects. Moreover, the model mistakenly assumes that “Stongbunroftak” is a living being, even though it is a completely made-up word.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/19.png\",\"alt\":\"Illustration of a brain using a calculator.\",\"width\":700,\"height\":241},{\"kind\":\"p\",\"text\":\"This highlights another boring limit of Neural Networks, which is the impact of the training dataset. The model has been trained to prioritize political correctness and safety, causing it to perceive anything slightly unconventional as dangerous and harmful. In this case, the model assumes that I have a nose, a guitar, a banana, a chinchilla, and a Strogbunroftak -whatever it thinks it is- Lying around and me trying to solve the very complex life issue of stacking them.\",\"inline\":[\"This highlights another boring limit of Neural Networks, which is the impact of the training dataset. The model has been trained to prioritize political correctness and safety, causing it to perceive anything slightly unconventional as dangerous and harmful. In this case, the model assumes that I have a nose, a guitar, a banana, a chinchilla, and a Strogbunroftak -\",{\"kind\":\"em\",\"children\":[\"whatever it thinks it is\"]},\"- Lying around and me trying to solve the very complex life issue of stacking them.\"]}]},{\"id\":\"next-token\",\"title\":\"Predicting the next word\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The second issue we see here is related to the functioning of our model. Unlike our initial calculator model, GPT and other LLM models are designed for next-token prediction -a token can be a word or a group of words depending on how the training data has been set-. At every iteration, the model attempts to predict the most likely next word to follow the given input. As demonstrated in the previous example with irrelevant information about safety and bananas, the model may generate several words that could potentially follow the input, but it cannot confidently determine the correct one that leads to a meaningful result.\",\"inline\":[\"The second issue we see here is related to the functioning of our model. Unlike our initial calculator model, GPT and other LLM models are designed for next-token prediction -\",{\"kind\":\"em\",\"children\":[\"a token can be a word or a group of words depending on how the training data has been set\"]},\"-. At every iteration, the model attempts to predict the most likely next word to follow the given input. As demonstrated in the previous example with irrelevant information about safety and bananas, the model may generate several words that could potentially follow the input, but it cannot confidently determine the correct one that leads to a meaningful result.\"]},{\"kind\":\"p\",\"text\":\"This limitation is also apparent when false facts are produced by chatGPT or similar models. This can be attributed to the training datasets that the models learn from. For example, if the model is provided with a statement claiming that the Earth is flat, it may learn that there is a probability that “the Earth is…” can be followed by “flat,”. Additionally, the model doesn’t differentiate between scientific papers and blog posts or tweets written by random users; to the model, it’s all just text. This means that if a false fact is presented in a training dataset, the model might learn to reproduce it as if it were true, regardless of the source’s credibility.\"},{\"kind\":\"p\",\"text\":\"Disclaimer N 6:: I mentionned GPT above as it is the core model behind chatGPT. However, chatGPT incorporates several additional techniques and hacks to function effectively as a chatbot. For more information on these techniques, I highly recommend reading the following article or visiting OpenAI’s website.\",\"inline\":[\"Disclaimer N 6:: I mentionned GPT above as it is the core model behind chatGPT. However, chatGPT incorporates several additional techniques and hacks to function effectively as a chatbot. For more information on these techniques, I highly recommend reading the following \",{\"kind\":\"a\",\"children\":[\"article\"],\"href\":\"https://towardsdatascience.com/how-chatgpt-works-the-models-behind-the-bot-1ce5fca96286\"},\" or visiting \",{\"kind\":\"a\",\"children\":[\"OpenAI’s website\"],\"href\":\"https://openai.com/blog/chatgpt\"},\".\"]},{\"kind\":\"p\",\"text\":\"Also, During the training of ChatGPT, more weight was given to data from Wikipedia, making the model see it as a more valuable source of information. Also making it our biggest “ Wikipedia scientist,” 😉.\",\"inline\":[\"Also, During the training of ChatGPT, more weight was given to data from Wikipedia, making the model see it as a more valuable source of information. Also making it our biggest “ Wikipedia scientist,” \",{\"kind\":\"em\",\"children\":[\"😉\"]},\".\"]}]},{\"id\":\"more-complex\",\"title\":\"The age problem\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Let’s see another chatGPT example\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/20.png\",\"alt\":\"ChatGPT response to a simple father-and-son age problem.\",\"width\":700,\"height\":366},{\"kind\":\"p\",\"text\":\"The level of intelligence displayed here is truly remarkable, bordering on the edge of what could be perceived as a threat to human existence. Is it?\"},{\"kind\":\"p\",\"text\":\"Let’s make it a tad more complex.\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/21.png\",\"alt\":\"ChatGPT response to the more complex age problem.\",\"width\":700,\"height\":949},{\"kind\":\"p\",\"text\":\"i tried another time in a new session and …\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/22.png\",\"alt\":\"ChatGPT response to the age problem retried in a new session.\",\"width\":700,\"height\":881},{\"kind\":\"p\",\"text\":\"Well,\"},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/23.png\",\"alt\":\"Laughing reaction image following the age-problem responses.\",\"width\":700,\"height\":237},{\"kind\":\"p\",\"text\":\"While LLM models excel at generating highly convincing text, it’s important to note that the output is not the product of some superintelligent entity engaging in complex reasoning or formulating intricate formulas. As the example above is extended beyond the common cases encountered during training, the model’s ability to accurately predict the output decreases and it begins generating text with whatever seems probable enough.\"}]},{\"id\":\"information-domain\",\"title\":\"The information domain\",\"blocks\":[{\"kind\":\"p\",\"text\":\"One reason why Large Language Models like chatGPT might appear more impressive than models that specialize in a single task to some, Is because it is difficult to perceive the boundaries of their information domain. When a model is designed for a specific task, its information domain is more clearly defined -A model that has been trained only on text summarization can only do that-.\",\"inline\":[\"One reason why Large Language Models like chatGPT might appear more impressive than models that specialize in a single task to some, Is because it is difficult to perceive the boundaries of their information domain. \",{\"kind\":\"br\"},\"When a model is designed for a specific task, its information domain is more clearly defined -\",{\"kind\":\"em\",\"children\":[\"A model that has been trained only on text summarization can only do that\"]},\"-.\"]},{\"kind\":\"p\",\"text\":\"Earlier, we defined intelligence as the ability to expand our knowledge domain by utilizing existing information.\"},{\"kind\":\"p\",\"text\":\"How well does AI perform in this regard?\"},{\"kind\":\"p\",\"text\":\"AI is more similar to the intelligence of other animals than it is to human intelligence. AI is akin to a monkey being taught a trick in exchange for a treat. It is how AI is trained- and what it learns is merely a distorted approximation that meets our desired output. In other words, AI does not truly understand concepts such as addition, subtraction, or text summarization. Rather, it produces a mathematical estimate to satisfy our desired results.\"},{\"kind\":\"p\",\"text\":\"AI also cannot expand its information domain beyond what it has been trained on. For instance, if Midjourney has only been trained on realistic photographs, it would never be able to create images in the styles of Van Gogh or John Singer Sargent.Similarly, if a model is trained to perform a specific task such as addition, its information domain is limited to just that. Even if you add other tasks like subtraction and multiplication, the model will only be able to perform those tasks and never tasks like text summarization or health diagnosis. Adding a hundred more tasks will not expand the information domain of the model beyond those tasks.\",\"inline\":[\"AI also cannot expand its information domain beyond what it has been trained on. For instance, if Midjourney has only been trained on realistic photographs, it would never be able to create images in the styles of Van Gogh or John Singer Sargent.\",{\"kind\":\"br\"},\"Similarly, if a model is trained to perform a specific task such as addition, its information domain is limited to just that. Even if you add other tasks like subtraction and multiplication, the model will only be able to perform those tasks and never tasks like text summarization or health diagnosis. Adding a hundred more tasks will not expand the information domain of the model beyond those tasks.\"]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/24.png\",\"alt\":\"Diagram comparing the information domains of humans, Midjourney, and ChatGPT.\",\"width\":700,\"height\":311},{\"kind\":\"p\",\"text\":\"The image above highlights the information domain of models such as Midjourney and ChatGPT. One key distinction between these models and intelligent beings is that the models are limited to their existing knowledge, whereas a creature possessing intelligence has the capacity to transcend and expand its information domain. However, AI models are exceptionally proficient at interpolating within their respective domains. For instance, a model like Midjourney can produce images mimicking the style of any artist it has been trained on, in addition to creating combinations of those styles with varying levels of nuance. Our domain of information encompasses the entirety of human knowledge and experience, not a single individual, as depicted in the image above.\"}]},{\"id\":\"cats-and-chocolate\",\"title\":\"Cats and chocolate\",\"blocks\":[{\"kind\":\"p\",\"text\":\"To showcase chatGPT interpolation skills, I asked it to generate a poem about my two loves — cats and chocolate. However, the resulting poem turned out to be a bit dark due to the model’s training data, which warns of the dangers of feeding chocolate to cats and other bla-bla-bulshit, — Enjoy 😑\",\"inline\":[\"To showcase chatGPT interpolation skills, I asked it to generate a poem about my two loves — cats and chocolate. However, the resulting poem turned out to be a bit dark due to the model’s training data, which warns of the dangers of feeding chocolate to cats and other bla-bla-bulshit,\",{\"kind\":\"br\"},\" — Enjoy 😑\"]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/25.png\",\"alt\":\"ChatGPT’s poem about cats and chocolate.\",\"width\":676,\"height\":1276},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/26.png\",\"alt\":\"Illustration of a cat with chocolate following the generated poem.\",\"width\":700,\"height\":241},{\"kind\":\"p\",\"text\":\"While the model can generate poetry on any subject, it is important to note that its capabilities are limited by the information it has been trained on. Interpolation can only go as far as the encoded information allows.\"},{\"kind\":\"p\",\"text\":\"If an AI model such as chatGPT were trained on data from a time before humans discovered fire, it wouldn’t be able to discover cooking or other technologies that require knowledge beyond that time period. This underscores the complexity of true intelligence and the limits of what machines can accomplish without human guidance and training.\"}]},{\"id\":\"outside-the-dataset\",\"title\":\"Outside the dataset\",\"blocks\":[{\"kind\":\"p\",\"text\":\"In fact, the information domain of an AI model is often more limited than we might assume. For instance, consider self-driving cars. While these models may be trained on millions of images of cars and roads, the training dataset is usually limited to specific locations and scenarios. As a result, the model may fail to operate successfully in unfamiliar environments, even if it has performed well in its original training dataset. For example, a self-driving car model trained primarily on roads in the United States may not perform as well in other countries with different road designs and driving habits.\"},{\"kind\":\"p\",\"text\":\"One of the most influential Wikipedia scientists of our time once said: “Humans drive with eyes; add eyes to cars, cars drive like humans.” However, this statement demonstrates a complete lack of understanding from that person. As we have discussed in this blog article, neural networks are a fragile technology that is subject to various limitations and challenges. Creating self-driving cars is a highly complex task that requires much more than simply replicating human driving skills. Instead, it involves improving upon these skills in many different ways. That’s why more serious companies are using additional sensors, such as Lidars and radars, to provide an extra layer of information and security. These sensors allow self-driving cars to better perceive and understand their environment, which is critical to their safe operation.\",\"inline\":[\"One of the most influential Wikipedia scientists of our time once said: “Humans drive with eyes; add eyes to cars, cars drive like humans.” However, this statement demonstrates a complete lack of understanding from that person. As we have discussed in this blog article, neural networks are a fragile technology that is subject to various limitations and challenges. \",{\"kind\":\"br\"},\"Creating self-driving cars is a highly complex task that requires much more than simply replicating human driving skills. Instead, it involves improving upon these skills in many different ways. That’s why more serious companies are using additional sensors, such as Lidars and radars, to provide an extra layer of information and security. These sensors allow self-driving cars to better perceive and understand their environment, which is critical to their safe operation.\"]},{\"kind\":\"p\",\"text\":\"Another example of the fragility of neural networks is face recognition technology. As you may recall, individuals of different ethnicities have faced issues with having their faces recognized correctly. One might assume that since the model has been trained on millions of faces, it should be exceptionally accurate in recognizing all types of faces. However, the reality is quite the opposite.Despite being trained on millions of faces, the model’s performance is biased toward a specific ethnicity that is most present in the training dataset. As a result, the model has only learned to recognize faces that match this part

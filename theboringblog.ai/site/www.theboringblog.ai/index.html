\":\"ideal-customer\",\"speaker\":\"Narrator\",\"text\":\"Now the spreadsheet is wider. Same companies, but you have to scroll sideways to doubt them.\",\"start\":128.28,\"end\":133.32,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Maya\",\"text\":\"I miss the plumber.\",\"start\":133.32,\"end\":134.68,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Narrator\",\"text\":\"Next: enrichment. The spreadsheet needs vitamins. We add websites, titles, company size. Useful information, allegedly.\",\"start\":135.33,\"end\":144.37,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Maya\",\"text\":\"This source says sixty employees. This one says two hundred.\",\"start\":144.37,\"end\":148.61,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Narrator\",\"text\":\"The website says small team, big mission. So: somewhere between sixty and a mission.\",\"start\":148.61,\"end\":155.09,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Maya\",\"text\":\"Which number goes into the system?\",\"start\":155.09,\"end\":157.17,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Narrator\",\"text\":\"We give it a confidence score. Uncertainty puts on a tie. Everyone relaxes.\",\"start\":157.17,\"end\":162.37,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Maya\",\"text\":\"Mine's wearing a waistcoat. Can it approve expenses?\",\"start\":162.37,\"end\":166.29,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Narrator\",\"text\":\"After enrichment, deduplication. David Smith, Dave Smith, D. Smith. We merge them. Three rows become one. Beautiful.\",\"start\":166.29,\"end\":174.61,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Maya\",\"text\":\"Three different people.\",\"start\":174.45,\"end\":176.29,\"overlap\":0.16},{\"sectionId\":\"enrichment\",\"speaker\":\"Narrator\",\"text\":\"Ah. We'll fix that downstream.\",\"start\":176.29,\"end\":178.37,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Maya\",\"text\":\"Where is downstream?\",\"start\":178.37,\"end\":179.97,\"overlap\":0},{\"sectionId\":\"enrichment\",\"speaker\":\"Narrator\",\"text\":\"Nobody knows. Excellent schools, apparently. All our problems move there.\",\"start\":179.97,\"end\":184.45,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Narrator\",\"text\":\"A signal is an event worth investigating. A new office. A relevant hire. Some context that makes a conversation timely.\",\"start\":185.1,\"end\":192.86,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Maya\",\"text\":\"Or someone liked a post.\",\"start\":192.86,\"end\":194.7,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Narrator\",\"text\":\"They liked a post about saving time. They want efficiency. They need our product. They're practically signing.\",\"start\":194.7,\"end\":201.26,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Maya\",\"text\":\"Their thumb slipped.\",\"start\":201.26,\"end\":202.7,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Narrator\",\"text\":\"Fourteen points.\",\"start\":202.7,\"end\":204.14,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Maya\",\"text\":\"For an accident? Why fourteen?\",\"start\":204.14,\"end\":206.94,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Narrator\",\"text\":\"Ten sounded made up.\",\"start\":206.94,\"end\":208.54,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Maya\",\"text\":\"What's the temperature of this extremely interested thumb?\",\"start\":208.54,\"end\":212.06,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Narrator\",\"text\":\"Fifty points: hot. Seventy: very hot. Ninety: David considers sending an email. The crowd goes... back to work, because nobody has actually spoken to a customer.\",\"start\":212.06,\"end\":222.301,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Maya\",\"text\":\"We've built a thermometer for a conversation that hasn't happened. Can it detect embarrassment?\",\"start\":222.301,\"end\":228.141,\"overlap\":0},{\"sectionId\":\"signals\",\"speaker\":\"Narrator\",\"text\":\"Enterprise plan.\",\"start\":228.141,\"end\":229.34,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Maya\",\"text\":\"Please tell me the message sounds normal.\",\"start\":229.99,\"end\":232.15,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Narrator\",\"text\":\"Hi David. Noticed you're Head of Operations at a company. As Head of Operations at a company, you probably care about operations.\",\"start\":232.15,\"end\":240.553,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Maya\",\"text\":\"You've caught him. He's operating.\",\"start\":240.553,\"end\":243.833,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Narrator\",\"text\":\"First draft. We improve the prompt. Add context. Remove hope this finds you well. New version: David. We know about the operations.\",\"start\":243.833,\"end\":253.353,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Maya\",\"text\":\"Come out with your workflows up.\",\"start\":253.353,\"end\":255.433,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Narrator\",\"text\":\"Put hope this finds you well back in. Immediately.\",\"start\":255.433,\"end\":259.273,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Maya\",\"text\":\"Three engineers and a language model inspect it. They agree a human could have written it. So we send it to a human.\",\"start\":259.273,\"end\":266.473,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Narrator\",\"text\":\"And?\",\"start\":266.473,\"end\":267.593,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Maya\",\"text\":\"Not interested.\",\"start\":267.593,\"end\":268.593,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Narrator\",\"text\":\"A reply! Engagement!\",\"start\":268.593,\"end\":270.586,\"overlap\":0},{\"sectionId\":\"personalization\",\"speaker\":\"Maya\",\"text\":\"Stop celebrating!\",\"start\":270.436,\"end\":272.096,\"overlap\":0.15},{\"sectionId\":\"personalization\",\"speaker\":\"Narrator\",\"text\":\"Don't tell the dashboard. It's having a good day.\",\"start\":272.096,\"end\":274.963,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Narrator\",\"text\":\"Here's the real observation. In a LinkedIn campaign, our women business development representatives got roughly twice the connection acceptance rate of our men. Business development representatives are the people doing the outreach.\",\"start\":275.613,\"end\":288.173,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Maya\",\"text\":\"That's a result worth looking into. Were the audiences comparable? Messages? Profiles? Timing?\",\"start\":288.173,\"end\":294.893,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Narrator\",\"text\":\"Exactly the questions you'd need. The result alone doesn't tell us why. It isn't a rule about women and men.\",\"start\":294.893,\"end\":301.053,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Maya\",\"text\":\"Good. So what did the fictional meeting inside your head recommend?\",\"start\":301.053,\"end\":304.933,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Narrator\",\"text\":\"Thailand.\",\"start\":304.933,\"end\":306.253,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Maya\",\"text\":\"Sorry. What?\",\"start\":306.253,\"end\":307.733,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Narrator\",\"text\":\"Next year's offsite. Thailand. Two bars on a chart. One airplane. A surprisingly short presentation.\",\"start\":307.733,\"end\":314.333,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Maya\",\"text\":\"You haven't controlled a single variable, and you're choosing seat numbers.\",\"start\":314.333,\"end\":318.893,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Narrator\",\"text\":\"David and Sean asked what this had to do with team building. I said: everything, gentlemen. We are becoming data-driven.\",\"start\":318.893,\"end\":326.093,\"overlap\":0},{\"sectionId\":\"campaign\",\"speaker\":\"Maya\",\"text\":\"Somebody take the laser pointer away from him.\",\"start\":326.093,\"end\":329.773,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Narrator\",\"text\":\"Entirely imaginary offsite. Costume party. Sunshine. A slide deck with no return ticket to common sense. David and Sean have negotiated the wardrobe budget before anyone has tested the idea.\",\"start\":330.423,\"end\":343.623,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Maya\",\"text\":\"Their glamorous lady alter egos look incredible. The wigs. The outfits. The exact same unresolved C R M permissions.\",\"start\":343.623,\"end\":352.463,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Narrator\",\"text\":\"David wants to know if the new persona gets a higher base salary. Sean has submitted false eyelashes under sales enablement.\",\"start\":352.463,\"end\":359.703,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Maya\",\"text\":\"Finance approved one eyelash. The other one's a stretch goal.\",\"start\":359.703,\"end\":364.183,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Narrator\",\"text\":\"No. Don't put that in the deck. They'll actually do it.\",\"start\":364.183,\"end\":368.263,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Maya\",\"text\":\"The women on the team have a cheaper suggestion. Test the targeting. Test the message. Same people, better experiment.\",\"start\":368.263,\"end\":375.383,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Narrator\",\"text\":\"Too late. Leadership has seen the airplane. You cannot unshow an airplane.\",\"start\":375.383,\"end\":380.663,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Maya\",\"text\":\"Everyone keeps their identity. Nobody changes anything except outfits. The joke is your business reasoning, which has somehow become the least convincing costume.\",\"start\":380.663,\"end\":391.063,\"overlap\":0},{\"sectionId\":\"offsite\",\"speaker\":\"Narrator\",\"text\":\"The wigs have better methodology than the deck. I admit that. But mine has transitions.\",\"start\":391.063,\"end\":396.823,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Maya\",\"text\":\"Did the extra connections become useful conversations?\",\"start\":397.473,\"end\":401.233,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Narrator\",\"text\":\"We were celebrating.\",\"start\":401.233,\"end\":402.913,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Maya\",\"text\":\"Accepted connection. Meeting. Customer. Happy customer. Different things. Someone still has to want the product.\",\"start\":402.913,\"end\":411.473,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Narrator\",\"text\":\"A dependency on the product. At this stage?\",\"start\":411.473,\"end\":414.833,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Maya\",\"text\":\"Where are those numbers on the dashboard?\",\"start\":414.833,\"end\":416.753,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Narrator\",\"text\":\"Under Advanced. Collapsed by default. The first number is very large and green. That one's doing wonderful things for morale.\",\"start\":416.753,\"end\":423.713,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Maya\",\"text\":\"Revenue is an advanced feature.\",\"start\":423.713,\"end\":426.113,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Narrator\",\"text\":\"We've already paid for the costumes. We're emotionally invested in the hypothesis. Finance doesn't have a column for that, which is why it's so expensive.\",\"start\":426.113,\"end\":434.353,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Maya\",\"text\":\"Downstream has a column.\",\"start\":434.353,\"end\":436.193,\"overlap\":0},{\"sectionId\":\"conversion\",\"speaker\":\"Narrator\",\"text\":\"Downstream has everything.\",\"start\":436.193,\"end\":437.873,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Narrator\",\"text\":\"Finally. Automation. Something I recognize. A webhook is one system telling another system something happened. Like a doorbell.\",\"start\":438.523,\"end\":447.083,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Maya\",\"text\":\"Ding dong.\",\"start\":447.083,\"end\":448.123,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Narrator\",\"text\":\"That rings another doorbell. That updates a spreadsheet. That sends a message saying the original doorbell is unavailable. Someone retries it. Now there are four doorbells.\",\"start\":448.123,\"end\":456.603,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Maya\",\"text\":\"Ding dong!\",\"start\":456.483,\"end\":457.443,\"overlap\":0.12},{\"sectionId\":\"automation\",\"speaker\":\"Narrator\",\"text\":\"Please. I used to sleep. We've got rate limits, missing fields, and a timestamp arriving from tomorrow to warn us.\",\"start\":457.443,\"end\":465.323,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Maya\",\"text\":\"A human checks the output before anything embarrassing goes out, yes?\",\"start\":465.323,\"end\":469.323,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Narrator\",\"text\":\"Yes. Even this fictional company can afford that. Signal, enrichment, score, owner, task, human review. There is a useful system in here. It's just surrounded.\",\"start\":469.323,\"end\":481.923,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Maya\",\"text\":\"Time saved?\",\"start\":481.923,\"end\":482.883,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Narrator\",\"text\":\"Six minutes. Took an afternoon to maintain. But next week, thousands of runs. Potentially worth it. Potentially my new weekend.\",\"start\":482.883,\"end\":490.643,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Maya\",\"text\":\"The diagram doesn't fit on my screen.\",\"start\":490.643,\"end\":493.003,\"overlap\":0},{\"sectionId\":\"automation\",\"speaker\":\"Narrator\",\"text\":\"Architecture.\",\"start\":493.003,\"end\":494.483,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Maya\",\"text\":\"Someone bought the meeting software!\",\"start\":495.133,\"end\":497.225,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Narrator\",\"text\":\"Sales says it was the call. Marketing says the campaign. Product says the product. I say the integration, because I've been here until eleven.\",\"start\":497.225,\"end\":505.533,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Maya\",\"text\":\"The customer says a colleague recommended it.\",\"start\":505.533,\"end\":508.093,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Narrator\",\"text\":\"Does the colleague have an A P I?\",\"start\":508.093,\"end\":510.333,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Maya\",\"text\":\"First touch gets credit for the first interaction. Last touch gets the last. Which are we using?\",\"start\":510.333,\"end\":516.093,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Narrator\",\"text\":\"Our fictional all-touch model. Everybody wins. Four customers from one invoice. Finally, a conversion rate that respects the team.\",\"start\":516.093,\"end\":523.453,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Maya\",\"text\":\"One customer.\",\"start\":523.313,\"end\":524.593,\"overlap\":0.14},{\"sectionId\":\"attribution\",\"speaker\":\"Narrator\",\"text\":\"One customer. Four departments. I connect the systems so we can see what happened. Then they disagree and I become a diplomat with A P I keys.\",\"start\":524.593,\"end\":534.193,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Maya\",\"text\":\"You wanted a change from debugging.\",\"start\":534.193,\"end\":536.313,\"overlap\":0},{\"sectionId\":\"attribution\",\"speaker\":\"Narrator\",\"text\":\"I debug the sentence this lead should have been mine. The sentence has been in production since 1998.\",\"start\":536.313,\"end\":542.513,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"Hang on. Find suitable companies. Understand them. Notice useful moments. Build reliable plumbing. Check whether it helped. That's the job?\",\"start\":543.163,\"end\":554.363,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"You're getting dangerously close. Let me help.\",\"start\":554.363,\"end\":557.883,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"We operationalize an intent-led, signal-enriched, multi-touch revenue motion across the entire customer lifecycle, with a human in the loop and Sean in a very good wig.\",\"start\":557.883,\"end\":566.443,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"I had it. I actually had it for a second, and now it's gone.\",\"start\":566.443,\"end\":570.843,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"Perfect. You're ready for the kickoff.\",\"start\":570.843,\"end\":573.003,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"What do I do if someone asks about revenue?\",\"start\":573.003,\"end\":575.323,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"Dashboard's refreshing.\",\"start\":575.323,\"end\":576.523,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"Thailand?\",\"start\":576.523,\"end\":577.323,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"Downstream.\",\"start\":577.323,\"end\":578.043,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"David?\",\"start\":578.043,\"end\":579.003,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"Merged with two other Davids. We're sending flowers.\",\"start\":579.003,\"end\":581.883,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"Write the useful version, please. I would read it. I might even understand what you do.\",\"start\":581.883,\"end\":587.883,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Narrator\",\"text\":\"I will. For now, three months in, one solid conclusion: test the message before booking the flight.\",\"start\":587.883,\"end\":594.843,\"overlap\":0},{\"sectionId\":\"did-you-get-it\",\"speaker\":\"Maya\",\"text\":\"Interesting signal.\",\"start\":594.843,\"end\":596.363,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"Thanks for listening. Follow along for more articles, experiments, and things that worked on my machine.\",\"start\":597.163,\"end\":603.403,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Some of them might even work on yours.\",\"start\":603.403,\"end\":605.723,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"No promises. Have a lovely day. Go make something.\",\"start\":605.723,\"end\":609.963,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Preferably a cup of tea first. Bye!\",\"start\":609.963,\"end\":613.163,\"overlap\":0}],\"passages\":[{\"sectionId\":\"three-months\",\"block\":0,\"start\":0},{\"sectionId\":\"three-months\",\"block\":0,\"start\":7.6},{\"sectionId\":\"three-months\",\"block\":1,\"start\":10.96},{\"sectionId\":\"three-months\",\"block\":1,\"start\":14.16},{\"sectionId\":\"three-months\",\"block\":1,\"start\":16.24},{\"sectionId\":\"three-months\",\"block\":2,\"start\":28.4},{\"sectionId\":\"three-months\",\"block\":2,\"start\":31.682},{\"sectionId\":\"three-months\",\"block\":3,\"start\":39.602},{\"sectionId\":\"three-months\",\"block\":3,\"start\":48.002},{\"sectionId\":\"definition\",\"block\":0,\"start\":53.29},{\"sectionId\":\"definition\",\"block\":1,\"start\":63.29},{\"sectionId\":\"definition\",\ tribution\",\"block\":4,\"start\":536.313},{\"sectionId\":\"did-you-get-it\",\"block\":0,\"start\":543.163},{\"sectionId\":\"did-you-get-it\",\"block\":1,\"start\":554.363},{\"sectionId\":\"did-you-get-it\",\"block\":2,\"start\":557.883},{\"sectionId\":\"did-you-get-it\",\"block\":3,\"start\":566.443},{\"sectionId\":\"did-you-get-it\",\"block\":4,\"start\":570.843},{\"sectionId\":\"did-you-get-it\",\"block\":5,\"start\":573.003},{\"sectionId\":\"did-you-get-it\",\"block\":5,\"start\":575.323},{\"sectionId\":\"did-you-get-it\",\"block\":5,\"start\":576.523},{\"sectionId\":\"did-you-get-it\",\"block\":5,\"start\":577.323},{\"sectionId\":\"did-you-get-it\",\"block\":5,\"start\":578.043},{\"sectionId\":\"did-you-get-it\",\"block\":5,\"start\":579.003},{\"sectionId\":\"did-you-get-it\",\"block\":6,\"start\":581.883},{\"sectionId\":\"did-you-get-it\",\"block\":7,\"start\":587.883},{\"sectionId\":\"did-you-get-it\",\"block\":7,\"start\":594.843},{\"sectionId\":\"follow\",\"block\":-1,\"start\":597.163},{\"sectionId\":\"follow\",\"block\":-1,\"start\":603.403},{\"sectionId\":\"follow\",\"block\":-1,\"start\":605.723},{\"sectionId\":\"follow\",\"block\":-1,\"start\":609.963}],\"scriptSha256\":\"7cbd178d020d6feb2512a7d5c0b6e7651f811c413be6ec0abd0aeed7d5d3b8bb\"},{\"version\":1,\"slug\":\"it-was-supposed-to-be-a-small-change\",\"cast\":\"boring-blog-duo\",\"castVersion\":2,\"sourceDate\":\"2026-10-05\",\"src\":\"/posts/it-was-supposed-to-be-a-small-change/audio/discussion-v1-signoff-v1.mp3\",\"duration\":959.43,\"chapters\":[{\"id\":\"the-whole-journey\",\"title\":\"From an idea to a model you can use\",\"start\":0,\"speechEnd\":44.4,\"end\":45.05},{\"id\":\"how-software-thinks\",\"title\":\"The bargains each CAD tool makes\",\"start\":45.05,\"speechEnd\":141.93,\"end\":143.03},{\"id\":\"a-chat-box\",\"title\":\"What the chat box actually has to solve\",\"start\":143.03,\"speechEnd\":231.03,\"end\":231.68},{\"id\":\"what-generators-leave-unfinished\",\"title\":\"What comes out of the generator\",\"start\":231.68,\"speechEnd\":341.84,\"end\":342.94},{\"id\":\"what-is-a-shape\",\"title\":\"Choose the representation for the next operation\",\"start\":342.94,\"speechEnd\":438.7,\"end\":439.35},{\"id\":\"remember-why\",\"title\":\"Keep the relationships through the edit\",\"start\":439.35,\"speechEnd\":514.63,\"end\":515.28},{\"id\":\"the-wait\",\"title\":\"The whole cost of trying another idea\",\"start\":515.28,\"speechEnd\":584.96,\"end\":585.61},{\"id\":\"details-that-matter\",\"title\":\"Detail has to mean something\",\"start\":585.61,\"speechEnd\":646.65,\"end\":647.3},{\"id\":\"somewhere-else\",\"title\":\"What survives the handoff\",\"start\":647.3,\"speechEnd\":716.66,\"end\":717.76},{\"id\":\"the-scene-behind-the-output\",\"title\":\"The scene behind creative AI\",\"start\":717.76,\"speechEnd\":825.28,\"end\":826.38},{\"id\":\"the-workspace\",\"title\":\"Let the workspace grow with the design\",\"start\":826.38,\"speechEnd\":887.18,\"end\":887.83},{\"id\":\"eskiz\",\"title\":\"Why we are building Eskiz\",\"start\":887.83,\"speechEnd\":941.83,\"end\":942.63},{\"id\":\"follow\",\"title\":\"Until next time\",\"start\":942.63,\"speechEnd\":958.63,\"end\":959.43}],\"turns\":[{\"sectionId\":\"the-whole-journey\",\"speaker\":\"Narrator\",\"text\":\"I'm Khalil, and this is Maya. Suppose you want to design a chair. First, you want to play with the shape. Later, you need dimensions, joints, materials. Then someone asks for a wider version.\",\"start\":0,\"end\":12.24,\"overlap\":0},{\"sectionId\":\"the-whole-journey\",\"speaker\":\"Maya\",\"text\":\"A reasonable request. Four words. Potentially your afternoon.\",\"start\":12.24,\"end\":16.96,\"overlap\":0},{\"sectionId\":\"the-whole-journey\",\"speaker\":\"Narrator\",\"text\":\"Because the shape, the rules, and the next change don't always fit together neatly. Some tools make starting easy. Others give you powerful control, after you've learned how they think.\",\"start\":16.96,\"end\":27.6,\"overlap\":0},{\"sectionId\":\"the-whole-journey\",\"speaker\":\"Maya\",\"text\":\"And found the command. And selected the face behind the face you keep selecting.\",\"start\":27.6,\"end\":32.56,\"overlap\":0},{\"sectionId\":\"the-whole-journey\",\"speaker\":\"Narrator\",\"text\":\"That whole journey is what interests me: getting from an intention to a detailed model you can revise and share. AI could help with all of it. First, let's look at the work we're actually asking it to help with.\",\"start\":32.56,\"end\":44.4,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Maya\",\"text\":\"Take SketchUp. Draw a face, pull it into a volume. That feels wonderfully immediate. But raw geometry can stick together, so you learn groups, components, and which editing context you're in.\",\"start\":45.05,\"end\":58.01,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Narrator\",\"text\":\"It has parametric components too. Someone still has to decide what happens to the shelves and doors when a cabinet gets wider. That behavior doesn't follow automatically from drawing the cabinet.\",\"start\":58.01,\"end\":69.45,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Maya\",\"text\":\"Plasticity gives you precise direct modeling without a history tree. Great for exploring a shape. A face edit still needs extra logic if a whole family of parts should follow.\",\"start\":69.45,\"end\":81.05,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Narrator\",\"text\":\"Onshape records a sequence of features. Change an early dimension and later features can update. Remove a face they depend on, and they may fail. There are repair tools. There is also something to repair.\",\"start\":81.05,\"end\":93.77,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Maya\",\"text\":\"Shapr3D combines direct editing and parametric history. A friendly gesture helps, but you still need to understand the dependencies.\",\"start\":93.77,\"end\":102.73,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Narrator\",\"text\":\"Rhino and Grasshopper let you build elaborate geometric procedures. Then you meet data trees: lists with branches that control how things match up. You came to design a facade. Your points have joined the wrong branch.\",\"start\":102.73,\"end\":115.85,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Maya\",\"text\":\"An administrative problem for the facade.\",\"start\":115.85,\"end\":118.65,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Narrator\",\"text\":\"Revit organizes buildings through families, hosts, and parameters. A change can affect one instance or a whole type. A family can look perfect and expose completely unsuitable controls for your project.\",\"start\":118.65,\"end\":131.05,\"overlap\":0},{\"sectionId\":\"how-software-thinks\",\"speaker\":\"Maya\",\"text\":\"Each approach earns its place. The hard part is predicting the structure you'll need before the design has settled. I'd like to start simply, then add rules as they become useful.\",\"start\":131.05,\"end\":141.93,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Narrator\",\"text\":\"That's a promising job for AI. Help me express a relationship, explore an alternative, or build a procedure without finding every command myself.\",\"start\":143.03,\"end\":152.71,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Maya\",\"text\":\"But we're putting very different things under 'AI for CAD.' Making an image, generating a mesh, writing modeling code, explaining a failed feature. A good result in one doesn't prove the others work.\",\"start\":152.71,\"end\":165.87,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Narrator\",\"text\":\"Imagine asking for a housing. The code runs. The solid is valid. The wall is still twice as thick as you wanted.\",\"start\":165.87,\"end\":173.19,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Maya\",\"text\":\"Three separate tests. Does it run? Is the geometry usable? Is it the design I asked for? The render passes a fourth test: would I click on this?\",\"start\":173.19,\"end\":183.59,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Narrator\",\"text\":\"Autodesk Research tested CAD editing systems and found a substantial gap from professional expectations. Its automatic visual and geometric scores also missed things experts cared about. That describes those tests, but it makes a useful point: looking convincing is an incomplete measure.\",\"start\":183.59,\"end\":201.67,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Maya\",\"text\":\"There is progress with solver feedback for generated constraints. You can check whether relationships behave correctly, instead of trusting a plausible picture. Even a fully constrained sketch still needs engineering.\",\"start\":201.67,\"end\":214.63,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Narrator\",\"text\":\"And an assistant inside an existing application can be valuable. The real test comes after the first answer: can I point at something, change it, inspect the consequences, and carry on?\",\"start\":214.63,\"end\":225.91,\"overlap\":0},{\"sectionId\":\"a-chat-box\",\"speaker\":\"Maya\",\"text\":\"Let's open the generated file, then. This is usually where the demonstration gets interesting.\",\"start\":225.91,\"end\":231.03,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Narrator\",\"text\":\"Mesh generators can make recognizable objects quickly. Meshy's own guide describes guessed hidden geometry, inaccurate details, and separate objects merging. A convincing front view leaves quite a lot happening around the back.\",\"start\":231.68,\"end\":246,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Maya\",\"text\":\"Even when the shape is close, you may need topology cleanup and dimensional corrections. A background prop and a part that must fit another part have different standards.\",\"start\":246,\"end\":256.64,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Narrator\",\"text\":\"Generating a boundary representation, or B-rep, can give you native CAD geometry. But the output format cannot tell you whether the design is right.\",\"start\":256.64,\"end\":266.36,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Maya\",\"text\":\"The housing looks right. Its wall thickness is wrong. A groove is pretending to be a joint. The holes nearly line up. Nearly is doing a lot of work.\",\"start\":266.36,\"end\":277.96,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Narrator\",\"text\":\"The B-rep isn't inherently approximate. The generator has misunderstood the object. Benchmarks also show difficulties with complex features; some still evaluate single bodies without assembly constraints.\",\"start\":277.96,\"end\":290.72,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Maya\",\"text\":\"Gaussian splats solve a different problem: reproducing views with lots of soft, overlapping primitives. They can give a captured environment a strong sense of presence.\",\"start\":290.72,\"end\":301.88,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Narrator\",\"text\":\"You can select, move, and color-grade splats in tools like SuperSplat. That does not give you a dimensioned wall with editable openings. Captured lighting and surface appearance can also be mixed together.\",\"start\":301.88,\"end\":313.56,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Maya\",\"text\":\"Relighting is progressing, including in V-Ray. Still, changing a tint and changing how a material responds to new light are different jobs.\",\"start\":313.56,\"end\":322.96,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Narrator\",\"text\":\"Then come the retries. Fix the hole. Check the neighboring features. Explain what must stay fixed. Eventually, editing by hand starts to look relaxing.\",\"start\":322.96,\"end\":334.24,\"overlap\":0},{\"sectionId\":\"what-generators-leave-unfinished\",\"speaker\":\"Maya\",\"text\":\"Measure the time to a result you can trust and keep editing. That brings us to what the geometry actually preserves.\",\"start\":334.24,\"end\":341.84,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Maya\",\"text\":\"Say I need to change the radius of a curved part. What information would I want the model to keep?\",\"start\":342.94,\"end\":348.78,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Narrator\",\"text\":\"A mesh gives you connected surface faces, often triangles. Useful for rendering, sculpting, scans, and many fabrication jobs. A very detailed mesh still may not contain a named radius you can change.\",\"start\":348.78,\"end\":363.5,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Maya\",\"text\":\"More triangles can improve the surface. They cannot tell me why it has that shape.\",\"start\":363.5,\"end\":368.58,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Narrator\",\"text\":\"A boundary representation describes the boundary and how its pieces connect. In typical CAD systems, faces and edges refer to mathematical surfaces and curves. That helps preserve a cylindrical hole or a precise mating face.\",\"start\":368.58,\"end\":382.86,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Maya\",\"text\":\"With tolerances, and operations that can still fail. Precision does not guarantee a peaceful afternoon.\",\"start\":382.86,\"end\":390.38,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Narrator\",\"text\":\"A function representation uses a function over space to distinguish inside, outside, and the boundary. A signed distance field is one kind. Fields are useful for smooth blends and structures like lattices. Displaying or exporting them still takes work.\",\"start\":390.38,\"end\":406.46,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Maya\",\"text\":\"So choose for the job. Precise surfaces where fit matters, meshes where they help, fields where the design benefits. Then be explicit about what a conversion loses.\",\"start\":406.46,\"end\":418.46,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Narrator\",\"text\":\"And the kernel is another question. Open Cascade, Parasolid, and ACIS are geometry engines. They perform geometric operations; the application still has to decide how you work.\",\"start\":418.46,\"end\":430.46,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Maya\",\"text\":\"The engine can calculate the hole. Something has to remember what it lines up with.\",\"start\":430.46,\"end\":435.42,\"overlap\":0},{\"sectionId\":\"what-is-a-shape\",\"speaker\":\"Narrator\",\"text\":\"Which is where a shape starts becoming a design you can change.\",\"start\":435.42,\"end\":438.7,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Narrator\",\"text\":\"Let's use a window frame. You want it wider, while the frame members stay sixty millimeters thick.\",\"start\":439.35,\"end\":445.43,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Maya\",\"text\":\"If I stretch the whole thing horizontally, the vertical members get thicker too. The tool did exactly what I told it.\",\"start\":445.43,\"end\":452.63,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Narrator\",\"text\":\"If width and thickness are separate parameters, I can change one and preserve the other. Same starting picture. Different behavior.\",\"start\":452.63,\"end\":460.47,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Maya\",\"text\":\"Now make it a cabinet. Longer shelves, redistributed doors, hardware a fixed distance from the edges. Without those relationships, I become the update system.\",\"start\":460.47,\"end\":471.03,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Narrator\",\"text\":\"Excellent flexibility. Slightly dependent on coffee.\",\"start\":471.03,\"end\":474.95,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Maya\",\"text\":\"And I need to know the scope. Am I changing this one cabinet, every instance of it, or the rule that generates them? If I make a local exception, it should survive the next update.\",\"start\":474.95,\"end\":486.39,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Narrator\",\"text\":\"Some changes really do break a relationship. A host face disappears. Constraints become impossible. Show me what broke and help me repair it. Quietly attaching a feature to a different face can hide a design error.\",\"start\":486.39,\"end\":499.99,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Maya\",\"text\":\"AI could help explain and author those relationships. But its explanation, the controls, and the actual geometry have to agree.\",\"start\":499.99,\"end\":508.47,\"overlap\":0},{\"sectionId\":\"remember-why\",\"speaker\":\"Narrator\",\"text\":\"And the conversation has to move at a useful pace. Otherwise every small decision becomes a scheduled event.\",\"start\":508.47,\"end\":514.63,\"overlap\":0},{\"sectionId\":\"the-wait\",\"speaker\":\"Maya\",\"text\":\"Find the command. Select the part. Change a value. Wait. Inspect. Repair. That's the cost of one idea, even if the generation itself was quick.\",\"start\":515.28,\"end\":527.28,\"overlap\":0},{\"sectionId\":\"the-wait\",\"speaker\":\"Narrator\",\"text\":\"Complex geometry and relationships can mean real computational work. Revit documents that tradeoff. Sending every adjustment through a fresh AI generation can add another delay.\",\"start\":527.28,\"end\":539.04,\"overlap\":0},{\"sectionId\":\"the-wait\",\"speaker\":\"Maya\",\"text\":\"Sometimes the computer is fast and the interface is the problem. Which value controls this? Is that preview current? Can I compare two options without losing one?\",\"start\":539.04,\"end\":549.6,\"overlap\":0},{\"sectionId\":\"the-wait\",\"speaker\":\"Narrator\",\"text\":\"A better loop reuses valid work, updates what changed, gives responsive previews, and makes undo dependable. If an operation fails, the explanation should give you a next step.\",\"start\":549.6,\"end\":561.36,\"overlap\":0},{\"sectionId\":\"the-wait\",\"speaker\":\"Maya\",\"text\":\"'Cannot do that because these constraints conflict' is useful. I can fix it. A cheerful wrong answer gives me another inspection job.\",\"start\":561.36,\"end\":570.08,\"overlap\":0},{\"sectionId\":\"the-wait\",\"speaker\":\"Narrator\",\"text\":\"The article's timing diagram is a schematic, not a benchmark. The point is to count inspection and revision too. Cheaper iteration lets us try more directions. Then we need to decide whether the result works as an actual object.\",\"start\":570.08,\"end\":584.96,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Maya\",\"text\":\"Our chair has beautiful rounded edges now. How are the legs attached?\",\"start\":585.61,\"end\":590.65,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Narrator\",\"text\":\"An excellent question for the chair.\",\"start\":590.65,\"end\":592.81,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Maya\",\"text\":\"Stock thickness, joints, clearance for moving parts, fasteners that avoid each other. Those decisions make detail useful. Adding more geometry cannot resolve them by itself.\",\"start\":592.81,\"end\":605.93,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Narrator\",\"text\":\"Keep the relationships in the model and they can survive a change. Keep them entirely in someone's head, and that person's holiday becomes a dependency.\",\"start\":605.93,\"end\":614.57,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Maya\",\"text\":\"There is another distinction here. Parallel faces do not prove a bracket can carry a load. A closed solid does not prove the part can be manufactured by the process you chose.\",\"start\":614.57,\"end\":625.93,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Narrator\",\"text\":\"Those checks need appropriate assumptions and evidence. The model should tell us which requirement drives a detail, what has been checked, and what remains unresolved. AI can help manage that information. Its explanation cannot stand in for the check.\",\"start\":625.93,\"end\":640.81,\"overlap\":0},{\"sectionId\":\"details-that-matter\",\"speaker\":\"Maya\",\"text\":\"Now we have something another person could use. Provided that information actually reaches them.\",\"start\":640.81,\"end\":646.65,\"overlap\":0},{\"sectionId\":\"somewhere-else\",\"speaker\":\"Maya\",\"text\":\"A client wants to review the proposal. A colleague wants to revise the assembly. A fabricator needs dimensions, tolerances, and the correct revision. One attractive viewport is a rather optimistic handoff.\",\"start\":647.3,\"end\":661.14,\"overlap\":0},{\"sectionId\":\"somewhere-else\",\"speaker\":\"Narrator\",\"text\":\"There are serious collaboration tools already. Onshape has versions and branches for controlled revisions and alternatives. But crossing between applications raises another question: which design information travels?\",\"start\":661.14,\"end\":674.46,\"overlap\":0},{\"sectionId\":\"somewhere-else\",\"speaker\":\"Maya\",\"text\":\"Onshape's import documentation is clear: imported CAD does not bring its original feature tree. You can still work with the solid. You haven't received its original modeling recipe.\",\"start\":674.46,\"end\":685.82,\"overlap\":0},{\"sectionId\":\"somewhere-else\",\"speaker\":\"Narrator\",\"text\":\"Useful reuse needs that recipe, or controls that expose the behavior you need. In the article's example, several windows share a width. One gets a local override. It should keep that exception while still benefiting from relevant changes to the shared definition.\",\"start\":685.82,\"end\":701.82,\"overlap\":0},{\"sectionId\":\"somewhere-else\",\"speaker\":\"Maya\",\"text\":\"And the drawings and quantities should tell me which revision they describe. Otherwise the model and the documents quietly develop separate opinions.\",\"start\":701.82,\"end\":710.26,\"overlap\":0},{\"sectionId\":\"somewhere-else\",\"speaker\":\"Narrator\",\"text\":\"Preserving those decisions is valuable beyond CAD too. It changes what we could ask creative AI to do.\",\"start\":710.26,\"end\":716.66,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Narrator\",\"text\":\"This is my bigger bet: reliable, editable 3D generation is the most important next step for creative AI. Images, video, games, film, architecture, design. They all benefit when we can decide what exists and keep control of it.\",\"start\":717.76,\"end\":733.76,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Maya\",\"text\":\"A scene can keep the objects, dimensions, positions, materials, lights, and cameras together. Make another shot from the same decisions. Change a decision deliberately.\",\"start\":733.76,\"end\":745.04,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Narrator\",\"text\":\"Adobe already has Scene to Image, using a constructed 3D scene to guide composition and viewpoint. A rough blockout can establish the layout. An accurate product model matters when the product itself must stay correct.\",\"start\":745.04,\"end\":758.4,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Maya\",\"text\":\"Our chair should not have to reapply for its fourth leg in every campaign image.\",\"start\":758.4,\"end\":763.12,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Narrator\",\"text\":\"For video, spatial information can help maintain a set as the camera moves. NVIDIA has research using an explicit 3D cache for that. It is evidence of a useful direction, with limits.\",\"start\":763.12,\"end\":774.64,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Maya\",\"text\":\"In games, a door also needs motion and collision geometry. In architecture, the plan, material study, and walkthrough should describe the same design. These are different outputs with shared decisions underneath.\",\"start\":774.64,\"end\":787.92,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Narrator\",\"text\":\"Film and game production already work around shared scenes. Open U S D helps compose and exchange scene information. AI could make creating and revising those scenes accessible to many more people.\",\"start\":787.92,\"end\":800.2,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Narrator\",\"text\":\"But for repeatable spatial control, I think the editable scene becomes the most valuable thing we keep. It can support another shot, another material, another medium. That's why making it easier to model matters so much.\",\"start\":800.2,\"end\":813.16,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Maya\",\"text\":\"Not every image needs a 3D model. And using one as a reference doesn't guarantee the generator obeys it. You still check the result.\",\"start\":813.16,\"end\":821.36,\"overlap\":0},{\"sectionId\":\"the-scene-behind-the-output\",\"speaker\":\"Narrator\",\"text\":\"Making the scene approachable gives more people a way to direct that result.\",\"start\":821.36,\"end\":825.28,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Maya\",\"text\":\"Then the entry point has to be approachable. Let me explore a form before asking me to plan its entire future.\",\"start\":826.38,\"end\":834.06,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Narrator\",\"text\":\"Add dimensions when they matter. Add relationships when repetition appears. Develop the parts as the idea becomes clearer. The model should get more capable as you need more from it.\",\"start\":834.06,\"end\":846.14,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Maya\",\"text\":\"Sometimes I want to drag a part. Sometimes I want a hundred parts to follow a rule. Sometimes I'd like help figuring out the rule.\",\"start\":846.14,\"end\":854.46,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Narrator\",\"text\":\"Words, sketches, selections, and dimensions can all contribute. AI can propose an edit, help develop a detail, or explain a dependency. I should be able to inspect the proposal and continue working on the same model.\",\"start\":854.46,\"end\":868.94,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Maya\",\"text\":\"So the demonstration needs a second act. Make the model, then change your mind.\",\"start\":868.94,\"end\":874.38,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Narrator\",\"text\":\"Then hand it to someone else and see what they can do with it. That is a demanding test for any new tool.\",\"start\":874.38,\"end\":880.14,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Maya\",\"text\":\"I assume you haven't brought all of this up purely to improve our imaginary chair.\",\"start\":880.14,\"end\":884.74,\"overlap\":0},{\"sectionId\":\"the-workspace\",\"speaker\":\"Narrator\",\"text\":\"The chair has been very helpful.\",\"start\":884.74,\"end\":887.18,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Narrator\",\"text\":\"We're building Eskiz. A new approach to 3D modeling, enhanced by AI collaboration.\",\"start\":887.83,\"end\":893.67,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Maya\",\"text\":\"From an intention to a highly detailed model, with room to explore and change it along the way.\",\"start\":893.67,\"end\":899.91,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Narrator\",\"text\":\"That's the ambition. Direct modeling, reusable logic, and AI assistance working together. Easier iteration. Changes that propagate through the relationships they should affect.\",\"start\":899.91,\"end\":910.63,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Maya\",\"text\":\"And you'll show how that works through actual design work?\",\"start\":910.63,\"end\":913.59,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Narrator\",\"text\":\"Yes. There's a lot underneath it, including the work we've been doing on procedural design and editable modeling systems. We'll share the machinery as it becomes useful to explain the work.\",\"start\":913.59,\"end\":923.59,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Maya\",\"text\":\"What should people watch for next?\",\"start\":923.59,\"end\":925.35,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Narrator\",\"text\":\"We'll share details and progress weekly as we work toward the reveal. You can join the Eskiz waitlist through the link in the article.\",\"start\":925.35,\"end\":931.91,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Maya\",\"text\":\"I'd like to spend more of the afternoon trying designs.\",\"start\":931.91,\"end\":934.87,\"overlap\":0},{\"sectionId\":\"eskiz\",\"speaker\":\"Narrator\",\"text\":\"So would I. More of the work between an idea and a finished design should be design work. That's what we're building toward.\",\"start\":934.87,\"end\":941.83,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"Thanks for listening. Follow along for more articles, experiments, and things that worked on my machine.\",\"start\":942.63,\"end\":948.87,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Some of them might even work on yours.\",\"start\":948.87,\"end\":951.19,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"No promises. Have a lovely day. Go make something.\",\"start\":951.19,\"end\":955.43,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Preferably a cup of tea first. Bye!\",\"start\":955.43,\"end\":958.63,\"overlap\":0}],\"passages\":[{\"sectionId\":\"the-whole-journey\",\"block\":0,\"start\":0},{\"sectionId\":\"the-whole-journey\",\"block\":1,\"start\":12.24},{\"sectionId\":\"the-whole-journey\",\"block\":2,\"start\":16.96},{\"sectionId\":\"the-whole-journey\",\"block\":3,\"start\":27.6},{\"sectionId\":\"the-whole-journey\",\"block\":4,\"start\":32.56},{\"sectionId\":\"how-software-thinks\",\"block\":2,\"start\":45.05},{\"sectionId\":\"how-software-thinks\",\"block\":3,\"start\":58.01},{\"sectionId\":\"how-software-thinks\",\"block\":4,\"start\":69.45},{\"sectionId\":\"how-software-thinks\",\"block\":6,\"start\":81.05},{\"sectionId\":\"how-software-thinks\",\"block\":7,\"start\":93.77},{\"sectionId\":\"how-software-thinks\",\"block\":9,\"start\":102.73},{\"sectionId\":\"how-software-thinks\",\"block\":9,\"start\":115.85},{\"sectionId\":\"how-software-thinks\",\"block\":10,\"start\":118.65},{\"sectionId\":\"how-software-thinks\",\"block\":11,\"start\":131.05},{\"sectionId\":\"a-chat-box\",\"block\":0,\"start\":143.03},{\"sectionId\":\"a-chat-box\",\"block\":1,\"start\":152.71},{\"sectionId\":\"a-chat-box\",\"block\":2,\"start\":165.87},{\"sectionId\":\"a-chat-box\",\"block\":2,\"start\":173.19},{\"sectionId\":\"a-chat-box\",\"block\":3,\"start\":183.59},{\"sectionId\":\"a-chat-box\",\"block\":4,\"start\":201.67},{\"sectionId\":\"a-chat-box\",\"block\":5,\"start\":214.63},{\"sectionId\":\"a-chat-box\",\"block\":6,\"start\":225.91},{\"sectionId\":\"what-generators-leave-unfinished\",\"block\":2,\"start\":231.68},{\"sectionId\":\"what-generators-leave-unfinished\",\"block\":3,\"start\":246},{\"sectionId\":\"what-generators-leave-unfinished\",\"block\":5,\"start\":256.64},{\"sectionId\":\"what-generators-leave-unfinished\",\"block\":6,\"start\":266.36},{\"sectionId\":\"what-generators-leave-unfinished\",\"block\" ,{\"sectionId\":\"the-workspace\",\"block\":3,\"start\":880.14},{\"sectionId\":\"the-workspace\",\"block\":3,\"start\":884.74},{\"sectionId\":\"eskiz\",\"block\":0,\"start\":887.83},{\"sectionId\":\"eskiz\",\"block\":1,\"start\":893.67},{\"sectionId\":\"eskiz\",\"block\":1,\"start\":899.91},{\"sectionId\":\"eskiz\",\"block\":2,\"start\":910.63},{\"sectionId\":\"eskiz\",\"block\":2,\"start\":913.59},{\"sectionId\":\"eskiz\",\"block\":3,\"start\":923.59},{\"sectionId\":\"eskiz\",\"block\":3,\"start\":925.35},{\"sectionId\":\"eskiz\",\"block\":4,\"start\":931.91},{\"sectionId\":\"eskiz\",\"block\":4,\"start\":934.87},{\"sectionId\":\"follow\",\"block\":-1,\"start\":942.63},{\"sectionId\":\"follow\",\"block\":-1,\"start\":948.87},{\"sectionId\":\"follow\",\"block\":-1,\"start\":951.19},{\"sectionId\":\"follow\",\"block\":-1,\"start\":955.43}],\"scriptSha256\":\"b30548c1b5bda51dfb4a6eeabd0f3c74c382eb4de3064a560bb315a8c2c49d3d\"},{\"version\":1,\"slug\":\"agent-replay\",\"cast\":\"boring-blog-duo\",\"castVersion\":2,\"sourceDate\":\"2026-10-09\",\"src\":\"/posts/agent-replay/audio/discussion-v1-signoff-v1.mp3\",\"duration\":265.4,\"chapters\":[{\"id\":\"the-review-still-takes-time\",\"title\":\"A review you can focus on\",\"start\":0,\"speechEnd\":45.28,\"end\":45.93},{\"id\":\"watch-one-change\",\"title\":\"One change, with its context\",\"start\":45.93,\"speechEnd\":106.81,\"end\":107.46},{\"id\":\"read-the-evidence\",\"title\":\"What did the checks actually show?\",\"start\":107.46,\"speechEnd\":147.14,\"end\":148.04},{\"id\":\"learn-the-surrounding-code\",\"title\":\"Two ways to learn the repository\",\"start\":148.04,\"speechEnd\":217.24,\"end\":218.04},{\"id\":\"give-the-next-reviewer-a-way-in\",\"title\":\"Share a calmer review\",\"start\":218.04,\"speechEnd\":247.8,\"end\":248.6},{\"id\":\"follow\",\"title\":\"Until next time\",\"start\":248.6,\"speechEnd\":264.6,\"end\":265.4}],\"turns\":[{\"sectionId\":\"the-review-still-takes-time\",\"speaker\":\"Narrator\",\"text\":\"I'm Khalil, and this is Maya. Open a sizeable pull request: files everywhere, a wall of red and green, and a limited amount of afternoon.\",\"start\":0,\"end\":9.84,\"overlap\":0},{\"sectionId\":\"the-review-still-takes-time\",\"speaker\":\"Maya\",\"text\":\"You're reviewing the size of the review before you've read any code.\",\"start\":9.84,\"end\":13.68,\"overlap\":0},{\"sectionId\":\"the-review-still-takes-time\",\"speaker\":\"Narrator\",\"text\":\"The interface makes it hard to focus. Changes are condensed into fragments, spread across files. You have to reconstruct the original function, the relationships, and why the agent changed any of it.\",\"start\":13.68,\"end\":25.2,\"overlap\":0},{\"sectionId\":\"the-review-still-takes-time\",\"speaker\":\"Maya\",\"text\":\"While keeping a mental list of everything you haven't reviewed yet. That list is remarkably talkative.\",\"start\":25.2,\"end\":31.28,\"overlap\":0},{\"sectionId\":\"the-review-still-takes-time\",\"speaker\":\"Narrator\",\"text\":\"That's why we built Agent Replay. Lines arrive and disappear smoothly, with the agent's recorded explanation beside the change. Your attention stays on what's happening now.\",\"start\":31.28,\"end\":41.52,\"overlap\":0},{\"sectionId\":\"the-review-still-takes-time\",\"speaker\":\"Maya\",\"text\":\"Pause there. Read that function. Then move on when you're ready.\",\"start\":41.52,\"end\":45.28,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Maya\",\"text\":\"Start with the launch command in the article. You'll need Node twenty or newer, and Git. It opens a local player for existing Claude Code, Codex, and Gemini sessions.\",\"start\":45.93,\"end\":56.33,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Narrator\",\"text\":\"Pick a project and a session. If the project isn't listed, use Open folder in the project picker and point it at the repository.\",\"start\":56.33,\"end\":64.69,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Maya\",\"text\":\"That finds the folder. You'll still need a supported session log or a saved replay for the session itself.\",\"start\":64.69,\"end\":71.21,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Narrator\",\"text\":\"Space plays or pauses. The right arrow finishes a change or advances one step; the left arrow goes back. N jumps between review notes.\",\"start\":71.21,\"end\":81.21,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Maya\",\"text\":\"And you can keep the file tree open. You always have somewhere to look for which file you're in. Switch to File to read the surrounding function, or step back to see its earlier state.\",\"start\":81.21,\"end\":92.25,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Narrator\",\"text\":\"Our little payments demo had an invoice total one cent off. At the fix, a note points out the rounding assumptions. That's the moment to stop and check whether those assumptions fit.\",\"start\":92.25,\"end\":103.05,\"overlap\":0},{\"sectionId\":\"watch-one-change\",\"speaker\":\"Maya\",\"text\":\"The code has already been written. It can survive you reading it.\",\"start\":103.05,\"end\":106.81,\"overlap\":0},{\"sectionId\":\"read-the-evidence\",\"speaker\":\"Narrator\",\"text\":\"Then open Evidence. It lists recorded checks and their results, and flags things worth looking at: deleted tests, a failure hidden by a shell pipe, or changes made after a passing check.\",\"start\":107.46,\"end\":119.3,\"overlap\":0},{\"sectionId\":\"read-the-evidence\",\"speaker\":\"Maya\",\"text\":\"Our demo flags two deleted test files. Should we be worried?\",\"start\":119.3,\"end\":123.94,\"overlap\":0},{\"sectionId\":\"read-the-evidence\",\"speaker\":\"Narrator\",\"text\":\"They were temporary probes. One ran the new tests against the old implementation to make sure they caught the bug. Later, the final test suite passed.\",\"start\":123.94,\"end\":132.74,\"overlap\":0},{\"sectionId\":\"read-the-evidence\",\"speaker\":\"Maya\",\"text\":\"So the sequence matters. A deleted test deserves a look; here, we can see what it was doing.\",\"start\":132.74,\"end\":139.3,\"overlap\":0},{\"sectionId\":\"read-the-evidence\",\"speaker\":\"Narrator\",\"text\":\"And the panel reads the recorded commands and output. It doesn't rerun the tests or decide whether the code is correct. That's still our job.\",\"start\":139.3,\"end\":147.14,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Maya\",\"text\":\"Sometimes you can follow the change perfectly and still have no idea how the rest of the repository fits together.\",\"start\":148.04,\"end\":155.12,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Narrator\",\"text\":\"There are two ways in. Replay the Git history, commit by commit. You can start with the first commit, or choose a later revision and have the existing files introduced before following the changes.\",\"start\":155.12,\"end\":167.2,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Maya\",\"text\":\"The default history is limited to the latest three hundred commits. For the full history, choose the first commit as your starting revision.\",\"start\":167.2,\"end\":175.4,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Narrator\",\"text\":\"Or ask your agent for concise tutorials covering the repository as it is now. The article shows how to install the teaching skills for Claude Code.\",\"start\":175.4,\"end\":184.2,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Maya\",\"text\":\"Give it a useful brief: start with the data types, follow one request, explain the important decisions, and keep going until the repository is covered. Keep the boilerplate brief. We have suffered enough package files.\",\"start\":184.2,\"end\":198.84,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Narrator\",\"text\":\"Open the course under Learn. Real source arrives in small pieces with explanations beside the relevant lines. Pause, inspect the function, and carry on at your own pace.\",\"start\":198.84,\"end\":209.68,\"overlap\":0},{\"sectionId\":\"learn-the-surrounding-code\",\"speaker\":\"Maya\",\"text\":\"The source belongs to the course's pinned revision. The explanations are written by an agent, so read those critically too.\",\"start\":209.68,\"end\":217.24,\"overlap\":0},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"speaker\":\"Narrator\",\"text\":\"You can export the replay as one HTML file that opens offline, and share it alongside the pull request.\",\"start\":218.04,\"end\":224.92,\"overlap\":0},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"speaker\":\"Maya\",\"text\":\"Check it before sharing: it includes code and session context. Then the next reviewer can follow the same steps.\",\"start\":224.92,\"end\":232.68,\"overlap\":0},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"speaker\":\"Narrator\",\"text\":\"Agent Replay is open source. The GitHub link and the commands are in the article. Try it on one small change you'd otherwise skim.\",\"start\":232.68,\"end\":240.84,\"overlap\":0},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"speaker\":\"Maya\",\"text\":\"One change, and permission to take your time.\",\"start\":240.84,\"end\":243.88,\"overlap\":0},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"speaker\":\"Narrator\",\"text\":\"The agent can keep the speed. We get to keep a little understanding.\",\"start\":243.88,\"end\":247.8,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"Thanks for listening. Follow along for more articles, experiments, and things that worked on my machine.\",\"start\":248.6,\"end\":254.84,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Some of them might even work on yours.\",\"start\":254.84,\"end\":257.16,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"No promises. Have a lovely day. Go make something.\",\"start\":257.16,\"end\":261.4,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Preferably a cup of tea first. Bye!\",\"start\":261.4,\"end\":264.6,\"overlap\":0}],\"passages\":[{\"sectionId\":\"the-review-still-takes-time\",\"block\":0,\"start\":0},{\"sectionId\":\"the-review-still-takes-time\",\"block\":0,\"start\":9.84},{\"sectionId\":\"the-review-still-takes-time\",\"block\":1,\"start\":13.68},{\"sectionId\":\"the-review-still-takes-time\",\"block\":1,\"start\":25.2},{\"sectionId\":\"the-review-still-takes-time\",\"block\":2,\"start\":31.28},{\"sectionId\":\"the-review-still-takes-time\",\"block\":2,\"start\":41.52},{\"sectionId\":\"watch-one-change\",\"block\":0,\"start\":45.93},{\"sectionId\":\"watch-one-change\",\"block\":2,\"start\":56.33},{\"sectionId\":\"watch-one-change\",\"block\":2,\"start\":64.69},{\"sectionId\":\"watch-one-change\",\"block\":3,\"start\":71.21},{\"sectionId\":\"watch-one-change\",\"block\":4,\"start\":81.21},{\"sectionId\":\"watch-one-change\",\"block\":6,\"start\":92.25},{\"sectionId\":\"watch-one-change\",\"block\":6,\"start\":103.05},{\"sectionId\":\"read-the-evidence\",\"block\":0,\"start\":107.46},{\"sectionId\":\"read-the-evidence\",\"block\":2,\"start\":119.3},{\"sectionId\":\"read-the-evidence\",\"block\":2,\"start\":123.94},{\"sectionId\":\"read-the-evidence\",\"block\":2,\"start\":132.74},{\"sectionId\":\"read-the-evidence\",\"block\":3,\"start\":139.3},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":0,\"start\":148.04},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":1,\"start\":155.12},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":3,\"start\":167.2},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":4,\"start\":175.4},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":7,\"start\":184.2},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":9,\"start\":198.84},{\"sectionId\":\"learn-the-surrounding-code\",\"block\":9,\"start\":209.68},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"block\":0,\"start\":218.04},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"block\":0,\"start\":224.92},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"block\":1,\"start\":232.68},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"block\":2,\"start\":240.84},{\"sectionId\":\"give-the-next-reviewer-a-way-in\",\"block\":2,\"start\":243.88},{\"sectionId\":\"follow\",\"block\":-1,\"start\":248.6},{\"sectionId\":\"follow\",\"block\":-1,\"start\":254.84},{\"sectionId\":\"follow\",\"block\":-1,\"start\":257.16},{\"sectionId\":\"follow\",\"block\":-1,\"start\":261.4}],\"scriptSha256\":\"7e3542f2098c960c79c4758231bde40131a704e4dcc61d8c32024d21a002ad27\"},{\"version\":1,\"slug\":\"eskiz-number-input\",\"cast\":\"boring-blog-duo\",\"castVersion\":2,\"sourceDate\":\"2026-10-12\",\"src\":\"/posts/eskiz-number-input/audio/discussion-v1-signoff-v1.mp3\",\"duration\":428.02,\"chapters\":[{\"id\":\"start-with-a-width\",\"title\":\"One small rectangle\",\"start\":0,\"speechEnd\":42.48,\"end\":43.13},{\"id\":\"a-number-is-not-an-edit\",\"title\":\"Let me finish typing\",\"start\":43.13,\"speechEnd\":82.97,\"end\":83.62},{\"id\":\"focus-is-a-decision\",\"title\":\"Typing comes first\",\"start\":83.62,\"speechEnd\":135.94,\"end\":136.59},{\"id\":\"explore-then-commit\",\"title\":\"One drag, one decision\",\"start\":136.59,\"speechEnd\":168.27,\"end\":168.92},{\"id\":\"millimeters-are-not-decoration\",\"title\":\"The unit has a job\",\"start\":168.92,\"speechEnd\":196.04,\"end\":196.69},{\"id\":\"keep-the-reason\",\"title\":\"Keep the calculation\",\"start\":196.69,\"speechEnd\":228.93,\"end\":229.58},{\"id\":\"seven-ways-to-say-120\",\"title\":\"The same number, different meanings\",\"start\":229.58,\"speechEnd\":264.38,\"end\":265.03},{\"id\":\"mixed-is-not-zero\",\"title\":\"Three panels, still three panels\",\"start\":265.03,\"speechEnd\":318.63,\"end\":319.28},{\"id\":\"space-and-limits\",\"title\":\"Still working on the small version\",\"start\":319.28,\"speechEnd\":366.64,\"end\":367.29},{\"id\":\"back-to-the-model\",\"title\":\"Back to the model\",\"start\":367.29,\"speechEnd\":410.57,\"end\":411.22},{\"id\":\"follow\",\"title\":\"Until next time\",\"start\":411.22,\"speechEnd\":427.22,\"end\":428.02}],\"turns\":[{\"sectionId\":\"start-with-a-width\",\"speaker\":\"Narrator\",\"text\":\"I'm Khalil, and this is Maya. This is chapter one of building Eskiz. Today we're discussing the most important component in a CAD application. The number input.\",\"start\":0,\"end\":10.72,\"overlap\":0},{\"sectionId\":\"start-with-a-width\",\"speaker\":\"Maya\",\"text\":\"You announced a new approach to three-dimensional modeling. And we've arrived at a small rectangle.\",\"start\":10.72,\"end\":16.72,\"overlap\":0},{\"sectionId\":\"start-with-a-width\",\"speaker\":\"Narrator\",\"text\":\"A very consequential rectangle. Width, radius, angle, spacing. Sooner or later, a design decision passes through it. Let's take a panel, one hundred and twenty millimeters wide.\",\"start\":16.72,\"end\":28.64,\"overlap\":0},{\"sectionId\":\"start-with-a-width\",\"speaker\":\"Maya\",\"text\":\"And make it eight millimeters wider. I feel reasonably qualified for this project.\",\"start\":28.64,\"end\":33.6,\"overlap\":0},{\"sectionId\":\"start-with-a-width\",\"speaker\":\"Narrator\",\"text\":\"Good. Now keep its width related to another part, change the units, and edit three different panels together.\",\"start\":33.6,\"end\":39.84,\"overlap\":0},{\"sectionId\":\"start-with-a-width\",\"speaker\":\"Maya\",\"text\":\"The rectangle has acquired responsibilities.\",\"start\":39.84,\"end\":42.48,\"overlap\":0},{\"sectionId\":\"a-number-is-not-an-edit\",\"speaker\":\"Maya\",\"text\":\"A normal number field can accept a number. It doesn't understand twelve centimeters, or a calculation. So you let people type text instead.\",\"start\":43.13,\"end\":52.65,\"overlap\":0},{\"sectionId\":\"a-number-is-not-an-edit\",\"speaker\":\"Narrator\",\"text\":\"And now we have to understand the text. Halfway through typing one hundred and twenty plus eight, it says one hundred and twenty plus. That isn't a new width. I haven't finished.\",\"start\":52.65,\"end\":64.49,\"overlap\":0},{\"sectionId\":\"a-number-is-not-an-edit\",\"speaker\":\"Maya\",\"text\":\"An unfinished thought. Please don't manufacture it.\",\"start\":64.49,\"end\":68.09,\"overlap\":0},{\"sectionId\":\"a-number-is-not-an-edit\",\"speaker\":\"Narrator\",\"text\":\"We separate the draft, the preview, and the committed value. A valid edit can settle when you press Enter or leave the field. An invalid expression stays there so you can fix it.\",\"start\":68.09,\"end\":78.89,\"overlap\":0},{\"sectionId\":\"a-number-is-not-an-edit\",\"speaker\":\"Maya\",\"text\":\"Keep the evidence. Don't politely erase the bit I need to repair.\",\"start\":78.89,\"end\":82.97,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Narrator\",\"text\":\"The first job is typing a replacement. Usually it's faster to write the new number than to put a cursor between the old digits.\",\"start\":83.62,\"end\":91.46,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Maya\",\"text\":\"Especially when the digit is small and your coffee is ambitious.\",\"start\":91.46,\"end\":95.78,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Narrator\",\"text\":\"So when a plain value gets focus, the old number stays visible in a lighter color. Start typing and you replace it. No selecting or clearing first. If you want to edit the existing number, an arrow key brings it back.\",\"start\":95.78,\"end\":109.38,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Maya\",\"text\":\"And if I just click in and leave?\",\"start\":109.38,\"end\":111.7,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Narrator\",\"text\":\"Nothing changes. A stored formula is different: focus brings back its source. We had a regression where ten plus five became ten plus five thousand one hundred when somebody typed one hundred at the end.\",\"start\":111.7,\"end\":124.42,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Maya\",\"text\":\"That's quite a panel.\",\"start\":124.42,\"end\":126.1,\"overlap\":0},{\"sectionId\":\"focus-is-a-decision\",\"speaker\":\"Narrator\",\"text\":\"Selecting the source on entry prevents that when the host wants replacement behavior. Visually, we keep an internal focus bar. No extra outline around the whole performance.\",\"start\":126.1,\"end\":135.94,\"overlap\":0},{\"sectionId\":\"explore-then-commit\",\"speaker\":\"Maya\",\"text\":\"Sometimes I don't know the number. I just know the panel looks a little too narrow.\",\"start\":136.59,\"end\":141.71,\"overlap\":0},{\"sectionId\":\"explore-then-commit\",\"speaker\":\"Narrator\",\"text\":\"Then drag the label. The shape can preview the change as you move. Release, and that's one committed edit. One undo step, rather than a small archive of your hand movement.\",\"start\":141.71,\"end\":152.67,\"overlap\":0},{\"sectionId\":\"explore-then-commit\",\"speaker\":\"Maya\",\"text\":\"Undo should reverse a decision. Not reconstruct my wrist.\",\"start\":152.67,\"end\":156.99,\"overlap\":0},{\"sectionId\":\"explore-then-commit\",\"speaker\":\"Narrator\",\"text\":\"Alt makes the adjustment finer. Shift makes it faster. Escape cancels and restores the starting value. The component supplies those boundaries; the application owns the history.\",\"start\":156.99,\"end\":168.27,\"overlap\":0},{\"sectionId\":\"millimeters-are-not-decoration\",\"speaker\":\"Narrator\",\"text\":\"Next, units. Twelve centimeters and one hundred and twenty millimeters describe the same width. Typing either should be useful.\",\"start\":168.92,\"end\":177.56,\"overlap\":0},{\"sectionId\":\"millimeters-are-not-decoration\",\"speaker\":\"Maya\",\"text\":\"But changing which unit I look at shouldn't change the object.\",\"start\":177.56,\"end\":181.4,\"overlap\":0},{\"sectionId\":\"millimeters-are-not-decoration\",\"speaker\":\"Narrator\",\"text\":\"Right. Display preference is separate from the authored quantity. We can show a rounded number without throwing away the underlying precision. Otherwise, merely looking at your model would gradually redesign it.\",\"start\":181.4,\"end\":193.24,\"overlap\":0},{\"sectionId\":\"millimeters-are-not-decoration\",\"speaker\":\"Maya\",\"text\":\"A remarkably passive collaboration.\",\"start\":193.24,\"end\":196.04,\"overlap\":0},{\"sectionId\":\"keep-the-reason\",\"speaker\":\"Maya\",\"text\":\"What if the width is half another panel's width? I want to keep that relationship, not just today's answer.\",\"start\":196.69,\"end\":203.73,\"overlap\":0},{\"sectionId\":\"keep-the-reason\",\"speaker\":\"Narrator\",\"text\":\"That's why we keep the formula's source. The field can offer references, show the result, and help with errors. The document owns the actual dependency graph.\",\"start\":203.73,\"end\":214.05,\"overlap\":0},{\"sectionId\":\"keep-the-reason\",\"speaker\":\"Maya\",\"text\":\"And dragging the result?\",\"start\":214.05,\"end\":215.81,\"overlap\":0},{\"sectionId\":\"keep-the-reason\",\"speaker\":\"Narrator\",\"text\":\"It should preserve the calculation. Half the other width, plus a small adjustment. Not silently replace the relationship with a plain number.\",\"start\":215.81,\"end\":224.37,\"overlap\":0},{\"sectionId\":\"keep-the-reason\",\"speaker\":\"Maya\",\"text\":\"I wrote down why it was that size. Please don't tidy away my reasoning.\",\"start\":224.37,\"end\":228.93,\"overlap\":0},{\"sectionId\":\"seven-ways-to-say-120\",\"speaker\":\"Narrator\",\"text\":\"One hundred and twenty can be a default. A number you typed. An override. The result of an expression. Or a value driven by something else.\",\"start\":229.58,\"end\":239.66,\"overlap\":0},{\"sectionId\":\"seven-ways-to-say-120\",\"speaker\":\"Maya\",\"text\":\"Same digits, different answers to: can I change this, and what happens if I do?\",\"start\":239.66,\"end\":245.74,\"overlap\":0},{\"sectionId\":\"seven-ways-to-say-120\",\"speaker\":\"Narrator\",\"text\":\"Add a mixed selection and an error, and we have seven readings. Some offer a reset. A formula has its source. A driven value identifies where it comes from. We use markers and behavior as well as color.\",\"start\":245.74,\"end\":259.5,\"overlap\":0},{\"sectionId\":\"seven-ways-to-say-120\",\"speaker\":\"Maya\",\"text\":\"Because a purple one hundred and twenty is not, by itself, an explanation.\",\"start\":259.5,\"end\":264.38,\"overlap\":0},{\"sectionId\":\"mixed-is-not-zero\",\"speaker\":\"Maya\",\"text\":\"Our panels are forty, sixty, and one hundred millimeters wide. The field says Mixed. It doesn't pick a favorite.\",\"start\":265.03,\"end\":272.95,\"overlap\":0},{\"sectionId\":\"mixed-is-not-zero\",\"speaker\":\"Narrator\",\"text\":\"Type plus twenty and they become sixty, eighty, and one hundred and twenty. Then minus forty subtracts forty from each. Dragging applies a shared adjustment too. Their differences survive.\",\"start\":272.95,\"end\":285.91,\"overlap\":0},{\"sectionId\":\"mixed-is-not-zero\",\"speaker\":\"Maya\",\"text\":\"If I want them all to be eighty, I type eighty. An absolute assignment.\",\"start\":285.91,\"end\":290.95,\"overlap\":0},{\"sectionId\":\"mixed-is-not-zero\",\"speaker\":\"Narrator\",\"text\":\"And in this mixed field, parentheses make an absolute negative explicit. Parentheses, minus forty, close parentheses. Without them, minus forty means subtract forty from each.\",\"start\":290.95,\"end\":302.71,\"overlap\":0},{\"sectionId\":\"mixed-is-not-zero\",\"speaker\":\"Maya\",\"text\":\"A distinction worth showing before someone experiments on a building.\",\"start\":302.71,\"end\":306.63,\"overlap\":0},{\"sectionId\":\"mixed-is-not-zero\",\"speaker\":\"Narrator\",\"text\":\"The batch succeeds together or is refused together. And Escape restores the original values during a drag. The inspector chooses the targets; the field shouldn't secretly manage the entire application.\",\"start\":306.63,\"end\":318.63,\"overlap\":0},{\"sectionId\":\"space-and-limits\",\"speaker\":\"Narrator\",\"text\":\"An inspector gets narrow. A formula gets long. We let the text borrow space from the side controls, and let those controls come back when you need them.\",\"start\":319.28,\"end\":328.88,\"overlap\":0},{\"sectionId\":\"space-and-limits\",\"speaker\":\"Maya\",\"text\":\"Are you happy with it?\",\"start\":328.88,\"end\":330,\"overlap\":0},{\"sectionId\":\"space-and-limits\",\"speaker\":\"Narrator\",\"text\":\"Not very, yet. Especially for long formulas. Keeping them readable and easy to edit in a small field is still something I'm thinking through. The demo shows where we are. It isn't a finished answer.\",\"start\":330,\"end\":342.88,\"overlap\":0},{\"sectionId\":\"space-and-limits\",\"speaker\":\"Maya\",\"text\":\"Good. A work in progress is allowed to contain some progress still to do.\",\"start\":342.88,\"end\":347.52,\"overlap\":0},{\"sectionId\":\"space-and-limits\",\"speaker\":\"Narrator\",\"text\":\"Limits need decisions too. A soft limit warns. A hard limit constrains. A cyclic angle can wrap; a hinge might have real stops. And the document can reject a perfectly valid number if that edit doesn't make sense.\",\"start\":347.52,\"end\":362.4,\"overlap\":0},{\"sectionId\":\"space-and-limits\",\"speaker\":\"Maya\",\"text\":\"Then keep my draft, tell me why, and don't move the object anyway.\",\"start\":362.4,\"end\":366.64,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Maya\",\"text\":\"This is a lot of behavior for something people should barely have to think about.\",\"start\":367.29,\"end\":371.77,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Narrator\",\"text\":\"That's the point. Type what you mean. Explore without losing your starting point. Keep relationships. Understand a refusal. Those little interactions add up to easier modeling.\",\"start\":371.77,\"end\":383.85,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Maya\",\"text\":\"And an AI proposing the change still needs those same rules. We need to inspect it, adjust it, and trust what gets committed.\",\"start\":383.85,\"end\":392.01,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Narrator\",\"text\":\"The production component is much richer than these focused examples. There are plenty more advanced features to discover in the Eskiz app. Here, we wanted to show the decisions underneath them.\",\"start\":392.01,\"end\":402.57,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Maya\",\"text\":\"We started by changing a panel's width.\",\"start\":402.57,\"end\":405.05,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Narrator\",\"text\":\"And now we have opinions about the first arrow key.\",\"start\":405.05,\"end\":407.93,\"overlap\":0},{\"sectionId\":\"back-to-the-model\",\"speaker\":\"Maya\",\"text\":\"I'm keeping mine. In a lighter color.\",\"start\":407.93,\"end\":410.57,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"Thanks for listening. Follow along for more articles, experiments, and things that worked on my machine.\",\"start\":411.22,\"end\":417.46,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Some of them might even work on yours.\",\"start\":417.46,\"end\":419.78,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"No promises. Have a lovely day. Go make something.\",\"start\":419.78,\"end\":424.02,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Preferably a cup of tea first. Bye!\",\"start\":424.02,\"end\":427.22,\"overlap\":0}],\"passages\":[{\"sectionId\":\"start-with-a-width\",\"block\":0,\"start\":0},{\"sectionId\":\"start-with-a-w

icular type, and those belonging to other ethnicities may not even be within its information domain.\",\"inline\":[\"Another example of the fragility of neural networks is face recognition technology. As you may recall, individuals of different ethnicities have faced issues with having their faces recognized correctly. One might assume that since the model has been trained on millions of faces, it should be exceptionally accurate in recognizing all types of faces. However, the reality is quite the opposite.\",{\"kind\":\"br\"},\"Despite being trained on millions of faces, the model’s performance is biased toward a specific ethnicity that is most present in the training dataset. As a result, the model has only learned to recognize faces that match this particular type, and those belonging to other ethnicities may not even be within its information domain.\"]}]},{\"id\":\"a-tool\",\"title\":\"A tool to augment us\",\"blocks\":[{\"kind\":\"p\",\"text\":\"While I may come across as an AI critic in this blog post, my intention is to provide a balanced perspective on the subject. I do not intend to diminish the value of current AI models, but rather to dispel any exaggerated notions of its capabilities. I am quite excited about the recent advancements in AI and eager to see what lies ahead.\"},{\"kind\":\"p\",\"text\":\"To me, these models are akin to a natural language query system, opening up new possibilities for human-computer interaction. Instead of having to learn and use multiple software solutions, AI can serve as a universal interface for various tasks.\"},{\"kind\":\"p\",\"text\":\"While AI may pose a threat to certain professions and income sources, it is important to remember that our intelligence is not defined by our jobs -In many cases, our jobs involve imitating AI by repeatedly performing mundane tasks to fulfill certain societal needs- There are numerous boring tasks that I would gladly automate to focus on more interesting work.\",\"inline\":[\"While AI may pose a threat to certain professions and income sources, it is important to remember that our intelligence is not defined by our jobs \",{\"kind\":\"em\",\"children\":[\"-In many cases, our jobs involve imitating AI by repeatedly performing mundane tasks to fulfill certain societal needs- \"]},\"There are numerous boring tasks that I would gladly automate to focus on more interesting work.\"]},{\"kind\":\"p\",\"text\":\"When it comes to Intelligence, AI models nowadays do not even possess the level of intelligence that our ancestors had when they first learned to manipulate fire hundreds of thousands of years ago. AI -as is today- should be viewed as a tool to augment us, rather than replace us.\",\"inline\":[\"When it comes to Intelligence, AI models nowadays do not even possess the level of intelligence that our ancestors had when they first learned to manipulate fire hundreds of thousands of years ago. AI -\",{\"kind\":\"em\",\"children\":[\"as is today\"]},\"- should be viewed as a tool to augment us, rather than replace us.\"]}]},{\"id\":\"conclusion\",\"title\":\"Chapter 5: Conclusion.\",\"blocks\":[{\"kind\":\"p\",\"text\":\"There is no doubt that the advancements in AI are impressive, and despite the current limitations, the future of AI looks very promising. The direction we are heading towards is AI becoming a Universal User Interface for interacting with our computers rather than AI becoming sentient. The end game of that can potentially lead to an Operating System that does not rely on the multitude of applications and software that we currently use, but instead, only requires a Natural Language or Voice interface to perform all the tasks that we do today.\"},{\"kind\":\"p\",\"text\":\"Thank you for taking the time to read this opinionated blog post. As I wrap up, here are some final thoughts:\"},{\"kind\":\"list\",\"items\":[[\"AGI is currently a concept that is more akin to science fiction than reality. Although goats possess great athletic abilities, they cannot match the beauty and grace of a human athlete. While they may excel in certain areas, it is very debatable whether it can truly be considered athleticism.\"],[\"Creating a genuine AGI demands technology that is still largely in the realm of science fiction. Self-awareness, emotions, and motivation are intrinsic characteristics that cannot be learned through parameters. While AI may appear to be self-aware, this is merely a consequence of being trained on human data such as conversations. The resulting text may seem self-aware because humans possess self-awareness, and our conversations reflect this trait.\"],[\"While increasing the size of the models may enhance specific aspects, it will not necessarily lead to significant improvements in intelligence. Rather, it will likely result in only slight improvements over the current versions.\"],[\"The next significant development in AI might not come from big AI companies but from Epic Games. They have been acquiring several data-centric companies in recent years and standardizing data formats across different platforms, which suggests that they may be working on AI, possibly related to 3D generation.\"],[\"DeepMind has recently published two astonishing papers that highlight their significant progress in AI reasoning. This achievement may have gone unnoticed due to the overwhelming attention given to ChatGPT and other news. \",{\"kind\":\"a\",\"children\":[\"AlphaTensor\"],\"href\":\"https://www.deepmind.com/blog/discovering-novel-algorithms-with-alphatensor\"},\", \",{\"kind\":\"a\",\"children\":[\"AlphaCode\"],\"href\":\"https://www.deepmind.com/blog/competitive-programming-with-alphacode\"}],[\"Another great recent model is \",{\"kind\":\"a\",\"children\":[\"Meta’s Segment Anything Model\"],\"href\":\"https://ai.facebook.com/blog/segment-anything-foundation-model-image-segmentation/\"},\". This model can serve as a generic Visual Scene Understanding Model, which has the potential to make a significant impact on the field of AI. Visual Scene Understanding is a critical task that will enable future AI models to develop a better understanding of the visual content they are analyzing. It is essential for Vision models to comprehend the visual information in a similar way to us. This includes the ability to distinguish different objects, identify their materials and characteristics, understand light and shadow in the scene, and…. Models like Segment Anything are a significant step in the right direction.\"]]},{\"kind\":\"image\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/27.png\",\"alt\":\"Illustration of a goat playing a guitar.\",\"width\":700,\"height\":700}],\"navTitle\":\"Conclusion\"}]}],\"conversations\":[{\"version\":4,\"slug\":\"the-boring-state-of-artificial-intelligence\",\"cast\":\"boring-blog-duo\",\"castVersion\":2,\"sourceDate\":\"2023-04-17\",\"src\":\"/posts/the-boring-state-of-artificial-intelligence/audio/discussion-v4-signoff-v1.mp3\",\"duration\":1003.99,\"chapters\":[{\"id\":\"a-friendly-bet\",\"title\":\"A bet at work\",\"start\":0,\"speechEnd\":44.12,\"end\":45.22},{\"id\":\"the-hype\",\"title\":\"The hype\",\"start\":45.22,\"speechEnd\":93.62,\"end\":94.72},{\"id\":\"what-is-ai\",\"title\":\"What is AI?\",\"start\":94.72,\"speechEnd\":151.44,\"end\":152.54},{\"id\":\"the-artist\",\"title\":\"The artist\",\"start\":152.54,\"speechEnd\":202.06,\"end\":202.71},{\"id\":\"creativity-and-control\",\"title\":\"Creativity and control\",\"start\":202.71,\"speechEnd\":251.99,\"end\":252.64},{\"id\":\"midjourney\",\"title\":\"Evaluating Midjourney\",\"start\":252.64,\"speechEnd\":321.36,\"end\":322.01},{\"id\":\"artistic-choices\",\"title\":\"Artistic choices\",\"start\":322.01,\"speechEnd\":370.09,\"end\":371.19},{\"id\":\"sparks-of-agi\",\"title\":\"Sparks of AGI?\",\"start\":371.19,\"speechEnd\":427.27,\"end\":427.92},{\"id\":\"a-simple-network\",\"title\":\"A simple neural network\",\"start\":427.92,\"speechEnd\":491.76,\"end\":492.41},{\"id\":\"a-talking-calculator\",\"title\":\"A calculator that talks\",\"start\":492.41,\"speechEnd\":543.29,\"end\":543.94},{\"id\":\"arithmetic\",\"title\":\"Let’s try some arithmetic\",\"start\":543.94,\"speechEnd\":592.82,\"end\":593.47},{\"id\":\"bananas\",\"title\":\"A banana, a guitar, and a Strogbunroftak\",\"start\":593.47,\"speechEnd\":636.35,\"end\":637},{\"id\":\"next-token\",\"title\":\"Predicting the next word\",\"start\":637,\"speechEnd\":684.04,\"end\":684.69},{\"id\":\"more-complex\",\"title\":\"The age problem\",\"start\":684.69,\"speechEnd\":725.25,\"end\":725.9},{\"id\":\"information-domain\",\"title\":\"The information domain\",\"start\":725.9,\"speechEnd\":777.34,\"end\":777.99},{\"id\":\"cats-and-chocolate\",\"title\":\"Cats and chocolate\",\"start\":777.99,\"speechEnd\":827.19,\"end\":827.84},{\"id\":\"outside-the-dataset\",\"title\":\"Outside the dataset\",\"start\":827.84,\"speechEnd\":874.48,\"end\":875.13},{\"id\":\"a-tool\",\"title\":\"A tool to augment us\",\"start\":875.13,\"speechEnd\":918.09,\"end\":919.19},{\"id\":\"conclusion\",\"title\":\"Conclusion\",\"start\":919.19,\"speechEnd\":986.39,\"end\":987.19},{\"id\":\"follow\",\"title\":\"Until next time\",\"start\":987.19,\"speechEnd\":1003.19,\"end\":1003.99}],\"turns\":[{\"sectionId\":\"a-friendly-bet\",\"speaker\":\"Narrator\",\"text\":\"A colleague bet I'd fall for the AI hype within six months. Slightly delusional colleague. I responded with a blog post. Several thousand words. He probably just wanted to finish his lunch.\",\"start\":0.06,\"end\":11.02,\"overlap\":0},{\"sectionId\":\"a-friendly-bet\",\"speaker\":\"Maya\",\"text\":\"Was a simple 'no' available?\",\"start\":11.38,\"end\":13.38,\"overlap\":0},{\"sectionId\":\"a-friendly-bet\",\"speaker\":\"Narrator\",\"text\":\"Apparently not. I'm Khalil. This is Maya. And we're going back to April seventeenth, twenty twenty-three, when I wrote The boring state of artificial intelligence.\",\"start\":13.8,\"end\":23.36,\"overlap\":0},{\"sectionId\":\"a-friendly-bet\",\"speaker\":\"Maya\",\"text\":\"Back to those models, those experiments. I want that on the record before you start predicting the future.\",\"start\":23.72,\"end\":29.84,\"overlap\":0},{\"sectionId\":\"a-friendly-bet\",\"speaker\":\"Narrator\",\"text\":\"Fair. I'd been working in data science and engineering for about six years. Enough to have questions. Also enough to get very attached to my own answers. You'll hear some of that.\",\"start\":30.22,\"end\":40.46,\"overlap\":0},{\"sectionId\":\"a-friendly-bet\",\"speaker\":\"Maya\",\"text\":\"All right. Let's see what annoyed you enough to interrupt lunch.\",\"start\":40.76,\"end\":44.12,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Narrator\",\"text\":\"First diagnosis: Wikipedia scientist syndrome. You read two articles, develop three opinions, and suddenly you're qualified to supervise the future of civilization.\",\"start\":45.22,\"end\":55.14,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Maya\",\"text\":\"Only two articles? I've been overtraining.\",\"start\":55.14,\"end\":58.42,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Narrator\",\"text\":\"Reading matters. But reading about painting doesn't teach your hand to paint. You have to draw, fail, notice why, and try again. The problem gets louder when shallow certainty comes with a very large audience.\",\"start\":58.42,\"end\":71.3,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Maya\",\"text\":\"Have you tried the thing before explaining it to everyone?\",\"start\":71.3,\"end\":74.26,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Narrator\",\"text\":\"That would help. Then there's the other habit: a demo works, and suddenly we're discussing sentience. Flying cars! The end of work! Meanwhile, my actual car is still in traffic.\",\"start\":74.26,\"end\":84.34,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Maya\",\"text\":\"And your own certainty?\",\"start\":84.34,\"end\":85.94,\"overlap\":0},{\"sectionId\":\"the-hype\",\"speaker\":\"Narrator\",\"text\":\"Oh, inspect mine too. I have several thousand words of evidence. Take the opinions with salt. Keep a glass of water nearby.\",\"start\":85.94,\"end\":93.62,\"overlap\":0},{\"sectionId\":\"what-is-ai\",\"speaker\":\"Narrator\",\"text\":\"Let's give ourselves something small enough to understand. In this article, I'm mostly talking about neural networks. Under suitable conditions, they're universal approximators. That's the universal approximation theorem, with foundational work by George Cybenko, and by Kurt Hornik, Maxwell Stinchcombe and Halbert White, in 1989. Definitely not something I came up with.\",\"start\":94.72,\"end\":117.2,\"overlap\":0},{\"sectionId\":\"what-is-ai\",\"speaker\":\"Maya\",\"text\":\"That's it? The robot uprising is a function?\",\"start\":117.2,\"end\":121.04,\"overlap\":0},{\"sectionId\":\"what-is-ai\",\"speaker\":\"Narrator\",\"text\":\"With suitable activation functions and enough capacity, a network can approximate continuous functions on a closed, bounded domain as closely as we like. That doesn't guarantee training will find the right answer. Start with inputs and outputs: the network learns a relationship between them. We'll try it with two numbers in a minute.\",\"start\":121.04,\"end\":139.04,\"overlap\":0},{\"sectionId\":\"what-is-ai\",\"speaker\":\"Maya\",\"text\":\"Good, because universal sounds suspiciously like it comes with a lifetime warranty.\",\"start\":139.04,\"end\":144.56,\"overlap\":0},{\"sectionId\":\"what-is-ai\",\"speaker\":\"Narrator\",\"text\":\"No warranty. And for the art discussion, I'm mostly looking at two-dimensional images. Otherwise we'll still be here tomorrow.\",\"start\":144.56,\"end\":151.44,\"overlap\":0},{\"sectionId\":\"the-artist\",\"speaker\":\"Narrator\",\"text\":\"Let's start with art. My three ingredients were technical skill, creativity, and control. Technical skill includes lighting, color, composition, form, and anatomy. All the quiet decisions that make an image work.\",\"start\":152.54,\"end\":167.82,\"overlap\":0},{\"sectionId\":\"the-artist\",\"speaker\":\"Maya\",\"text\":\"I know where this is going. Hands.\",\"start\":167.82,\"end\":171.1,\"overlap\":0},{\"sectionId\":\"the-artist\",\"speaker\":\"Narrator\",\"text\":\"Hands. Beautiful portrait, lovely light, one finger doing something deeply independent. That's all anyone sees. Now, an artist can distort anatomy deliberately. But knowing what you're changing makes a difference.\",\"start\":171.1,\"end\":185.74,\"overlap\":0},{\"sectionId\":\"the-artist\",\"speaker\":\"Maya\",\"text\":\"You can break the rules on purpose. You still need to know where they were.\",\"start\":185.74,\"end\":190.14,\"overlap\":0},{\"sectionId\":\"the-artist\",\"speaker\":\"Narrator\",\"text\":\"Look at Michelangelo's anatomical studies in the article. There's so much patient observation there. That's the part I wanted to talk about: all the work behind being able to choose what goes on the page.\",\"start\":190.14,\"end\":202.06,\"overlap\":0},{\"sectionId\":\"creativity-and-control\",\"speaker\":\"Maya\",\"text\":\"Technical skill is one ingredient. What do creativity and control add?\",\"start\":202.71,\"end\":207.83,\"overlap\":0},{\"sectionId\":\"creativity-and-control\",\"speaker\":\"Narrator\",\"text\":\"Creativity brings your imagination and your taste. Control lets you put them into the image. Move the light a little. Change the posture. Make the room feel uncomfortable, although nothing obviously terrible is happening.\",\"start\":207.83,\"end\":221.67,\"overlap\":0},{\"sectionId\":\"creativity-and-control\",\"speaker\":\"Maya\",\"text\":\"So a happy accident is welcome. It just shouldn't be the entire management team.\",\"start\":221.67,\"end\":226.87,\"overlap\":0},{\"sectionId\":\"creativity-and-control\",\"speaker\":\"Narrator\",\"text\":\"Look at Piotr Jablonski's work here, then Alfred Broge's Morning Sunlight. One feels unsettling. The other gives you this quiet, sunlit room. The lighting and composition help create those feelings.\",\"start\":226.87,\"end\":240.03,\"overlap\":0},{\"sectionId\":\"creativity-and-control\",\"speaker\":\"Maya\",\"text\":\"One makes you admire the light. The other makes you check whether something is standing behind you.\",\"start\":240.03,\"end\":245.59,\"overlap\":0},{\"sectionId\":\"creativity-and-control\",\"speaker\":\"Narrator\",\"text\":\"And they get there by choosing what matters in each picture. Which makes grading the machine a little awkward.\",\"start\":245.59,\"end\":251.99,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Narrator\",\"text\":\"Could Midjourney be an artist? My article initially says yes, and then spends quite a while arguing with itself. What impressed me was the lighting, color, and composition of its images.\",\"start\":252.64,\"end\":264.68,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Maya\",\"text\":\"You wrote both sides of the argument? Efficient.\",\"start\":264.68,\"end\":268.48,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Narrator\",\"text\":\"I guessed at parts of the training process too: curated images, loss functions. Guesses. I didn't have access to Midjourney's internals. What I could see was lovely lighting alongside anatomy and structure that sometimes fell apart.\",\"start\":268.48,\"end\":283.36,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Maya\",\"text\":\"And imagination? Surely artists also learn from things they've seen.\",\"start\":283.36,\"end\":287.92,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Narrator\",\"text\":\"They do. I described that as a visual library. Artists study animals, objects, light, and scenery, then combine and transform what they've learned. An image model has an enormous collection of learned visual patterns to work with.\",\"start\":287.92,\"end\":302,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Maya\",\"text\":\"Then I'm still stuck on intention. Who decides what the picture is trying to do?\",\"start\":302,\"end\":307.36,\"overlap\":0},{\"sectionId\":\"midjourney\",\"speaker\":\"Narrator\",\"text\":\"The person using it brings that intention. I could see a remarkable tool for trying out ideas. Calling the model itself an artist, with a purpose of its own... that's where I hesitated. Other people can reasonably draw that line elsewhere.\",\"start\":307.36,\"end\":321.36,\"overlap\":0},{\"sectionId\":\"artistic-choices\",\"speaker\":\"Narrator\",\"text\":\"Look at Nathan Fawkes. He can simplify structure and give all that attention to color and light. Steve Huston might put anatomy and gesture at the center. You don't have to demonstrate every skill in every painting.\",\"start\":322.01,\"end\":335.37,\"overlap\":0},{\"sectionId\":\"artistic-choices\",\"speaker\":\"Maya\",\"text\":\"So your three-ingredient recipe isn't a spreadsheet for giving paintings a performance review.\",\"start\":335.37,\"end\":340.57,\"overlap\":0},{\"sectionId\":\"artistic-choices\",\"speaker\":\"Narrator\",\"text\":\"Please don't give paintings quarterly targets. The point is choice. An artist can leave a detail out because it doesn't serve the work. That differs from losing the detail because the system didn't hold it together.\",\"start\":340.57,\"end\":353.45,\"overlap\":0},{\"sectionId\":\"artistic-choices\",\"speaker\":\"Maya\",\"text\":\"Okay, I see what you're getting at. Did you choose to leave it out, or could you not make it work?\",\"start\":353.45,\"end\":359.29,\"overlap\":0},{\"sectionId\":\"artistic-choices\",\"speaker\":\"Narrator\",\"text\":\"That's what I wanted to ask. A beautiful result alone doesn't answer it. Now, about intelligence. Surely we'll agree on that in thirty seconds.\",\"start\":359.29,\"end\":368.17,\"overlap\":0},{\"sectionId\":\"artistic-choices\",\"speaker\":\"Maya\",\"text\":\"I'll cancel my afternoon.\",\"start\":368.17,\"end\":370.09,\"overlap\":0},{\"sectionId\":\"sparks-of-agi\",\"speaker\":\"Narrator\",\"text\":\"The essay responds to Sparks of Artificial General Intelligence, the early GPT-four experiments. Instead of treating intelligence as one agreed score, I proposed a working definition: using existing information in new ways, and extending what we know.\",\"start\":371.19,\"end\":387.75,\"overlap\":0},{\"sectionId\":\"sparks-of-agi\",\"speaker\":\"Maya\",\"text\":\"Your working definition. I'm keeping a pencil next to it.\",\"start\":387.75,\"end\":391.83,\"overlap\":0},{\"sectionId\":\"sparks-of-agi\",\"speaker\":\"Narrator\",\"text\":\"Please do. Think about fire. You notice it. Then you learn to control it, cook with it, use it for something you couldn't do before. That's the kind of step I was interested in.\",\"start\":391.83,\"end\":402.63,\"overlap\":0},{\"sectionId\":\"sparks-of-agi\",\"speaker\":\"Maya\",\"text\":\"Humanity: sees a dangerous burning object, asks whether dinner could be improved.\",\"start\":402.63,\"end\":408.39,\"overlap\":0},{\"sectionId\":\"sparks-of-agi\",\"speaker\":\"Narrator\",\"text\":\"Dinner is a strong research incentive. The diagram here draws possible information as a big space, human knowledge as a region inside it, and individuals as little dots. It's a sketch to think with. I haven't measured anybody's brain.\",\"start\":408.39,\"end\":422.87,\"overlap\":0},{\"sectionId\":\"sparks-of-agi\",\"speaker\":\"Maya\",\"text\":\"So show me a small version. What does learning actually look like?\",\"start\":422.87,\"end\":427.27,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Narrator\",\"text\":\"Let's build the world's least threatening AI. Two numbers go in. Their sum comes out. At first, the network's adjustable weights aren't set to produce the answer we want.\",\"start\":427.92,\"end\":438.56,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Maya\",\"text\":\"Two numbers. Good. I can supervise.\",\"start\":438.56,\"end\":441.6,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Narrator\",\"text\":\"We supply examples with known answers. The network makes a prediction. A loss function measures how far that prediction is from the target. Training adjusts the weights to reduce that error across the examples.\",\"start\":441.6,\"end\":454.4,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Maya\",\"text\":\"So 'loss' is just a measure of the mistake. Nobody inside the laptop is having a bad day.\",\"start\":454.4,\"end\":460.4,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Narrator\",\"text\":\"Correct. Now ask it to multiply. We trained this little setup for addition; multiplication wasn't part of the job. We need to specify the operation and train for that too. Doing well on our examples doesn't promise it will handle every new input.\",\"start\":460.4,\"end\":474.96,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Maya\",\"text\":\"I may have promoted it too early.\",\"start\":474.96,\"end\":477.2,\"overlap\":0},{\"sectionId\":\"a-simple-network\",\"speaker\":\"Narrator\",\"text\":\"Universal approximation tells us what suitable networks can represent under certain assumptions. It doesn't promise that this network, with this training, learns the right thing. Also, I got bored of drawing the diagrams at this point. The next one exists in spirit.\",\"start\":477.2,\"end\":491.76,\"overlap\":0},{\"sectionId\":\"a-talking-calculator\",\"speaker\":\"Narrator\",\"text\":\"Now we change the interface. Instead of entering two numbers, we ask, could you please add twelve and thirty-five? The answer comes back as a sentence. Forty-seven, with excellent manners.\",\"start\":492.41,\"end\":504.73,\"overlap\":0},{\"sectionId\":\"a-talking-calculator\",\"speaker\":\"Maya\",\"text\":\"Does saying please improve the arithmetic?\",\"start\":504.73,\"end\":507.93,\"overlap\":0},{\"sectionId\":\"a-talking-calculator\",\"speaker\":\"Narrator\",\"text\":\"It improves the atmosphere. My argument was that a language interface is useful even without treating it as proof of general intelligence. You can bring summarization, translation, classification, and other tasks behind the same conversational doorway.\",\"start\":507.93,\"end\":522.61,\"overlap\":0},{\"sectionId\":\"a-talking-calculator\",\"speaker\":\"Maya\",\"text\":\"I'd still use that. I spend half my day finding the right menu.\",\"start\":522.61,\"end\":526.57,\"overlap\":0},{\"sectionId\":\"a-talking-calculator\",\"speaker\":\"Narrator\",\"text\":\"Me too. That's useful. Then there's the confident wrong answer. I suggested interference inside networks as an explanation in the essay, but that was an intuition. It doesn't explain every hallucination.\",\"start\":526.57,\"end\":539.93,\"overlap\":0},{\"sectionId\":\"a-talking-calculator\",\"speaker\":\"Maya\",\"text\":\"Let's give the very polite calculator a calculation.\",\"start\":539.93,\"end\":543.29,\"overlap\":0},{\"sectionId\":\"arithmetic\",\"speaker\":\"Narrator\",\"text\":\"The screenshots here are from the March twenty-third version of ChatGPT in twenty twenty-three. I gave it a long decimal addition problem. It got the result wrong. Then I simplified the operation and tried again in a fresh session.\",\"start\":543.94,\"end\":557.38,\"overlap\":0},{\"sectionId\":\"arithmetic\",\"speaker\":\"Maya\",\"text\":\"Go on. Did it get the answer?\",\"start\":557.38,\"end\":559.3,\"overlap\":0},{\"sectionId\":\"arithmetic\",\"speaker\":\"Narrator\",\"text\":\"It got it wrong. Confidently. The screenshots have the exact decimals; I'll spare you the audio version of a bank statement. I tried a simpler operation as well. Still, the explanation sounded much better than the arithmetic.\",\"start\":559.3,\"end\":572.98,\"overlap\":0},{\"sectionId\":\"arithmetic\",\"speaker\":\"Maya\",\"text\":\"But a wrong answer doesn't tell you, by itself, why the model was wrong.\",\"start\":572.98,\"end\":577.7,\"overlap\":0},{\"sectionId\":\"arithmetic\",\"speaker\":\"Narrator\",\"text\":\"Right. I blamed things like overfitting and limited reasoning. A few screenshots don't establish those causes. What we can do is check the answer, change the problem, and see whether it still works.\",\"start\":577.7,\"end\":589.54,\"overlap\":0},{\"sectionId\":\"arithmetic\",\"speaker\":\"Maya\",\"text\":\"Please check before the bow. The bow makes it worse.\",\"start\":589.54,\"end\":592.82,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Narrator\",\"text\":\"Next, a nose, a guitar, a banana, a chinchilla, and a Strogbunroftak. I asked a stacking question. The reply wandered into ethics, banana-related insects, and concern for a creature whose name I'd made up.\",\"start\":593.47,\"end\":608.59,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Maya\",\"text\":\"Ooh. What's a Strogbunroftak?\",\"start\":608.59,\"end\":611.71,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Narrator\",\"text\":\"I made it up.\",\"start\":611.71,\"end\":612.75,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Maya\",\"text\":\"And it was worried about it? That's rather sweet.\",\"start\":612.75,\"end\":616.43,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Narrator\",\"text\":\"Sweet, yes. Useful... less so. It had filled in a whole situation I hadn't described. My question got buried under advice about that invented situation.\",\"start\":616.43,\"end\":627.63,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Maya\",\"text\":\"It could have asked me what the word meant. I'd quite like to know too.\",\"start\":627.63,\"end\":631.39,\"overlap\":0},{\"sectionId\":\"bananas\",\"speaker\":\"Narrator\",\"text\":\"A small 'I don't know' would have saved everyone a lot of banana-related concern.\",\"start\":631.39,\"end\":636.35,\"overlap\":0},{\"sectionId\":\"next-token\",\"speaker\":\"Narrator\",\"text\":\"Underneath this conversation is next-token prediction. A token is a chunk of text, sometimes a word, sometimes part of one. The model generates a continuation from the context, then continues from that larger context.\",\"start\":637,\"end\":651.08,\"overlap\":0},{\"sectionId\":\"next-token\",\"speaker\":\"Maya\",\"text\":\"It's choosing what could come next. Where does checking the facts happen?\",\"start\":651.08,\"end\":655.56,\"overlap\":0},{\"sectionId\":\"next-token\",\"speaker\":\"Narrator\",\"text\":\"That prediction alone isn't a fact check. The training text includes reliable claims, mistakes, opinions, all sorts. You can get a very convincing continuation that's false. That's what my simplified examples were trying to show.\",\"start\":655.56,\"end\":669.56,\"overlap\":0},{\"sectionId\":\"next-token\",\"speaker\":\"Maya\",\"text\":\"And there's more to the finished chatbot than that one step, of course.\",\"start\":669.56,\"end\":673,\"overlap\":0},{\"sectionId\":\"next-token\",\"speaker\":\"Narrator\",\"text\":\"Yes. The original article says so too. Then it brings back my Wikipedia scientist joke. I seem to have learned one pattern particularly well.\",\"start\":673,\"end\":682.2,\"overlap\":0},{\"sectionId\":\"next-token\",\"speaker\":\"Maya\",\"text\":\"At least you remembered your source.\",\"start\":682.2,\"end\":684.04,\"overlap\":0},{\"sectionId\":\"more-complex\",\"speaker\":\"Narrator\",\"text\":\"Next came a father-and-son age problem. The initial answer looked impressive. So naturally I declared humanity doomed, then made the question a little more complicated.\",\"start\":684.69,\"end\":694.21,\"overlap\":0},{\"sectionId\":\"more-complex\",\"speaker\":\"Maya\",\"text\":\"Before lunch again?\",\"start\":694.21,\"end\":695.73,\"overlap\":0},{\"sectionId\":\"more-complex\",\"speaker\":\"Narrator\",\"text\":\"The later answers were less convincing. I tried a fresh session too. The screenshots matter because the argument isn't just that the text sounds intelligent. It's whether the relationships in the problem stay consistent when the setup changes.\",\"start\":695.73,\"end\":708.93,\"overlap\":0},{\"sectionId\":\"more-complex\",\"speaker\":\"Maya\",\"text\":\"Change one condition. See if the family ages still make sense. I can follow that test.\",\"start\":708.93,\"end\":714.21,\"overlap\":0},{\"sectionId\":\"more-complex\",\"speaker\":\"Narrator\",\"text\":\"And keep the conclusion tied to the test. I was broader, and more skeptical, in the article. Those screenshots tell us what that version did on those questions. They can't answer for every future model.\",\"start\":714.21,\"end\":725.25,\"overlap\":0},{\"sectionId\":\"information-domain\",\"speaker\":\"Narrator\",\"text\":\"This leads to the information domain. With a narrow model, its boundaries are obvious: it summarizes text, for example. With a chatbot that answers almost anything, the boundary is harder to see.\",\"start\":725.9,\"end\":738.54,\"overlap\":0},{\"sectionId\":\"information-domain\",\"speaker\":\"Maya\",\"text\":\"You can ask it almost anything. It's hard to tell when you've walked past what it can handle.\",\"start\":738.54,\"end\":744.22,\"overlap\":0},{\"sectionId\":\"information-domain\",\"speaker\":\"Narrator\",\"text\":\"Yes. I called that its information domain. I was trying to distinguish combining patterns it had learned from extending knowledge. The image styles and the little arithmetic network were my way into that question.\",\"start\":744.22,\"end\":756.54,\"overlap\":0},{\"sectionId\":\"information-domain\",\"speaker\":\"Maya\",\"text\":\"But you can't find the exact boundary from those few examples.\",\"start\":756.54,\"end\":760.06,\"overlap\":0},{\"sectionId\":\"information-domain\",\"speaker\":\"Narrator\",\"text\":\"No. And when I wrote that models could 'never' do certain things, I went further than those examples justified. Give them a new situation. See what transfers. That's a question we can test.\",\"start\":760.06,\"end\":772.62,\"overlap\":0},{\"sectionId\":\"information-domain\",\"speaker\":\"Maya\",\"text\":\"I'd keep 'never' in pencil too. We're getting through a lot of pencils.\",\"start\":772.62,\"end\":777.34,\"overlap\":0},{\"sectionId\":\"cats-and-chocolate\",\"speaker\":\"Narrator\",\"text\":\"To explore combining ideas, I asked for a poem about two things I love: cats and chocolate. I expected charm. I received something considerably darker.\",\"start\":777.99,\"end\":789.35,\"overlap\":0},{\"sectionId\":\"cats-and-chocolate\",\"speaker\":\"Maya\",\"text\":\"Oh no. Cats and chocolate. I can already hear the warning.\",\"start\":789.35,\"end\":794.31,\"overlap\":0},{\"sectionId\":\"cats-and-chocolate\",\"speaker\":\"Narrator\",\"text\":\"I wasn't giving chocolate to a cat! I wanted a poem. But the answer seemed to follow that familiar warning instead of the mood I was asking for.\",\"start\":794.31,\"end\":803.51,\"overlap\":0},{\"sectionId\":\"cats-and-chocolate\",\"speaker\":\"Maya\",\"text\":\"It found the association. Missed the occasion.\",\"start\":803.51,\"end\":806.87,\"overlap\":0},{\"sectionId\":\"cats-and-chocolate\",\"speaker\":\"Narrator\",\"text\":\"Then I went back to fire. Suppose a model only had information from before we discovered it. Could it reach cooking? I didn't run that experiment; I was asking where a new discovery comes from. How far can combining what you know take you?\",\"start\":806.87,\"end\":822.15,\"overlap\":0},{\"sectionId\":\"cats-and-chocolate\",\"speaker\":\"Maya\",\"text\":\"For the next poem, could we try cats and fish? Give the poor thing a chance.\",\"start\":822.15,\"end\":827.19,\"overlap\":0},{\"sectionId\":\"outside-the-dataset\",\"speaker\":\"Narrator\",\"text\":\"The stakes become less funny outside the dataset. A driving system trained in one setting may struggle with different roads and habits. A face-recognition system can perform unevenly when its data represents some people much better than others.\",\"start\":827.84,\"end\":841.76,\"overlap\":0},{\"sectionId\":\"outside-the-dataset\",\"speaker\":\"Maya\",\"text\":\"Which people and situations did the examples leave out?\",\"start\":841.76,\"end\":845.2,\"overlap\":0},{\"sectionId\":\"outside-the-dataset\",\"speaker\":\"Narrator\",\"text\":\"That's the question. I also pushed back on 'humans use eyes, so cameras are enough to drive like a human.' That skips a lot. I wanted the discussion to take perception and other sources of information seriously.\",\"start\":845.2,\"end\":857.92,\"overlap\":0},{\"sectionId\":\"outside-the-dataset\",\"speaker\":\"Maya\",\"text\":\"Then test the actual car, in the actual conditions. The analogy won't drive it home.\",\"start\":857.92,\"end\":863.76,\"overlap\":0},{\"sectionId\":\"outside-the-dataset\",\"speaker\":\"Narrator\",\"text\":\"And ask who carries the cost when it fails. A system working beautifully for one group tells you very little about someone the evaluation left out. That deserves time and careful testing.\",\"start\":863.76,\"end\":874.48,\"overlap\":0},{\"sectionId\":\"a-tool\",\"speaker\":\"Maya\",\"text\":\"I have to ask. Is there anything here you actually like?\",\"start\":875.13,\"end\":879.37,\"overlap\":0},{\"sectionId\":\"a-tool\",\"speaker\":\"Narrator\",\"text\":\"Yes! Terrible news for my title. Tell a computer what you need, in normal language, and have it help you do it. Less time remembering which application hides the button.\",\"start\":879.37,\"end\":889.93,\"overlap\":0},{\"sectionId\":\"a-tool\",\"speaker\":\"Maya\",\"text\":\"You'd miss hunting through six menus?\",\"start\":889.93,\"end\":892.49,\"overlap\":0},{\"sectionId\":\"a-tool\",\"speaker\":\"Narrator\",\"text\":\"I'd recover. There are plenty of repetitive jobs I'd happily hand over. Doing them isn't what makes me intelligent, or makes the work meaningful. I'd rather spend that time making something I care about.\",\"start\":892.49,\"end\":904.17,\"overlap\":0},{\"sectionId\":\"a-tool\",\"speaker\":\"Maya\",\"text\":\"And changing people's jobs still has consequences. Even when the tool is useful.\",\"start\":904.17,\"end\":909.53,\"overlap\":0},{\"sectionId\":\"a-tool\",\"speaker\":\"Narrator\",\"text\":\"Of course. I want useful tools and an honest conversation about what changes. That's where I was trying to get, underneath all the complaining.\",\"start\":909.53,\"end\":918.09,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Narrator\",\"text\":\"I ended up imagining an operating system you could talk to. Describe what you need, have it work across the applications. That was one direction I was excited about.\",\"start\":919.19,\"end\":928.79,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Maya\",\"text\":\"Plus a few predictions. You did have room left on the internet.\",\"start\":928.79,\"end\":933.11,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Narrator\",\"text\":\"A few. I questioned scale alone as a route to intelligence, wondered about Epic Games and three-dimensional generation, and pointed to AlphaTensor, AlphaCode, and Segment Anything. Those were things I wanted to watch in April twenty twenty-three.\",\"start\":933.11,\"end\":948.15,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Maya\",\"text\":\"We'll leave the predictions as you wrote them. No quietly correcting the exam after getting it back.\",\"start\":948.15,\"end\":953.51,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Narrator\",\"text\":\"Agreed. Which leaves the goat playing a guitar at the end. An impressive performance. Quite a lot still to ask before declaring it a musician.\",\"start\":953.51,\"end\":961.99,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Maya\",\"text\":\"Let it finish the solo first.\",\"start\":961.99,\"end\":964.31,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Narrator\",\"text\":\"Fair. Thanks for spending the time with us. The original experiments and images are there if you want a closer look. And if you disagree, pick a particular claim. That's where the interesting conversation starts.\",\"start\":964.31,\"end\":975.83,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Maya\",\"text\":\"One particular claim, then. Did your colleague win the bet?\",\"start\":975.83,\"end\":979.51,\"overlap\":0},{\"sectionId\":\"conclusion\",\"speaker\":\"Narrator\",\"text\":\"I didn't put the result in the article. After all those words... I left out the result.\",\"start\":979.51,\"end\":986.39,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"Thanks for listening. Follow along for more articles, experiments, and things that worked on my machine.\",\"start\":987.19,\"end\":993.43,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Some of them might even work on yours.\",\"start\":993.43,\"end\":995.75,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"No promises. Have a lovely day. Go make something.\",\"start\":995.75,\"end\":999.99,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Preferably a cup of tea first. Bye!\",\"start\":999.99,\"end\":1003.19,\"overlap\":0}],\"passages\":[{\"sectionId\":\"a-friendly-bet\",\"block\":0,\"start\":0.06},{\"sectionId\":\"a-friendly-bet\",\"block\":0,\"start\":11.38},{\"sectionId\":\"a-friendly-bet\",\"block\":1,\"start\":13.8},{\"sectionId\":\"a-friendly-bet\",\"block\":1,\"start\":23.72},{\"sectionId\":\"a-friendly-bet\",\"block\":2,\"start\":30.22},{\"sectionId\":\"a-friendly-bet\",\"block\":3,\"start\":35.34},{\"sectionId\":\"a-friendly-bet\",\"block\":3,\"start\":40.76},{\"sectionId\":\"the-hype\",\"block\":0,\"start\":45.22},{\"sectionId\":\"the-hype\",\"block\":1,\"start\":50.18},{\"sectionId\":\"the-hype\",\"block\":1,\"start\":55.14},{\"sectionId\":\"the-hype\",\"block\":2,\"start\":58.42},{\"sectionId\":\"the-hype\",\"block\":3,\"start\":64.86},{\"sectionId\":\"the-hype\",\"block\":3,\"start\":71.3},{\"sectionId\":\"the-hype\",\"block\":4,\"start\":74.26},{\"sectionId\":\"the-hype\",\"block\":5,\"start\":76.78},{\"sectionId\":\"the-hype\",\"block\":6,\"start\":79.3},{\"sectionId\":\"the-hype\",\"block\":7,\"start\":81.82},{\"sectionId\":\"the-hype\",\"block\":8,\"start\":84.34},{\"sectionId\":\"the-hype\",\"block\":8,\"start\":85.94},{\"sectionId\":\"the-hype\",\"block\":9,\"start\":89.78},{\"sectionId\":\"what-is-ai\",\"block\":0,\"start\":94.72},{\"sectionId\":\"what-is-ai\",\"block\":2,\"start\":102.206},{\"sectionId\":\"what-is-ai\",\"block\":3,\"start\":109.714},{\"sectionId\":\"what-is-ai\",\"block\":4,\"start\":117.2},{\"sectionId\":\"what-is-ai\",\"block\":5,\"start\":121.04},{\"sectionId\":\"what-is-ai\",\"block\":5,\"start\":139.04},{\"sectionId\":\"what-is-ai\",\"block\":6,\"start\":144.56},{\"sectionId\":\"the-artist\",\"block\":0,\"start\":152.54},{\"sectionId\":\"the-artist\",\"block\":2,\"start\":157.628},{\"sectionId\":\"the-artist\",\"block\":3,\"start\":162.732},{\"sectionId\":\"the-artist\",\"block\":3,\"start\":167.82},{\"sectionId\":\"the-artist\",\"block\":3,\"start\":171.1},{\"sectionId\":\"the-artist\",\"block\":3,\"start\":185.74},{\"sectionId\":\"the-artist\",\"block\":4,\"start\":190.14},{\"sectionId\":\"the-artist\",\"block\":5,\"start\":194.109},{\"sectionId\":\"the-artist\",\"block\":6,\"start\":198.091},{\"sectionId\":\"creativity-and-control\",\"block\":0,\"start\":202.71},{\"sectionId\":\"creativity-and-control\",\"block\":0,\"start\":207.83},{\"sectionId\":\"creativity-and-control\",\"block\":0,\"start\":221.67},{\"sectionId\":\"creativity-and-control\",\"block\":1,\"start\":226.87},{\"sectionId\":\"creativity-and-control\",\"block\":2,\"start\":230.16},{\"sectionId\":\"creativity-and-control\",\"block\":3,\"start\":233.45},{\"sectionId\":\"creativity-and-control\",\"block\":4,\"start\":236.74},{\"sectionId\":\"creativity-and-control\",\"block\":4,\"start\":240.03},{\"sectionId\":\"creativity-and-control\",\"block\":4,\"start\":245.59},{\"sectionId\":\"midjourney\",\"block\":0,\"start\":252.64},{\"sectionId\":\"midjourney\",\"block\":1,\"start\":258.66},{\"sectionId\":\"midjourney\",\"block\":1,\"start\":264.68},{\"sectionId\":\"midjourney\",\"block\":2,\"start\":268.48},{\"sectionId\":\"midjourney\",\"block\":4,\"start\":275.92},{\"sectionId\":\"midjourney\",\"block\":6,\"start\":283.36},{\"sectionId\":\"midjourney\",\"block\":6,\"item\":1,\"start\":287.92},{\"sectionId\":\"midjourney\",\"block\":6,\"item\":2,\"start\":302},{\"sectionId\":\"midjourney\",\"block\":6,\"item\":3,\"start\":307.36},{\"sectionId\":\"artistic-choices\",\"block\":0,\"start\":322.01},{\"sectionId\":\"artistic-choices\",\"block\":1,\"start\":324.682},{\"sectionId\":\"artistic-choices\",\"block\":2,\"start\":327.354},{\"sectionId\":\"artistic-choices\",\"block\":3,\"start\":330.026},{\"sectionId\":\"artistic-choices\",\"block\":4,\"start\":332.698},{\"sectionId\":\"artistic-choices\",\"block\":4,\"start\":335.37},{\"sectionId\":\"artistic-choices\",\"block\":5,\"start\":340.57},{\"sectionId\":\"artistic-choices\",\"block\":6,\"start\":353.45},{\"sectionId\":\"artistic-choices\",\"block\":6,\"start\":359.29},{\"sectionId\":\"artistic-choices\",\"block\":6,\"start\":368.17},{\"sectionId\":\"sparks-of-agi\",\"block\":0,\"start\":371.19},{\"sectionId\":\"sparks-of-agi\",\"block\":3,\"start\":376.704},{\"sectionId\":\"sparks-of-agi\",\"block\":5,\"start\":382.236},{\"sectionId\":\"sparks-of-agi\",\"block\":5,\"start\":387.75},{\"sectionId\":\"sparks-of-agi\",\"block\":7,\"start\":391.83},{\"sectionId\":\"sparks-of-agi\",\"block\":7,\"start\":402.63},{\"sectionId\":\"sparks-of-agi\",\"block\":9,\"start\":408.39},{\"sectionId\":\"sparks-of-agi\",\"block\":10,\"start\":415.63},{\"sectionId\":\"sparks-of-agi\",\"block\":10,\"start\":422.87},{\"sectionId\":\"a-simple-network\",\"block\":0,\"start\":427.92},{\"sectionId\":\"a-simple-network\",\"block\":1,\"start\":431.463},{\"sectionId\":\"a-simple-network\",\"block\":2,\"start\":435.017},{\"sectionId\":\"a-simple-network\",\"block\":2,\"start\":438.56},{\"sectionId\":\"a-simple-network\",\"block\":4,\"start\":441.6},{\"sectionId\":\"a-simple-network\",\"block\":4,\"start\":454.4},{\"sectionId\":\"a-simple-network\",\"block\":6,\"start\":460.4},{\"sectionId\":\"a-simple-network\",\"block\":7,\"start\":464.04},{\"sectionId\":\"a-simple-network\",\"block\":8,\"start\":467.68},{\"sectionId\":\"a-simple-network\",\"block\":9,\"start\":471.32},{\"sectionId\":\"a-simple-network\",\"block\":9,\"start\":474.96},{\"sectionId\":\"a-simple-network\",\"block\":10,\"start\":477.2},{\"sectionId\":\"a-talking-calculator\",\"block\":0,\"start\":492.41},{\"sectionId\":\"a-talking-calculator\",\"block\":0,\"start\":504.73},{\"sectionId\":\"a-talking-calculator\",\"block\":2,\"start\":507.93},{\"sectionId\":\"a-talking-calculator\",\"block\":3,\"start\":515.27},{\"sectionId\":\"a-talking-calculator\",\"block\":3,\"start\":522.61},{\"sectionId\":\"a-talking-calculator\",\"block\":5,\"start\":526.57},{\"sectionId\":\"a-talking-calculator\",\"block\":7,\"start\":531.019},{\"sectionId\":\"a-talking-calculator\",\"block\":8,\"start\":535.481},{\"sectionId\":\"a-talking-calculator\",\"block\":8,\"start\":539.93},{\"sectionId\":\"arithmetic\",\"block\":0,\"start\":543.94},{\"sectionId\":\"arithmetic\",\"block\":1,\"start\":550.66},{\"sectionId\":\"arithmetic\",\"block\":1,\"start\":557.38},{\"sectionId\":\"arithmetic\",\"block\":2,\"start\":559.3},{\"sectionId\":\"arithmetic\",\"block\":3,\"start\":566.14},{\"sectionId\":\"arithmetic\",\"block\":4,\"item\":0,\"start\":572.98},{\"sectionId\":\"arithmetic\",\"block\":4,\"item\":0,\"start\":577.7},{\"sectionId\":\"arithmetic\",\"block\":5,\"start\":581.643},{\"sectionId\":\"arithmetic\",\"block\":6,\"start\":585.597},{\"sectionId\":\"arithmetic\",\"block\":7,\"start\":589.54},{\"sectionId\":\"arithmetic\",\"block\":8,\"start\":590.632},{\"sectionId\":\"arithmetic\",\"block\":9,\"start\":591.728},{\"sectionId\":\"bananas\",\"block\":0,\"start\":593.47},{\"sectionId\":\"bananas\",\"block\":1,\"start\":601.03},{\"sectionId\":\"bananas\",\"block\":1,\"start\":608.59},{\"sectionId\":\"bananas\",\"block\":1,\"start\":611.71},{\"sectionId\":\"bananas\",\"block\":3,\"start\":612.75},{\"sectionId\":\"bananas\",\"block\":4,\"start\":616.43},{\"sectionId\":\"bananas\",\"block\":6,\"start\":627.63},{\"sectionId\":\"bananas\",\"block\":6,\"start\":631.39},{\"sectionId\":\"next-token\",\"block\":0,\"start\":637},{\"sectionId\":\"next-token\",\"block\":0,\"start\":651.08},{\"sectionId\":\"next-token\",\"block\":1,\"start\":655.56},{\"sectionId\":\"next-token\",\"block\":2,\"start\":669.56},{\"sectionId\":\"next-token\",\"block\":3,\"start\":673},{\"sectionId\":\"next-token\",\"block\":3,\"start\":682.2},{\"sectionId\":\"more-complex\",\"block\":0,\"start\":684.69},{\"sectionId\":\"more-complex\",\"block\":1,\"start\":687.07},{\"sectionId\":\"more-complex\",\"block\":2,\"start\":689.45},{\"sectionId\":\"more-complex\",\"block\":3,\"start\":691.83},{\"sectionId\":\"more-complex\",\"block\":3,\"start\":694.21},{\"sectionId\":\"more-complex\",\"block\":4,\"start\":695.73},{\"sectionId\":\"more-complex\",\"block\":5,\"start\":700.126},{\"sectionId\":\"more-complex\",\"block\":6,\"start\":704.534},{\"sectionId\":\"more-complex\",\"block\":6,\"start\":708.93},{\"sectionId\":\"more-complex\",\"block\":9,\"start\":714.21},{\"sectionId\":\"information-domain\",\"block\":0,\"start\":725.9},{\"sectionId\":\"information-domain\",\"block\":0,\"start\":738.54},{\"sectionId\":\"information-domain\",\"block\":1,\"start\":744.22},{\"sectionId\":\"information-domain\",\"block\":4,\"start\":750.38},{\"sectionId\":\"information-domain\",\"block\":5,\"start\":756.54},{\"sectionId\":\"information-domain\",\"block\":6,\"start\":760.06},{\"sectionId\":\"information-domain\",\"block\":6,\"start\":772.62},{\"sectionId\":\"cats-and-chocolate\",\"block\":0,\"start\":777.99},{\"sectionId\":\"cats-and-chocolate\",\"block\":1,\"start\":783.67},{\"sectionId\":\"cats-and-chocolate\",\"block\":1,\"start\":789.35},{\"sectionId\":\"cats-and-chocolate\",\"block\":1,\"start\":794.31},{\"sectionId\":\"cats-and-chocolate\",\"block\":2,\"start\":798.91},{\"sectionId\":\"cats-and-chocolate\",\"block\":3,\"start\":803.51},{\"sectionId\":\"cats-and-chocolate\",\"block\":4,\"start\":806.87},{\"sectionId\":\"cats-and-chocolate\",\"block\":4,\"start\":822.15},{\"sectionId\":\"outside-the-dataset\",\"block\":0,\"start\":827.84},{\"sectionId\":\"outside-the-dataset\",\"block\":2,\"start\":834.8},{\"sectionId\":\"outside-the-dataset\",\"block\":2,\"start\":841.76},{\"sectionId\":\"outside-the-dataset\",\"block\":1,\"start\":845.2},{\"sectionId\":\"outside-the-dataset\",\"block\":1,\"start\":857.92},{\"sectionId\":\"outside-the-dataset\",\"block\":2,\"start\":863.76},{\"sectionId\":\"a-tool\",\"block\":0,\"start\":875.13},{\"sectionId\":\"a-tool\",\"block\":1,\"start\":879.37},{\"sectionId\":\"a-tool\",\"block\":1,\"start\":889.93},{\"sectionId\":\"a-tool\",\"block\":2,\"start\":892.49},{\"sectionId\":\"a-tool\",\"block\":2,\"start\":904.17},{\"sectionId\":\"a-tool\",\"block\":3,\"start\":909.53},{\"sectionId\":\"conclusion\",\"block\":0,\"start\":919.19},{\"sectionId\":\"conclusion\",\"block\":1,\"start\":928.79},{\"sectionId\":\"conclusion\",\"block\":2,\"item\":2,\"start\":933.11},{\"sectionId\":\"conclusion\",\"block\":2,\"item\":3,\"start\":936.87},{\"sectionId\":\"conclusion\",\"block\":2,\"item\":4,\"start\":940.63},{\"sectionId\":\"conclusion\",\"block\":2,\"item\":5,\"start\":944.39},{\"sectionId\":\"conclusion\",\"block\":2,\"item\":5,\"start\":948.15},{\"sectionId\":\"conclusion\",\"block\":3,\"start\":953.51},{\"sectionId\":\"conclusion\",\"block\":3,\"start\":961.99},{\"sectionId\":\"conclusion\",\"block\":3,\"start\":964.31},{\"sectionId\":\"conclusion\",\"block\":3,\"start\":975.83},{\"sectionId\":\"conclusion\",\"block\":3,\"start\":979.51},{\"sectionId\":\"follow\",\"block\":-1,\"start\":987.19},{\"sectionId\":\"follow\",\"block\":-1,\"start\":993.43},{\"sectionId\":\"follow\",\"block\":-1,\"start\":995.75},{\"sectionId\":\"follow\",\"block\":-1,\"start\":999.99}],\"scriptSha256\":\"fee49e61de53cf7ad75aee4530743b72b48abd671ab16758cea85fb004ed8ace\"},{\"version\":1,\"slug\":\"making-stylized-grass\",\"cast\":\"boring-blog-duo\",\"castVersion\":2,\"sourceDate\":\"2026-09-29\",\"src\":\"/posts/making-stylized-grass/audio/discussion-v1-signoff-v1.mp3\",\"duration\":665.63,\"chapters\":[{\"id\":\"a-small-patch\",\"title\":\"Art direction first\",\"start\":0,\"speechEnd\":56.72,\"end\":57.37},{\"id\":\"one-ribbon\",\"title\":\"Build one blade\",\"start\":57.37,\"speechEnd\":116.09,\"end\":116.74},{\"id\":\"bend\",\"title\":\"Bend without moving the root\",\"start\":116.74,\"speechEnd\":161.06,\"end\":161.71},{\"id\":\"triangles\",\"title\":\"How many triangles does a leaf need?\",\"start\":161.71,\"speechEnd\":214.19,\"end\":214.84},{\"id\":\"friends\",\"title\":\"Build a clump\",\"start\":214.84,\"speechEnd\":272.76,\"end\":273.41},{\"id\":\"rules\",\"title\":\"Randomness with a structure\",\"start\":273.41,\"speechEnd\":329.01,\"end\":329.66},{\"id\":\"ground\",\"title\":\"Use the ground as a palette\",\"start\":329.66,\"speechEnd\":380.06,\"end\":380.71},{\"id\":\"color\",\"title\":\"Color in patches\",\"start\":380.71,\"speechEnd\":432.47,\"end\":433.12},{\"id\":\"wind\",\"title\":\"Move the field together\",\"start\":433.12,\"speechEnd\":483.44,\"end\":484.09},{\"id\":\"interaction\",\"title\":\"Push the grass aside\",\"start\":484.09,\"speechEnd\":530.81,\"end\":531.46},{\"id\":\"instances\",\"title\":\"Share the geometry\",\"start\":531.46,\"speechEnd\":591.7,\"end\":592.35},{\"id\":\"your-meadow\",\"title\":\"Put the field together\",\"start\":592.35,\"speechEnd\":648.03,\"end\":648.83},{\"id\":\"follow\",\"title\":\"Until next time\",\"start\":648.83,\"speechEnd\":664.83,\"end\":665.63}],\"turns\":[{\"sectionId\":\"a-small-patch\",\"speaker\":\"Narrator\",\"text\":\"I'm Khalil. This is Maya. Today we're building the stylized grass on this site. The starting point is art direction: soft shapes, broad colors, something closer to a painted illustration. Most of the engineering is about keeping that look responsive.\",\"start\":0,\"end\":15.2,\"overlap\":0},{\"sectionId\":\"a-small-patch\",\"speaker\":\"Maya\",\"text\":\"So the goal isn't to model a botanically convincing leaf. It's to decide what the field should feel like, then spend the rendering budget where that matters.\",\"start\":15.2,\"end\":24.64,\"overlap\":0},{\"sectionId\":\"a-small-patch\",\"speaker\":\"Narrator\",\"text\":\"Exactly. One reference was Eric Wohllaib's GDC talk about procedural grass in Ghost of Tsushima. Large fields, individual blades, and a real performance budget. Our meadow aims for a different look, but that relationship between the blade and the whole field is useful.\",\"start\":24.64,\"end\":40.32,\"overlap\":0},{\"sectionId\":\"a-small-patch\",\"speaker\":\"Maya\",\"text\":\"Yours feels flatter and softer. More watercolor than sharp little spikes.\",\"start\":40.32,\"end\":45.44,\"overlap\":0},{\"sectionId\":\"a-small-patch\",\"speaker\":\"Narrator\",\"text\":\"That's deliberate. Rounded profiles, overlapping color, and restrained outlines. Every demo uses the real WebGL renderer. We'll change one decision at a time, so we can actually see what it does.\",\"start\":45.44,\"end\":56.72,\"overlap\":0},{\"sectionId\":\"one-ribbon\",\"speaker\":\"Narrator\",\"text\":\"Start with a ribbon. Two points at the root, two farther up, and more pairs toward the tip. Connect neighboring rows with two triangles. That's our mesh: points and the connections between them.\",\"start\":57.37,\"end\":70.01,\"overlap\":0},{\"sectionId\":\"one-ribbon\",\"speaker\":\"Maya\",\"text\":\"And where does the work happen? Are we moving each leaf around in JavaScript?\",\"start\":70.01,\"end\":74.61,\"overlap\":0},{\"sectionId\":\"one-ribbon\",\"speaker\":\"Narrator\",\"text\":\"JavaScript builds the strip and plants the roots. The GPU runs a vertex shader to position the points while drawing. Each blade gets its own height, width and other attributes, but shares the little strip. We don't update thousands of leaf objects on the CPU every frame.\",\"start\":74.61,\"end\":91.61,\"overlap\":0},{\"sectionId\":\"one-ribbon\",\"speaker\":\"Maya\",\"text\":\"The tip control makes more sense when width stays fixed. It changes where the blade starts narrowing, rather than just making everything wider.\",\"start\":91.61,\"end\":99.85,\"overlap\":0},{\"sectionId\":\"one-ribbon\",\"speaker\":\"Narrator\",\"text\":\"Right. A larger shape exponent keeps width higher up the blade. The final point still closes, but the outline below it is fuller. Those rounded tops are how we get the fluffy look. Sharper tips create thinner, wirier marks. Try both before changing height.\",\"start\":99.85,\"end\":116.09,\"overlap\":0},{\"sectionId\":\"bend\",\"speaker\":\"Narrator\",\"text\":\"Now bend the ribbon. If we shift every point sideways equally, the whole thing slides out of the soil. Instead, the displacement grows with the square of our progress from root to tip.\",\"start\":116.74,\"end\":128.9,\"overlap\":0},{\"sectionId\":\"bend\",\"speaker\":\"Maya\",\"text\":\"Zero at the root, a quarter halfway up, and the full push at the tip. That's a curve I can picture.\",\"start\":128.9,\"end\":135.62,\"overlap\":0},{\"sectionId\":\"bend\",\"speaker\":\"Narrator\",\"text\":\"Yes. The root stays anchored while the rest bends away. We also lower the tip and limit the combined push, so a strong gust doesn't stretch the blade into something completely different.\",\"start\":135.62,\"end\":146.7,\"overlap\":0},{\"sectionId\":\"bend\",\"speaker\":\"Maya\",\"text\":\"Conveniently, no plant physics degree required.\",\"start\":146.7,\"end\":150.5,\"overlap\":0},{\"sectionId\":\"bend\",\"speaker\":\"Narrator\",\"text\":\"It's an approximation chosen for the picture. Lean, wind and touch can all feed the same bend. In the demo, watch the root while you move Lean. It should stay in place.\",\"start\":150.5,\"end\":161.06,\"overlap\":0},{\"sectionId\":\"triangles\",\"speaker\":\"Narrator\",\"text\":\"How much geometry does that bend need? Each segment of the ribbon costs two triangles. With two hundred thousand blades, three segments mean one point two million triangles. Ten segments mean four million.\",\"start\":161.71,\"end\":175.07,\"overlap\":0},{\"sectionId\":\"triangles\",\"speaker\":\"Maya\",\"text\":\"A small choice per blade turns into a fairly large invoice.\",\"start\":175.07,\"end\":179.23,\"overlap\":0},{\"sectionId\":\"triangles\",\"speaker\":\"Narrator\",\"text\":\"Exactly. Switch Show triangles on and compare the three detail levels. Extra rows make the curve and rounded tip smoother. We place rows closer together near the tip because the shape changes faster there.\",\"start\":179.23,\"end\":191.39,\"overlap\":0},{\"sectionId\":\"triangles\",\"speaker\":\"Maya\",\"text\":\"And zoom back out before deciding. A corner you can see in a close-up might disappear at the actual viewing size.\",\"start\":191.39,\"end\":198.51,\"overlap\":0},{\"sectionId\":\"triangles\",\"speaker\":\"Narrator\",\"text\":\"That's the tradeoff. Fewer vertices mean less vertex work and fewer triangles to set up. But the fragment shader still colors the covered pixels. If lots of leaves overlap, that cost remains. Geometry count is one part of performance, not the whole answer.\",\"start\":198.51,\"end\":214.19,\"overlap\":0},{\"sectionId\":\"friends\",\"speaker\":\"Narrator\",\"text\":\"A field of identical, equally spaced blades looks like a grid. We start with a clump center, scatter roots around it, and connect their height and lean to their position. That gives the group a silhouette.\",\"start\":214.84,\"end\":227.16,\"overlap\":0},{\"sectionId\":\"friends\",\"speaker\":\"Maya\",\"text\":\"There's a reason for the shorter edges too. A worn path can have sparse, disturbed growth beside fuller patches. Although nature doesn't follow that rule everywhere.\",\"start\":227.16,\"end\":237.24,\"overlap\":0},{\"sectionId\":\"friends\",\"speaker\":\"Narrator\",\"text\":\"Exactly. We're using it as a visual reference. Interior depth helps control height and spread. Small blades soften the rim, larger groups fill the interior, and occasional tall exceptions break the pattern.\",\"start\":237.24,\"end\":250.12,\"overlap\":0},{\"sectionId\":\"friends\",\"speaker\":\"Maya\",\"text\":\"This clump can go all the way to eight hundred blades. Is that the normal size?\",\"start\":250.12,\"end\":255.48,\"overlap\":0},{\"sectionId\":\"friends\",\"speaker\":\"Narrator\",\"text\":\"No, that's an expanded budget for the experiment. The usual clumps are much smaller. Increase the count, then change Roundness while keeping width fixed. Full tips overlap into a softer mass. Pointed ones read as separate strokes. Root shading helps you see the depth between them.\",\"start\":255.48,\"end\":272.76,\"overlap\":0},{\"sectionId\":\"rules\",\"speaker\":\"Narrator\",\"text\":\"Random placement needs structure. A mask describes where grass can grow. Think of a grayscale map: white allows it, black excludes it, and gray gives partial coverage.\",\"start\":273.41,\"end\":285.41,\"overlap\":0},{\"sectionId\":\"rules\",\"speaker\":\"Maya\",\"text\":\"So instead of scattering everywhere and hoping, we're giving the randomness a shape to work within.\",\"start\":285.41,\"end\":291.57,\"overlap\":0},{\"sectionId\":\"rules\",\"speaker\":\"Narrator\",\"text\":\"Yes. A simple version measures distance from a patch center and reduces the chance of planting near its edge. Our renderer also stores local thickness and interior depth. Those values guide how full or small the clumps become.\",\"start\":291.57,\"end\":305.57,\"overlap\":0},{\"sectionId\":\"rules\",\"speaker\":\"Maya\",\"text\":\"Growth is another rule. Neighboring blades get related delays, so the field doesn't appear in one instant.\",\"start\":305.57,\"end\":312.37,\"overlap\":0},{\"sectionId\":\"rules\",\"speaker\":\"Narrator\",\"text\":\"And keep the seed fixed while comparing settings. Density cutoff filters stored blades by a random rank. Growth controls emergence. Width, height and roundness change their shape. Replant changes the arrangement. If we change everything at once, we won't know what helped.\",\"start\":312.37,\"end\":329.01,\"overlap\":0},{\"sectionId\":\"ground\",\"speaker\":\"Narrator\",\"text\":\"The ground is also a color source. Each blade samples a shared field at its root. That helps the base blend into the ground instead of looking like a separate object pasted on top.\",\"start\":329.66,\"end\":340.54,\"overlap\":0},{\"sectionId\":\"ground\",\"speaker\":\"Maya\",\"text\":\"Try Ground only first. Then sample the center and change a palette color. When you turn both layers on, you can see where the blades get their colors.\",\"start\":340.54,\"end\":350.06,\"overlap\":0},{\"sectionId\":\"ground\",\"speaker\":\"Narrator\",\"text\":\"Set root shading to zero for that comparison. Then bring it back to see how darker roots create depth inside the clump.\",\"start\":350.06,\"end\":357.18,\"overlap\":0},{\"sectionId\":\"ground\",\"speaker\":\"Maya\",\"text\":\"The texture carries height too, which isn't obvious if you only think of a texture as a photograph.\",\"start\":357.18,\"end\":362.94,\"overlap\":0},{\"sectionId\":\"ground\",\"speaker\":\"Narrator\",\"text\":\"It's a grid of values. Red, green and blue store color; alpha stores ground height. We bake that shared result and refresh it when the inputs change. Drawing uses filtered samples between texels. The readout shows the nearest texel, one cell in that grid.\",\"start\":362.94,\"end\":380.06,\"overlap\":0},{\"sectionId\":\"color\",\"speaker\":\"Narrator\",\"text\":\"For color, work at two scales. Broad patches give neighboring blades something in common. A smaller variation prevents the patch from becoming perfectly uniform.\",\"start\":380.71,\"end\":390.95,\"overlap\":0},{\"sectionId\":\"color\",\"speaker\":\"Maya\",\"text\":\"If every leaf gets an unrelated color, you lose the large shape. You start looking at noise instead of a field.\",\"start\":390.95,\"end\":398.07,\"overlap\":0},{\"sectionId\":\"color\",\"speaker\":\"Narrator\",\"text\":\"Exactly. The palette includes pale greens, teal shadows, rusty accents and muted cool areas. It's an artistic choice, not an attempt to find the one correct grass color. Keep the seed fixed and compare the patch strength.\",\"start\":398.07,\"end\":412.95,\"overlap\":0},{\"sectionId\":\"color\",\"speaker\":\"Maya\",\"text\":\"And baking that field is part of the performance work?\",\"start\":412.95,\"end\":416.15,\"overlap\":0},{\"sectionId\":\"color\",\"speaker\":\"Narrator\",\"text\":\"Yes. The blades sample a shared result instead of rebuilding the entire color and height calculation at every vertex each frame. Sampling still costs something. But it reuses work that doesn't need to change constantly. Wind and interaction remain dynamic.\",\"start\":416.15,\"end\":432.47,\"overlap\":0},{\"sectionId\":\"wind\",\"speaker\":\"Narrator\",\"text\":\"Wind needs continuity. Imagine sliding a sheet of cloudy values across the ground. Nearby roots sample similar parts of it, so a gust moves through the field.\",\"start\":433.12,\"end\":444.24,\"overlap\":0},{\"sectionId\":\"wind\",\"speaker\":\"Maya\",\"text\":\"Otherwise each blade would twitch independently. You'd see the randomness before you saw the wind.\",\"start\":444.24,\"end\":450.56,\"overlap\":0},{\"sectionId\":\"wind\",\"speaker\":\"Narrator\",\"text\":\"We combine several scales of smooth noise and add a small, faster flutter. Noise here means changing numbers, not sound. Broad motion gives direction; the finer movement stops the whole field moving like one rigid object.\",\"start\":450.56,\"end\":465.12,\"overlap\":0},{\"sectionId\":\"wind\",\"speaker\":\"Maya\",\"text\":\"Scrubbing time is helpful. You can hold the same moment while comparing wind strength and gust strength.\",\"start\":465.12,\"end\":471.36,\"overlap\":0},{\"sectionId\":\"wind\",\"speaker\":\"Narrator\",\"text\":\"The demos start paused and stop rendering offscreen. Reduced-motion settings keep automatic playback still, with manual scrubbing available. Sometimes the cheapest frame is the one we don't need to draw.\",\"start\":471.36,\"end\":483.44,\"overlap\":0},{\"sectionId\":\"interaction\",\"speaker\":\"Narrator\",\"text\":\"For touch, convert the pointer position to a point on the ground. Send that point and a radius to the shader. Each blade checks its root's distance and bends away if it's close enough.\",\"start\":484.09,\"end\":495.21,\"overlap\":0},{\"sectionId\":\"interaction\",\"speaker\":\"Maya\",\"text\":\"So we aren't checking the mouse against a few million triangles.\",\"start\":495.21,\"end\":498.85,\"overlap\":0},{\"sectionId\":\"interaction\",\"speaker\":\"Narrator\",\"text\":\"No. It's a simple distance calculation. Smoothstep gives the push a soft boundary. A hard cutoff would produce a visible ring where blades suddenly switch from standing to bent.\",\"start\":498.85,\"end\":510.41,\"overlap\":0},{\"sectionId\":\"interaction\",\"speaker\":\"Maya\",\"text\":\"And the tiny minimum under the division prevents trouble when the pointer lands exactly on a root.\",\"start\":510.41,\"end\":516.09,\"overlap\":0},{\"sectionId\":\"interaction\",\"speaker\":\"Narrator\",\"text\":\"Right. Try the position slider if you're using a keyboard. This demo shows the current push. The homepage also remembers eight fading positions for a short wake. A few shared inputs give us that response without a separate physics simulation for every plant.\",\"start\":516.09,\"end\":530.81,\"overlap\":0},{\"sectionId\":\"instances\",\"speaker\":\"Narrator\",\"text\":\"Instancing ties this together. One shared mesh, plus a record for every blade. The record stores its root, height, width, lean and variation. The GPU combines those values with the strip when it draws.\",\"start\":531.46,\"end\":545.18,\"overlap\":0},{\"sectionId\":\"instances\",\"speaker\":\"Maya\",\"text\":\"That removes the need for a separate scene object and individual submission for every leaf. But the leaves themselves still need drawing.\",\"start\":545.18,\"end\":553.46,\"overlap\":0},{\"sectionId\":\"instances\",\"speaker\":\"Narrator\",\"text\":\"Exactly. This control changes the actual submitted instance count, up to two hundred thousand. Density cutoff works differently: the records stay submitted and the shader filters blades. The counter tells you how many records we're drawing, not how fast your device will be.\",\"start\":553.46,\"end\":569.78,\"overlap\":0},{\"sectionId\":\"instances\",\"speaker\":\"Maya\",\"text\":\"Two hundred thousand is an invitation to experiment, not a recommended minimum.\",\"start\":569.78,\"end\":575.7,\"overlap\":0},{\"sectionId\":\"instances\",\"speaker\":\"Narrator\",\"text\":\"Quite. Watch detail and overlap as well as count. We also turn the ribbons toward the camera so they don't disappear edge-on. That's billboarding. An orthographic camera keeps distance from shrinking the scene, which supports the illustrated, slightly two-dimensional look.\",\"start\":575.7,\"end\":591.7,\"overlap\":0},{\"sectionId\":\"your-meadow\",\"speaker\":\"Narrator\",\"text\":\"The final demo combines all of it. Start with thirty-five thousand blades, compare width and roundness, then try color, terrain and wind. You can increase the count to two hundred thousand, but give each change a chance to show you something.\",\"start\":592.35,\"end\":606.83,\"overlap\":0},{\"sectionId\":\"your-meadow\",\"speaker\":\"Maya\",\"text\":\"If I were building this from scratch, I'd want one step working before adding the next. Ribbon, anchored bend, clump, placement, color, motion, interaction.\",\"start\":606.83,\"end\":618.27,\"overlap\":0},{\"sectionId\":\"your-meadow\",\"speaker\":\"Narrator\",\"text\":\"That's the order. Decide which shapes matter before spending more geometry on them. Art direction tells you what to preserve. Engineering keeps those choices practical at the scale of a field.\",\"start\":618.27,\"end\":629.19,\"overlap\":0},{\"sectionId\":\"your-meadow\",\"speaker\":\"Maya\",\"text\":\"And inspect the gaps. A shorter edge or a clearer empty space might help more than another thousand blades.\",\"start\":629.19,\"end\":636.19,\"overlap\":0},{\"sectionId\":\"your-meadow\",\"speaker\":\"Narrator\",\"text\":\"I plan to open-source this renderer. The follow links below are where I'll share the release and future experiments. For now, take the demos apart a little. Keep the changes that help the picture, and pay attention to what they cost.\",\"start\":636.19,\"end\":648.03,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"Thanks for listening. Follow along for more articles, experiments, and things that worked on my machine.\",\"start\":648.83,\"end\":655.07,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Some of them might even work on yours.\",\"start\":655.07,\"end\":657.39,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Narrator\",\"text\":\"No promises. Have a lovely day. Go make something.\",\"start\":657.39,\"end\":661.63,\"overlap\":0},{\"sectionId\":\"follow\",\"speaker\":\"Maya\",\"text\":\"Preferably a cup of tea first. Bye!\",\"start\":661.63,\"end\":664.83,\"overlap\":0}],\"passages\":[{\"sectionId\":\"a-small-patch\",\"block\":0,\"start\":0},{\"sectionId\":\"a-small-patch\",\"block\":0,\"start\":15.2},{\"sectionId\":\"a-small-patch\",\"block\":1,\"start\":24.64},{\"sectionId\":\"a-small-patch\",\"block\":2,\"start\":40.32},{\"sectionId\":\"a-small-patch\",\"block\":3,\"start\":45.44},{\"sectionId\":\"one-ribbon\",\"block\":0,\"start\":57.37},{\"sectionId\":\"one-ribbon\",\"block\":1,\"start\":70.01},{\"sectionId\":\"one-ribbon\",\"block\":1,\"start\":74.61},{\"sectionId\":\"one-ribbon\",\"block\":3,\"start\":91.61},{\"sectionId\":\"one-ribbon\",\"block\":4,\"start\":99.85},{\"sectionId\":\"bend\",\"block\":0,\"start\":116.74},{\"sectionId\":\"bend\",\"block\":0,\"start\":128.9},{\"sectionId\":\"bend\",\"block\":1,\"start\":135.62},{\"sectionId\":\"bend\",\"block\":1,\"start\":146.7},{\"sectionId\":\"bend\",\"block\":1,\"start\":150.5},{\"sectionId\":\"triangles\",\"block\":0,\"start\":161.71},{\"sectionId\":\"triangles\",\"block\":1,\"start\":175.07},{\"sectionId\":\"triangles\",\"block\":1,\"start\":179.23},{\"sectionId\":\"triangles\",\"block\":2,\"start\":191.39},{\"sectionId\":\"triangles\",\"block\":3,\"start\":198.51},{\"sectionId\":\"friends\",\"block\":0,\"start\":214.84},{\"sectionId\":\"friends\",\"block\":1,\"start\":227.16},{\"sectionId\":\"friends\",\"block\":1,\"start\":237.24},{\"sectionId\":\"friends\",\"block\":2,\"start\":250.12},{\"sectionId\":\"friends\",\"block\":2,\"start\":255.48},{\"sectionId\":\"rules\",\"block\":0,\"start\":273.41},{\"sectionId\":\"rules\",\"block\":1,\"start\":285.41},{\"sectionId\":\"rules\",\"block\":1,\"start\":291.57},{\"sectionId\":\"rules\",\"block\":3,\"start\":305.57},{\"sectionId\":\"rules\",\"block\":4,\"start\":312.37},{\"sectionId\":\"ground\",\"block\":0,\"start\":329.66},{\"sectionId\":\"ground\",\"block\":1,\"start\":340.54},{\"sectionId\":\"ground\",\"block\":1,\"start\":350.06},{\"sectionId\":\"ground\",\"block\":3,\"start\":357.18},{\"sectionId\":\"ground\",\"block\":3,\"start\":362.94},{\"sectionId\":\"color\",\"block\":0,\"start\":380.71},{\"sectionId\":\"color\",\"block\":0,\"start\":390.95},{\"sectionId\":\"color\",\"block\":1,\"start\":398.07},{\"sectionId\":\"color\",\"block\":2,\"start\":412.95},{\"sectionId\":\"color\",\"block\":2,\"start\":416.15},{\"sectionId\":\"wind\",\"block\":0,\"start\":433.12},{\"sectionId\":\"wind\",\"block\":0,\"start\":444.24},{\"sectionId\":\"wind\",\"block\":1,\"start\":450.56},{\"sectionId\":\"wind\",\"block\":3,\"start\":465.12},{\"sectionId\":\"wind\",\"block\":3,\"start\":471.36},{\"sectionId\":\"interaction\",\"block\":0,\"start\":484.09},{\"sectionId\":\"interaction\",\"block\":0,\"start\":495.21},{\"sectionId\":\"interaction\",\"block\":1,\"start\":498.85},{\"sectionId\":\"interaction\",\"block\":1,\"start\":510.41},{\"sectionId\":\"interaction\",\"block\":3,\"start\":516.09},{\"sectionId\":\"instances\",\"block\":0,\"start\":531.46},{\"sectionId\":\"instances\",\"block\":0,\"start\":545.18},{\"sectionId\":\"instances\",\"block\":1,\"start\":553.46},{\"sectionId\":\"instances\",\"block\":2,\"start\":569.78},{\"sectionId\":\"instances\",\"block\":3,\"start\":575.7},{\"sectionId\":\"your-meadow\",\"block\":0,\"start\":592.35},{\"sectionId\":\"your-meadow\",\"block\":1,\"start\":606.83},{\"sectionId\":\"your-meadow\",\"block\":1,\"start\":618.27},{\"sectionId\":\"your-meadow\",\"block\":2,\"start\":629.19},{\"sectionId\":\"your-meadow\",\"block\":3,\"start\":636.19},{\"sectionId\":\"follow\",\"block\":-1,\"start\":648.83},{\"sectionId\":\"follow\",\"block\":-1,\"start\":655.07},{\"sectionId\":\"follow\",\"block\":-1,\"start\":657.39},{\"sectionId\":\"follow\",\"block\":-1,\"start\":661.63}],\"scriptSha256\":\"ac53371ac314a0d8b0ddc957a70fd5cf1a5ec48050cf0a4ff767202a8e4f153f\"},{\"version\":1,\"slug\":\"gtm-engineering-explained-badly\",\"cast\":\"boring-blog-duo\",\"castVersion\":2,\"sourceDate\":\"2026-09-26\",\"src\":\"/posts/gtm-engineering-explained-badly/audio/discussion-v1-signoff-v1.mp3\",\"duration\":613.963,\"chapters\":[{\"id\":\"three-months\",\"title\":\"A career announcement\",\"start\":0,\"speechEnd\":52.64,\"end\":53.29},{\"id\":\"definition\",\"title\":\"The explanation escapes\",\"start\":53.29,\"speechEnd\":93.07,\"end\":93.72},{\"id\":\"ideal-customer\",\"title\":\"A very specific everyone\",\"start\":93.72,\"speechEnd\":134.68,\"end\":135.33},{\"id\":\"enrichment\",\"title\":\"Uncertainty gets dressed\",\"start\":135.33,\"speechEnd\":184.45,\"end\":185.1},{\"id\":\"signals\",\"title\":\"Fourteen points for a thumb\",\"start\":185.1,\"speechEnd\":229.34,\"end\":229.99},{\"id\":\"personalization\",\"title\":\"Human, according to three engineers\",\"start\":229.99,\"speechEnd\":274.963,\"end\":275.613},{\"id\":\"campaign\",\"title\":\"The actual observation\",\"start\":275.613,\"speechEnd\":329.773,\"end\":330.423},{\"id\":\"offsite\",\"title\":\"An extremely fictional offsite\",\"start\":330.423,\"speechEnd\":396.823,\"end\":397.473},{\"id\":\"conversion\",\"title\":\"A small problem with revenue\",\"start\":397.473,\"speechEnd\":437.873,\"end\":438.523},{\"id\":\"automation\",\"title\":\"The doorbell architecture\",\"start\":438.523,\"speechEnd\":494.483,\"end\":495.133},{\"id\":\"attribution\",\"title\":\"One invoice, four victories\",\"start\":495.133,\"speechEnd\":542.513,\"end\":543.163},{\"id\":\"did-you-get-it\",\"title\":\"Certification pending\",\"start\":543.163,\"speechEnd\":596.363,\"end\":597.163},{\"id\":\"follow\",\"title\":\"Until next time\",\"start\":597.163,\"speechEnd\":613.163,\"end\":613.963}],\"turns\":[{\"sectionId\":\"three-months\",\"speaker\":\"Narrator\",\"text\":\"For the last three months, I've been doing G T M engineering. Small career change. Same laptop. Different people disappointed in me.\",\"start\":0,\"end\":7.6,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Maya\",\"text\":\"Congratulations. What do you actually do?\",\"start\":7.6,\"end\":10.96,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Narrator\",\"text\":\"I connect... things. Commercially.\",\"start\":10.96,\"end\":14.16,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Maya\",\"text\":\"A plumber with LinkedIn.\",\"start\":14.16,\"end\":16.24,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Narrator\",\"text\":\"Please don't put that on my invoice. I used to explain why the software didn't work. Now the software works, and I explain why nobody bought anything. So the bugs have acquired purchasing authority.\",\"start\":16.24,\"end\":28.4,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Maya\",\"text\":\"And this conversation is going to explain your new job?\",\"start\":28.4,\"end\":31.682,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Narrator\",\"text\":\"Beautifully. You'll leave knowing when to nod, when to say interesting signal, and how to mute yourself before asking what pipeline means.\",\"start\":31.682,\"end\":39.602,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Maya\",\"text\":\"One real campaign observation. Everything else, including the travel plans, is a dramatization of a meeting that should have been stopped.\",\"start\":39.602,\"end\":48.002,\"overlap\":0},{\"sectionId\":\"three-months\",\"speaker\":\"Narrator\",\"text\":\"The useful explanation is the next article. They can't make me do two jobs.\",\"start\":48.002,\"end\":52.64,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Narrator\",\"text\":\"G T M means go to market. You use data and software to help the right message reach the right person at a useful moment. There. That's actually most of it.\",\"start\":53.29,\"end\":63.29,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Maya\",\"text\":\"Oh! I got it. We're done.\",\"start\":63.29,\"end\":65.53,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Narrator\",\"text\":\"No, wait. I've booked the room for an hour.\",\"start\":65.53,\"end\":68.25,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Maya\",\"text\":\"Of course you have.\",\"start\":68.25,\"end\":69.69,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Narrator\",\"text\":\"The person belongs to an account, the account fits the I C P, the I C P has intent, intent becomes a signal, signal enters a workflow, workflow creates a task, task goes to David, David asks who this person is. Easy.\",\"start\":69.69,\"end\":82.33,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Maya\",\"text\":\"Where did David come from?\",\"start\":82.19,\"end\":83.95,\"overlap\":0.14},{\"sectionId\":\"definition\",\"speaker\":\"Narrator\",\"text\":\"Don't ask that. He came bundled with the C R M.\",\"start\":83.95,\"end\":87.07,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Maya\",\"text\":\"Is there documentation?\",\"start\":87.07,\"end\":88.99,\"overlap\":0},{\"sectionId\":\"definition\",\"speaker\":\"Narrator\",\"text\":\"There's a dashboard. It has a little loading circle. That's how you know it's thinking.\",\"start\":88.99,\"end\":93.07,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Maya\",\"text\":\"Let me try. Ideal customer profile. We decide which companies could actually benefit from the product.\",\"start\":93.72,\"end\":101,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Narrator\",\"text\":\"Yes. Our imaginary product makes meetings shorter. Who has meetings?\",\"start\":101,\"end\":105.64,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Maya\",\"text\":\"Everyone.\",\"start\":105.64,\"end\":106.6,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Narrator\",\"text\":\"Huge market. Write that down.\",\"start\":106.6,\"end\":108.92,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Maya\",\"text\":\"No. We need filters. Company size, relevant problem, whether they can buy it.\",\"start\":108.92,\"end\":114.929,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Narrator\",\"text\":\"More than fifty employees. Growing team. Head of operations. Public interest in efficiency, demonstrated during a forty-minute webinar about reducing unnecessary communication.\",\"start\":114.929,\"end\":124.52,\"overlap\":0},{\"sectionId\":\"ideal-customer\",\"speaker\":\"Maya\",\"text\":\"I attended that. There was a follow-up webinar.\",\"start\":124.52,\"end\":128.28,\"overlap\":0},{\"sectionId

[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"WebSite\\\",\\\"@id\\\":\\\"https://www.theboringblog.ai/#website\\\",\\\"name\\\":\\\"The Boring Blog\\\",\\\"description\\\":\\\"Boring stuff about art, engineering, AI, and the little things that rarely make noise.\\\",\\\"url\\\":\\\"https://www.theboringblog.ai/\\\",\\\"inLanguage\\\":\\\"en\\\",\\\"author\\\":{\\\"@id\\\":\\\"https://www.theboringblog.ai/#author\\\"},\\\"publisher\\\":{\\\"@id\\\":\\\"https://www.theboringblog.ai/#author\\\"}},{\\\"@type\\\":\\\"Blog\\\",\\\"@id\\\":\\\"https://www.theboringblog.ai/#blog\\\",\\\"name\\\":\\\"The Boring Blog\\\",\\\"description\\\":\\\"Boring stuff about art, engineering, AI, and the little things that rarely make noise.\\\",\\\"url\\\":\\\"https://www.theboringblog.ai/\\\",\\\"inLanguage\\\":\\\"en\\\",\\\"author\\\":{\\\"@id\\\":\\\"https://www.theboringblog.ai/#author\\\"},\\\"publisher\\\":{\\\"@id\\\":\\\"https://www.theboringblog.ai/#author\\\"}},{\\\"@type\\\":\\\"Person\\\",\\\"@id\\\":\\\"https://www.theboringblog.ai/#author\\\",\\\"name\\\":\\\"Khalil Alami\\\",\\\"url\\\":\\\"https://www.linkedin.com/in/khalil-alami-006432a7/\\\",\\\"sameAs\\\":[\\\"https://x.com/ALAMIKhalil1\\\",\\\"https://www.linkedin.com/in/khalil-alami-006432a7/\\\"]}]}\"}}],\"$Lb\"],[\"$Lc\",\"$Ld\",\"$Le\",\"$Lf\",\"$L10\",\"$L11\",\"$L12\",\"$L13\",\"$L14\",\"$L15\",\"$L16\"],\"$L17\"]}],{},null,false,null]},null,false,null],\"$L18\",false]],\"m\":\"$undefined\",\"G\":[\"$19\",[\"$L1a\",\"$L1b\"]],\"S\":false,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L1c\",null,{\"entries\":[{\"no\":\"006\",\"slug\":\"eskiz-number-input\",\"title\":\"Building Eskiz, chapter one: the number input\",\"year\":2026,\"date\":\"October 13, 2026\",\"publishedAt\":\"2026-10-13\",\"status\":\"scheduled\",\"minutes\":9,\"lede\":\"Before a model becomes a building, a chair, or a very expensive mistake, someone changes a number. We should probably make that part good.\",\"summary\":\"Why a CAD number input needs more than a number: focus, scrubbing, units, formulas, multiple selections, and the decisions behind Eskiz’s real component.\",\"sections\":[{\"id\":\"start-with-a-width\",\"title\":\"The most important box in the room.\",\"navTitle\":\"Start with a width\",\"blocks\":[{\"kind\":\"p\",\"text\":\"In the previous article, we introduced Eskiz and the problem of making 3D modeling easier to change. This is chapter one of how we are approaching it. We are starting with the number input.\",\"inline\":[\"In \",{\"kind\":\"a\",\"href\":\"/posts/it-was-supposed-to-be-a-small-change\",\"children\":[\"the previous article\"]},\", we introduced Eskiz and the problem of making 3D modeling easier to change. This is chapter one of how we are approaching it. We are starting with the number input.\"]},{\"kind\":\"p\",\"text\":\"I would argue it is the most important component in a CAD application. Width, height, radius, angle, spacing: sooner or later, a design decision passes through this small rectangle. A model can look magnificent while changing its width remains an administrative procedure.\"},{\"kind\":\"p\",\"text\":\"Take a panel, 120 millimeters wide. Make it 128. Easy. Now make it eight millimeters wider without doing the addition yourself. Enter a measurement in centimeters. Keep its width related to another part. Select three different panels and add eight to each. Still the same little box.\"},{\"kind\":\"p\",\"text\":\"That is the story of our input: each apparently small convenience introduces a responsibility. The examples below use the actual shared component, with small local demonstrations around it. The panel drawings are illustrations, not a geometry kernel.\"},{\"kind\":\"image\",\"src\":\"/posts/eskiz-number-input/01-small-box.png\",\"alt\":\"Two designers give a small wooden panel the attention of an enormous precision caliper.\",\"width\":1536,\"height\":1024}],\"demo\":\"number-basic\"},{\"id\":\"a-number-is-not-an-edit\",\"title\":\"A number is not the same thing as an edit.\",\"navTitle\":\"The basic problem\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The native HTML number input is a useful starting point. It accepts numbers, supports bounds and steps, and may provide spinner buttons. It does not know what 12cm or 120 + 8 means. That is outside its job description.\"},{\"kind\":\"p\",\"text\":\"Replacing it with a text field gets us the characters. It also gets us the responsibility for everything those characters mean. Halfway through typing 120 + 8, the text says 120 +. That is an unfinished thought, not a new panel width.\"},{\"kind\":\"p\",\"text\":\"So we separate the text being edited, a usable preview, and the committed value. Plain numeric edits can preview immediately; an expression can show its evaluated result without committing every intermediate keystroke. Enter or blur settles a valid edit. A failed expression keeps its text so you can repair it. Quietly replacing your mistake with the old value would remove the evidence.\"},{\"kind\":\"p\",\"text\":\"Try 120 + 8, then 120 +. The first has an answer. The second deserves a cursor, not a funeral.\"},{\"kind\":\"p\",\"text\":\"Native behavior reference: MDN’s number input documentation.\",\"inline\":[\"Native behavior reference: \",{\"kind\":\"a\",\"href\":\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input/number\",\"children\":[\"MDN’s number input documentation\"]},\".\"]}],\"demo\":\"number-edit\"},{\"id\":\"focus-is-a-decision\",\"title\":\"Even focus has a job.\",\"navTitle\":\"Focus and anatomy\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Typing a replacement is the first job. It is usually faster to write the new number than to place a cursor between the old digits. So focusing a plain value leaves it visible in a lighter color, ready for you to type straight over it. No selecting or clearing first. If you do want to edit the old value, an arrow key brings it into the field. Leaving without typing changes nothing.\"},{\"kind\":\"p\",\"text\":\"A formula needs different treatment. At rest, 10 + 5 normally displays 15. On focus, its source returns. Keyboard focus selects the whole source; pointer focus can place the caret, with select-all-on-first-click available when the host wants it. We have a regression test for the alternative: the source appeared, the caret landed at the end, and typing 100 produced 10 + 5100. An ambitious interpretation of a small edit.\"},{\"kind\":\"p\",\"text\":\"The visual design follows the same distinction. At rest, one quiet box. On engagement, the scrub handle reveals its seam; focus adds an internal bar, without an extra outline. The seam opens inside the existing footprint, so the neighboring fields do not shuffle around. The unit stays its own target. A little movement tells you where the handles are; the inspector does not need to perform a dance.\"}],\"demo\":\"number-focus\"},{\"id\":\"explore-then-commit\",\"title\":\"A drag is one decision.\",\"navTitle\":\"Scrub and undo\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Sometimes you know the answer is 128. Sometimes you know the panel looks slightly too narrow. Typing serves the first situation; dragging the label serves the second. We use the label as a larger scrub target instead of adding tiny spinner arrows.\"},{\"kind\":\"p\",\"text\":\"The same value has several gears: Alt for one tenth of a step, Shift for ten steps, and Command or Control with Shift for a hundred. A zero value must still move. Fine movement must keep its decimals. These sound like details until your mouse has crossed the desk and the number has barely noticed.\"},{\"kind\":\"p\",\"text\":\"During a drag, the model can preview each change. On release, the field reports one commit. That lets the owner create one undo entry for the gesture. Escape cancels the scrub and restores its starting value. The field supplies the boundary; the application owns the history. In this example, a tiny history stack makes that distinction visible.\"}],\"demo\":\"number-scrub\"},{\"id\":\"millimeters-are-not-decoration\",\"title\":\"The unit is part of the meaning.\",\"navTitle\":\"Units and precision\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Our panel is 120 millimeters wide. Showing 12 centimeters must not make it ten times larger. Typing 12cm into a millimeter field converts the quantity; it does not paste a different label beside 12. A length cannot become an angle just because both fit in the same box.\"},{\"kind\":\"p\",\"text\":\"There is another distinction we had to make explicit: changing an authored unit and changing a display preference. The field supports both. In the demo, the unit cap changes only the display. The stored magnitude, expression source, and edit unit remain millimeters. Enter the field and the authored unit returns visibly.\"},{\"kind\":\"p\",\"text\":\"The same goes for precision. You might prefer to read 12.35 cm. That is not permission to replace the model’s 123.456789 mm with a rounded value. Display rounding and edit rounding have separate controls. A tidier inspector should not quietly become a manufacturing operation.\"}],\"demo\":\"number-units\"},{\"id\":\"keep-the-reason\",\"title\":\"Keep the calculation, too.\",\"navTitle\":\"Formulas and references\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A width of 128 tells us the result. A width of 120 + 8 also tells us how we arrived there. A reference such as @panel.width / 2 says something stronger: this dimension depends on another one.\"},{\"kind\":\"p\",\"text\":\"We keep the source. The result is usually what you see at rest; focus reveals the expression, syntax highlighting, and a live result preview. Type @ to choose from names supplied by the host. Completion stays attached to the input without taking focus away from the text you were writing. Escape dismisses the suggestions before a second Escape abandons the edit.\"},{\"kind\":\"p\",\"text\":\"Then comes the less obvious decision: dragging a formula must not silently destroy it. Nudge 120 + 8 by two and the field folds the adjustment into the source. With a reference, the reference survives. Turning the result into a plain number is an explicit decision, not a side effect of touching the handle.\"},{\"kind\":\"p\",\"text\":\"The field can ask what @panel.width means. It cannot decide which objects depend on it, detect every cycle, or propagate changes through a document by itself. Those belong to the owning system. This demo provides one fixed reference; it is a field demonstration, not a miniature dependency engine.\"}],\"demo\":\"number-formula\"},{\"id\":\"seven-ways-to-say-120\",\"title\":\"Seven ways to say 120.\",\"navTitle\":\"The value states\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The digits alone do not tell you whether a value was typed, inherited, calculated here, or controlled elsewhere. We represent seven readings: default, literal, overridden, expression, driven, mixed, and error.\"},{\"kind\":\"p\",\"text\":\"Default means nobody set it. Literal means somebody did. Overridden means the authored value differs from a known default, so there is something useful to reset. Expression means calculated here. Driven means another source owns it. Mixed means the selected objects disagree. Error means it could not be resolved.\"},{\"kind\":\"p\",\"text\":\"These are not seven colors. A formula has a marker. A driven value is read-only and identifies its source. An override can offer a revert button. Mixed says Mixed. An error retains the troublesome text and exposes an invalid state. The distinction should survive without the color.\"},{\"kind\":\"p\",\"text\":\"Nor are all seven stored independently in the document. Mixed comes from the selection. Overridden comes from comparing with a default. Error comes from evaluation. Storing those conclusions as if they were permanent facts would create another set of numbers to keep honest.\"}],\"demo\":\"number-states\"},{\"id\":\"mixed-is-not-zero\",\"title\":\"Mixed is not zero.\",\"navTitle\":\"Edit a selection\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Now select three panels: 40, 60, and 100 millimeters wide. Showing zero would be false. Showing the first panel’s width would merely be false with more confidence.\"},{\"kind\":\"p\",\"text\":\"The field says Mixed. Type 80 and all three become 80. Type + 8 and they become 48, 68, and 108. A signed subtraction works the same way: -40 subtracts forty from each. Dragging the label also applies a shared delta, keeping the differences between the panels. To assign an absolute negative value, use parentheses: (-40). Relative input is evaluated against each original value; the batch succeeds together or is refused together. The reader should never have to discover halfway down the selection that only some of the edit happened.\"},{\"kind\":\"p\",\"text\":\"That still leaves ownership clear. The inspector chooses the targets. The field evaluates and reports the proposed values. A linked width-and-height pair is another coordinator’s job: each individual field should not secretly know about its neighbor. Small controls become difficult when we give them the whole application to manage.\"},{\"kind\":\"image\",\"src\":\"/posts/eskiz-number-input/02-same-adjustment.png\",\"alt\":\"Three wooden panels retain different lengths after each receives a small extension.\",\"width\":1536,\"height\":1024}],\"demo\":\"number-mixed\"},{\"id\":\"space-and-limits\",\"title\":\"The awkward cases are the component.\",\"navTitle\":\"Space and limits\",\"blocks\":[{\"kind\":\"p\",\"text\":\"An inspector gets narrow. A formula gets long. We let the content borrow space from the caps before sacrificing its digits. On fine pointers, hover reveals the fuller anatomy again; keyboard focus can recover a collapsed unit control. Touch keeps the anatomy whole because there is no hover to come back through. Below a useful width, the honest answer is a wider inspector.\"},{\"kind\":\"p\",\"text\":\"I am not very happy with the narrow-field behavior yet, especially with long formulas. Keeping the whole expression readable and easy to edit in a small inspector is still something I am thinking through. The example below shows where we are, rather than a decision I consider finished.\"},{\"kind\":\"p\",\"text\":\"Limits also need meaning. A soft limit preserves an out-of-range entry and warns. A hard limit constrains it. An angle may wrap through 360 degrees; a hinge may have actual stops. We cannot infer those product decisions from the fact that the value happens to be numeric.\"},{\"kind\":\"p\",\"text\":\"Even a mathematically valid answer can be wrong for a document. The host gets a chance to refuse a commit before it is applied. A refused edit keeps its draft and explanation. We already had a bug where a value preview changed before the owner rejected it, leaving the field and document disagreeing. It is considerably easier to trust a refusal when the object has not moved anyway.\"}],\"demo\":\"number-limits\"},{\"id\":\"back-to-the-model\",\"title\":\"Back to the model.\",\"navTitle\":\"Why start here\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The complexity is in the combinations: an expression while scrubbing, a unit preference while focused, an invalid draft when Apply is pressed, a read-only value reached by keyboard instead of mouse. We test those transitions because a screenshot of the resting field cannot tell us whether any of them works.\"},{\"kind\":\"p\",\"text\":\"This is why we are starting the Eskiz series here. Easier modeling is partly the accumulation of small, dependable interactions: type what you mean, explore without losing your starting point, keep the relationships you created, and understand why a change was refused.\"},{\"kind\":\"p\",\"text\":\"AI collaboration will still need those properties. Whether a person types a dimension or an agent proposes one, we need to inspect its source, adjust it, and trust what gets committed. The number input does not solve the whole CAD application. It does give us a very small place where the promises have to become real.\"},{\"kind\":\"p\",\"text\":\"The production component is much richer than these examples. We have kept the demos focused so each decision is easy to try; there are many more advanced features to discover in the Eskiz app. Even the small rectangle has things left to show you.\"},{\"kind\":\"p\",\"text\":\"We wanted to change a panel’s width. We now have opinions about the first arrow key. This is how it starts.\"}]}]},{\"no\":\"005\",\"slug\":\"agent-replay\",\"title\":\"Agent Replay: a calmer way to review code\",\"year\":2026,\"date\":\"October 9, 2026\",\"publishedAt\":\"2026-10-09\",\"status\":\"published\",\"minutes\":4,\"lede\":\"Too many files, a wall of changes, and not enough time. Agent Replay brings the review back to one change you can actually follow.\",\"summary\":\"Review AI-written code at your own pace with Agent Replay: follow edits, inspect recorded checks, learn a repository, and share an offline walkthrough.\",\"sections\":[{\"id\":\"the-review-still-takes-time\",\"title\":\"The review starts with a wall of changes.\",\"navTitle\":\"Why we built it\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Open a sizeable pull request and the interface hands you a file count, a line count, and a long stack of red and green. Before reading the first function, you are estimating how much of your afternoon has disappeared.\"},{\"kind\":\"p\",\"text\":\"The interface is part of the problem. Condensed diffs split a change across files and fragments; you have to rebuild the context and relationships while keeping track of what is left. When an agent produces code faster than you can absorb it, that review queue gets rather loud.\"},{\"kind\":\"p\",\"text\":\"We built Agent Replay to bring focus back. Lines arrive and disappear smoothly, with the agent’s recorded explanation alongside the change. Your attention stays on what is happening now. Pause there. Understand that function. The rest can wait.\"}]},{\"id\":\"watch-one-change\",\"title\":\"1. Open a session. Take your time.\",\"navTitle\":\"Watch a change\",\"blocks\":[{\"kind\":\"p\",\"text\":\"With Node 20+ and git installed, run this from your repository:\"},{\"kind\":\"code\",\"text\":\"npx agent-replay-studio@latest\"},{\"kind\":\"p\",\"text\":\"It opens a local player and finds existing Claude Code, Codex, and Gemini CLI logs. Pick your project and a session. If your project is missing, use Open folder… in the project picker to point it at the repository. It still needs a supported session log or a saved replay to show that session.\"},{\"kind\":\"p\",\"text\":\"Press Space to play or pause. Use → to finish the current animation or advance one step, and ← to go back. N jumps between review notes. Slow the playback down; the code has already been written. It can wait.\"},{\"kind\":\"p\",\"text\":\"Open the file tree to see where each edit belongs. Switch to File for the surrounding function, or step back to its earlier state. You can follow what was added or removed without losing the file around it.\"},{\"kind\":\"image\",\"src\":\"/posts/agent-replay/01-review-focus.jpg\",\"alt\":\"Agent Replay paused on the invoiceTotal change in the pocket-pay demo: the file tree on the left, the function and its additions and removals in the center, and the review note on the right.\",\"width\":1707,\"height\":960},{\"kind\":\"p\",\"text\":\"This is pocket-pay, a small demo we made. Its invoice total was one cent off. At the fix, a review note points out the assumptions: prices have at most two decimals, and rounding happens on the invoice total. Those are decisions worth reading before approving.\"}]},{\"id\":\"read-the-evidence\",\"title\":\"2. Look at what was actually checked.\",\"navTitle\":\"Check the evidence\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Open Evidence. It lists recorded test runs and other recognized checks, their results, and things worth investigating: deleted tests, failures hidden by shell pipes, or edits after a passing check.\"},{\"kind\":\"image\",\"src\":\"/posts/agent-replay/02-evidence.jpg\",\"alt\":\"The Evidence panel for the demo shows a passing final test run, six recorded check attempts, and two deleted test files flagged for review.\",\"width\":1920,\"height\":1200},{\"kind\":\"p\",\"text\":\"Here, the deleted files were temporary probes. One deliberately ran the new tests against the old implementation to confirm they caught the bug. The final suite passed. The warning gives you somewhere to look; the sequence gives you context.\"},{\"kind\":\"p\",\"text\":\"The panel reads recorded commands and output. It does not rerun the tests or prove correctness. You still decide whether the implementation and its checks are sufficient.\"}]},{\"id\":\"learn-the-surrounding-code\",\"title\":\"3. Learn the part you are about to own.\",\"navTitle\":\"Learn the repository\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Sometimes the missing piece is the repository itself. There are two ways in: replay its Git history commit by commit, or ask an agent to build concise tutorials that cover the current repository.\"},{\"kind\":\"p\",\"text\":\"The history command lets you choose a starting revision with --from, including the first commit. Add --learn to introduce the files already present at that starting point, then follow the changes forward.\"},{\"kind\":\"code\",\"text\":\"npx agent-replay-studio@latest history --learn\"},{\"kind\":\"p\",\"text\":\"Without --from, history shows up to the latest 300 commits.\"},{\"kind\":\"p\",\"text\":\"For Claude Code, install the teaching skills from your repository:\"},{\"kind\":\"code\",\"text\":\"npx agent-replay-studio@latest skills install\"},{\"kind\":\"p\",\"text\":\"Then ask your agent:\"},{\"kind\":\"quote\",\"text\":\"Use replay-teach to teach me this repository in concise lessons. Start with the data types, follow one request, and explain the important decisions. Use the actual source and continue until the repository is covered, keeping boilerplate brief.\"},{\"kind\":\"image\",\"src\":\"/posts/agent-replay/03-learn.jpg\",\"alt\":\"A pocket-pay course lesson shows invoiceTotal in the source panel, with the rounding calculation and a worked example in the Lesson panel.\",\"width\":1920,\"height\":1200},{\"kind\":\"p\",\"text\":\"Open the course under Learn. Pause at a function, read its explanation, and follow the next piece when you are ready. Source is pinned to the course’s revision; the agent-written explanations still deserve your judgment.\"}]},{\"id\":\"give-the-next-reviewer-a-way-in\",\"title\":\"Give the next reviewer a way in.\",\"navTitle\":\"Share the walkthrough\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Export a replay as a self-contained HTML file that opens offline. Share it alongside the PR so someone else can follow the same steps. Check the export before sharing: it contains code and session context.\"},{\"kind\":\"p\",\"text\":\"Agent Replay is open source on GitHub. Try it on one small change you would otherwise skim.\",\"inline\":[\"Agent Replay is \",{\"kind\":\"a\",\"href\":\"https://github.com/sangloo/agent-replay\",\"children\":[\"open source on GitHub\"]},\". Try it on one small change you would otherwise skim.\"]},{\"kind\":\"p\",\"text\":\"The agent can keep the speed. We get to keep a little understanding.\"}]}]},{\"no\":\"004\",\"slug\":\"it-was-supposed-to-be-a-small-change\",\"title\":\"Why is 3D modeling still so complicated?\",\"year\":2026,\"date\":\"October 6, 2026\",\"publishedAt\":\"2026-10-06\",\"status\":\"scheduled\",\"minutes\":21,\"lede\":\"From a rough idea to a detailed model you can change, reuse, and hand over: where CAD makes the journey harder, and what AI needs to help with.\",\"summary\":\"The tradeoffs in SketchUp, Plasticity, Onshape, Shapr3D, Rhino, Grasshopper, and Revit, and the thinking behind Eskiz: a new approach to 3D modeling enhanced by AI collaboration.\",\"sections\":[{\"id\":\"the-whole-journey\",\"title\":\"There is more to designing than making the first shape.\",\"navTitle\":\"The whole design process\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A rough idea and a model someone can build are very different things. Between them are proportions to explore, parts to organize, dimensions to control, details to resolve, and other people’s requirements to accommodate. Then something changes, and those decisions have to keep making sense together.\"},{\"kind\":\"p\",\"text\":\"At the beginning, you want to sketch freely and compare alternatives. Later, you need precision: material thickness, joints, clearances, repeated parts, perhaps a whole family of sizes. Eventually, someone needs to review the design, revise it, or make it. A chair, a piece of equipment, and a building differ enormously, but all can pass through versions of that journey.\"},{\"kind\":\"p\",\"text\":\"CAD software is extraordinarily capable. The difficulty is that each stage can ask us to work differently. A tool that feels immediate while exploring a shape may need extra structure before changes propagate. A powerful parametric model can demand that we plan relationships before we have settled the design. Moving between tools can mean rebuilding information we already had.\"},{\"kind\":\"p\",\"text\":\"There is also the everyday work of operating the application: finding the right command, selecting the right face, understanding which object a value belongs to, and discovering why an edit affected something else. Eventually, you become good at the software. Ideally, some time remains for the design.\"},{\"kind\":\"p\",\"text\":\"The opportunity I care about is this whole process: making 3D modeling easier to enter, richer as an idea develops, and less painful to revise and share. To understand what a different approach might look like, we first need to look at the choices today’s tools ask us to make.\"},{\"kind\":\"image\",\"src\":\"/posts/it-was-supposed-to-be-a-small-change/04-design-journey.png\",\"alt\":\"A designer and a maker compare a chair sketch, an exploded study model, and an assembled wooden chair in an atelier. AI-generated editorial illustration.\",\"width\":1536,\"height\":1024}]},{\"id\":\"how-software-thinks\",\"title\":\"First, learn how the software thinks.\",\"navTitle\":\"Different tools, different bargains\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Learning a CAD application means learning its idea of a model. Is this a collection of faces, a sequence of features, a network of rules, or a building element with a type and a host? That choice affects much more than the interface. It determines which actions feel easy and what you must prepare for the next change.\"},{\"kind\":\"h2\",\"text\":\"Get a shape down quickly\"},{\"kind\":\"p\",\"text\":\"SketchUp makes drawing and pushing a face into a volume feel immediate. As the model grows, its raw geometry can stick together in ways you did not intend. Groups and components separate parts so you can work on them independently. That solves a real problem, while introducing another thing to manage: which editing context you are inside, and which geometry belongs there.\",\"inline\":[\"SketchUp makes drawing and pushing a face into a volume feel immediate. As the model grows, its raw geometry can stick together in ways you did not intend. \",{\"kind\":\"a\",\"href\":\"https://help.sketchup.com/en/sketchup/grouping-geometry\",\"children\":[\"Groups and components\"]},\" separate parts so you can work on them independently. That solves a real problem, while introducing another thing to manage: which editing context you are inside, and which geometry belongs there.\"]},{\"kind\":\"p\",\"text\":\"SketchUp also has configurable components, including Dynamic and Live Components. It would be wrong to say it cannot be parametric. But drawing a cabinet quickly does not automatically establish how its shelves, doors, and hardware should respond when its width changes. Someone has to author that behavior.\",\"inline\":[\"SketchUp also has \",{\"kind\":\"a\",\"href\":\"https://help.sketchup.com/en/sketchup/components\",\"children\":[\"configurable components\"]},\", including Dynamic and Live Components. It would be wrong to say it cannot be parametric. But drawing a cabinet quickly does not automatically establish how its shelves, doors, and hardware should respond when its width changes. Someone has to author that behavior.\"]},{\"kind\":\"p\",\"text\":\"Plasticity emphasizes precise solid and surface modeling through direct editing, without requiring a history tree. You can push and pull the shape rather than reconstruct the sequence that produced it. That is attractive while exploring form. Precision and reusable behavior are separate questions, though: changing a face does not by itself describe how a family of related parts should change together.\",\"inline\":[\"Plasticity emphasizes precise solid and surface modeling through \",{\"kind\":\"a\",\"href\":\"https://www.plasticity.xyz/\",\"children\":[\"direct editing\"]},\", without requiring a history tree. You can push and pull the shape rather than reconstruct the sequence that produced it. That is attractive while exploring form. Precision and reusable behavior are separate questions, though: changing a face does not by itself describe how a family of related parts should change together.\"]},{\"kind\":\"h2\",\"text\":\"Make the design remember its decisions\"},{\"kind\":\"p\",\"text\":\"In history-based modeling, as in Onshape, a sketch becomes an extrusion; a later cut depends on that result. Editing an earlier dimension can update the chain. When an upstream change removes a reference, later features can fail. Onshape’s reference-repair tools help compare the broken model with its last healthy state and propagate a replacement. This is useful support for a real responsibility: maintaining the dependencies you created.\",\"inline\":[\"In history-based modeling, as in Onshape, a sketch becomes an extrusion; a later cut depends on that result. Editing an earlier dimension can update the chain. When an upstream change removes a reference, later features can fail. Onshape’s \",{\"kind\":\"a\",\"href\":\"https://cad.onshape.com/help/Content/Document/repairing.htm\",\"children\":[\"reference-repair tools\"]},\" help compare the broken model with its last healthy state and propagate a replacement. This is useful support for a real responsibility: maintaining the dependencies you created.\"]},{\"kind\":\"p\",\"text\":\"Shapr3D combines direct editing with history-based parametric modeling, which makes a strict either-or comparison misleading. Its own direct-versus-parametric tutorial shows how repeated direct edits can accumulate offset steps in the history, and how suppressing an earlier feature can break a later one. A friendly gesture helps you make the edit. You still need to understand what that edit depends on.\",\"inline\":[\"Shapr3D combines direct editing with history-based parametric modeling, which makes a strict either-or comparison misleading. Its own \",{\"kind\":\"a\",\"href\":\"https://support.shapr3d.com/hc/en-us/articles/14030415438748-Direct-vs-Parametric\",\"children\":[\"direct-versus-parametric tutorial\"]},\" shows how repeated direct edits can accumulate offset steps in the history, and how suppressing an earlier feature can break a later one. A friendly gesture helps you make the edit. You still need to understand what that edit depends on.\"]},{\"kind\":\"h2\",\"text\":\"Describe a whole system\"},{\"kind\":\"p\",\"text\":\"Rhino offers considerable freedom to work with geometry; Grasshopper lets you describe procedures that generate it. That is powerful for repetition, variation, and complex logic. It also means learning to program visually. David Rutten’s explanation of data trees describes why lists of points and surfaces need structure, and why that structure can be difficult to learn. You came to design a facade. You are now investigating which branch has your points.\",\"inline\":[\"Rhino offers considerable freedom to work with geometry; Grasshopper lets you describe procedures that generate it. That is powerful for repetition, variation, and complex logic. It also means learning to program visually. David Rutten’s \",{\"kind\":\"a\",\"href\":\"https://developer.rhino3d.com/guides/grasshopper/the-why-and-how-of-data-trees/\",\"children\":[\"explanation of data trees\"]},\" describes why lists of points and surfaces need structure, and why that structure can be difficult to learn. You came to design a facade. You are now investigating which branch has your points.\"]},{\"kind\":\"p\",\"text\":\"Revit organizes buildings through elements, families, hosts, and parameters. Its distinction between type and instance parameters lets some changes affect a whole type and others affect one element. That structure supports coordination. It also makes the family’s setup consequential: a downloaded component may look right while exposing the wrong controls for your project. Adapting the family becomes another design task.\",\"inline\":[\"Revit organizes buildings through elements, families, hosts, and parameters. Its distinction between \",{\"kind\":\"a\",\"href\":\"https://help.autodesk.com/cloudhelp/2024/ENU/Revit-GetStarted/files/GUID-6F4A8DAF-52BE-48F3-932B-C3D0D428E741.htm\",\"children\":[\"type and instance parameters\"]},\" lets some changes affect a whole type and others affect one element. That structure supports coordination. It also makes the family’s setup consequential: a downloaded component may look right while exposing the wrong controls for your project. Adapting the family becomes another design task.\"]},{\"kind\":\"p\",\"text\":\"These are useful, different bargains. The frustration is having to predict early how much freedom, structure, automation, and coordination the project will eventually need. We should be able to start simply and add meaningful structure as the design develops. That sounds like a promising job for AI. It is also where the easy AI demonstration ends.\"}]},{\"id\":\"a-chat-box\",\"title\":\"Then we gave it a chat box.\",\"navTitle\":\"What AI has to help with\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Language could remove a great deal of translation work. Describe an arrangement, ask for alternatives, keep a dimension fixed, or get help building a procedure without finding every command and connecting every wire yourself. That is a useful ambition. It reaches well beyond generating a first shape.\"},{\"kind\":\"p\",\"text\":\"But ‘AI for CAD’ covers several different jobs. An image model can help explore appearance. A mesh generator can produce a surface. A CAD agent can write a program or operate modeling tools. An assistant can explain why a feature failed. Success at one of those jobs does not establish success at the others.\"},{\"kind\":\"p\",\"text\":\"A convincing image leaves construction unresolved. A valid solid can have the wrong dimensions. A script can generate the requested object while making the next variation awkward. Executable code, usable geometry, and a useful design are separate things to check. The render is usually available for comment first.\"},{\"kind\":\"p\",\"text\":\"Autodesk Research’s July 2026 study, How well can AI models edit 3D CAD?, found a substantial gap between the tested systems and professional expectations on its editing tasks. It also found that automated geometric and visual scores did not reliably stand in for expert judgment. This is evidence about those systems and tasks, not a verdict on every possible CAD assistant. It does explain why a persuasive before-and-after image is an incomplete test.\",\"inline\":[\"Autodesk Research’s July 2026 study, \",{\"kind\":\"a\",\"href\":\"https://www.research.autodesk.com/blog/how-well-ai-models-edit-3d-cad/\",\"children\":[\"How well can AI models edit 3D CAD?\"]},\", found a substantial gap between the tested systems and professional expectations on its editing tasks. It also found that automated geometric and visual scores did not reliably stand in for expert judgment. This is evidence about those systems and tasks, not a verdict on every possible CAD assistant. It does explain why a persuasive before-and-after image is an incomplete test.\"]},{\"kind\":\"p\",\"text\":\"There is useful progress on the underlying problem. Research on aligning constraint generation with design intent uses solver feedback to improve generated sketch constraints. That is a more concrete target than asking whether a result looks plausible: do the relationships behave as intended? Even then, a fully constrained sketch is not the same thing as an engineered product.\",\"inline\":[\"There is useful progress on the underlying problem. Research on \",{\"kind\":\"a\",\"href\":\"https://www.research.autodesk.com/publications/aligning-constraint-generation-design-intent-parametric-cad/\",\"children\":[\"aligning constraint generation with design intent\"]},\" uses solver feedback to improve generated sketch constraints. That is a more concrete target than asking whether a result looks plausible: do the relationships behave as intended? Even then, a fully constrained sketch is not the same thing as an engineered product.\"]},{\"kind\":\"p\",\"text\":\"Integrating an assistant into an existing application can be valuable: the tools, documents, and expertise are already there. But if the result is opaque, slow to regenerate, or difficult to edit, the designer inherits the same work after the prompt. AI needs to help through the process: point at something, ask for a change, inspect the consequences, adjust it, and continue.\"},{\"kind\":\"p\",\"text\":\"That continuing work is where the differences between today’s generators become painfully concrete. What looks impressive in the preview, and what do you actually receive when you open the result?\"}]},{\"id\":\"what-generators-leave-unfinished\",\"title\":\"What today’s 3D generators leave unfinished.\",\"navTitle\":\"What generators leave unfinished\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The first result can be impressive and still disappoint as soon as you inspect it. Shape fidelity, usable geometry, and predictable editing are separate achievements. Improving one does not automatically deliver the others.\"},{\"kind\":\"h2\",\"text\":\"Meshes: resemblance, then cleanup\"},{\"kind\":\"p\",\"text\":\"Mesh generators can produce recognizable objects quickly, but recognition leaves room for quite a lot of invention. Meshy’s own image-to-3D guide describes guessed hidden geometry, inaccurate fine details, and multiple objects merging together. It even suggests regenerating for problems such as extra fingers or gaps. These are concrete limitations of the generated shape, before we ask how well it can be edited.\",\"inline\":[\"Mesh generators can produce recognizable objects quickly, but recognition leaves room for quite a lot of invention. Meshy’s own \",{\"kind\":\"a\",\"href\":\"https://help.meshy.ai/en/articles/9996860-how-to-use-meshy-image-to-3d\",\"children\":[\"image-to-3D guide\"]},\" describes guessed hidden geometry, inaccurate fine details, and multiple objects merging together. It even suggests regenerating for problems such as extra fingers or gaps. These are concrete limitations of the generated shape, before we ask how well it can be edited.\"]},{\"kind\":\"p\",\"text\":\"Even a visually faithful result may have an awkward arrangement of faces, dense geometry that needs rebuilding, or dimensions that need correcting. Meshy’s workflow limitations guide acknowledges precision, topology control, and cleanup as separate hurdles. A background prop and a part that must fit another part have different acceptance criteria. Better-looking geometry can still leave substantial professional work downstream.\",\"inline\":[\"Even a visually faithful result may have an awkward arrangement of faces, dense geometry that needs rebuilding, or dimensions that need correcting. Meshy’s \",{\"kind\":\"a\",\"href\":\"https://www.meshy.ai/topics/limitations-of-beginner-ai-3d-workflows\",\"children\":[\"workflow limitations guide\"]},\" acknowledges precision, topology control, and cleanup as separate hurdles. A background prop and a part that must fit another part have different acceptance criteria. Better-looking geometry can still leave substantial professional work downstream.\"]},{\"kind\":\"h2\",\"text\":\"CAD generators: a valid solid can be the wrong object\"},{\"kind\":\"p\",\"text\":\"Generating native CAD geometry addresses a different part of the problem. Research systems such as BrepGen generate B-reps directly: faces, edges, and their connections. Other systems generate modeling commands or code that a CAD kernel executes. These routes can produce useful, editable geometry. The output format alone cannot establish that it is the requested design.\",\"inline\":[\"Generating native CAD geometry addresses a different part of the problem. Research systems such as \",{\"kind\":\"a\",\"href\":\"https://www.research.autodesk.com/publications/brepgen/\",\"children\":[\"BrepGen\"]},\" generate B-reps directly: faces, edges, and their connections. Other systems generate modeling commands or code that a CAD kernel executes. These routes can produce useful, editable geometry. The output format alone cannot establish that it is the requested design.\"]},{\"kind\":\"p\",\"text\":\"Imagine a generated housing with the right silhouette but the wrong wall thickness, a decorative groove where a joint belongs, and holes that nearly line up. It can be a mathematically valid solid and still be only a visual approximation of the intended object. The B-rep itself is not inherently approximate; the generator’s interpretation is wrong. A professional has to inspect the dimensions, parts, and relationships, then correct or rebuild what is missing.\"},{\"kind\":\"p\",\"text\":\"The May 2026 Text2CAD-Bench preprint reports substantial deterioration on complex topology and advanced features across its tested systems. Its application examples are still restricted to single bodies, without assemblies or mating constraints. Passing a generation benchmark is therefore a much narrower achievement than delivering an editable, coordinated design.\",\"inline\":[\"The May 2026 \",{\"kind\":\"a\",\"href\":\"https://arxiv.org/abs/2605.18430\",\"children\":[\"Text2CAD-Bench preprint\"]},\" reports substantial deterioration on complex topology and advanced features across its tested systems. Its application examples are still restricted to single bodies, without assemblies or mating constraints. Passing a generation benchmark is therefore a much narrower achievement than delivering an editable, coordinated design.\"]},{\"kind\":\"h2\",\"text\":\"Gaussian splats: a scene you can visit\"},{\"kind\":\"p\",\"text\":\"Gaussian splats store many overlapping, soft-edged primitives with color and opacity to reproduce views of a scene. The original 3D Gaussian Splatting work targets high-quality, real-time rendering from captured images. Splats can also be generated; they are a representation, not necessarily a generative-AI system. Their strength is visual presence, useful for captured environments and immersive previews.\",\"inline\":[\"Gaussian splats store many overlapping, soft-edged primitives with color and opacity to reproduce views of a scene. The original \",{\"kind\":\"a\",\"href\":\"https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/\",\"children\":[\"3D Gaussian Splatting work\"]},\" targets high-quality, real-time rendering from captured images. Splats can also be generated; they are a representation, not necessarily a generative-AI system. Their strength is visual presence, useful for captured environments and immersive previews.\"]},{\"kind\":\"p\",\"text\":\"Editing is possible. SuperSplat provides selection, transforms, and color grading. But moving selected splats does not give you a dimensioned wall with openings, thickness, and connected parts. On the geometry side, a standard splat scene lacks the surfaces and relationships needed for ordinary CAD edits. Extracting or rebuilding those is additional work.\",\"inline\":[\"Editing is possible. \",{\"kind\":\"a\",\"href\":\"https://developer.playcanvas.com/user-manual/supersplat/editor/interface/\",\"children\":[\"SuperSplat\"]},\" provides selection, transforms, and color grading. But moving selected splats does not give you a dimensioned wall with openings, thickness, and connected parts. On the geometry side, a standard splat scene lacks the surfaces and relationships needed for ordinary CAD edits. Extracting or rebuilding those is additional work.\"]},{\"kind\":\"p\",\"text\":\"Appearance has a related limitation: captured lighting and surface appearance can be mixed together. Changing a tint is much easier than independently changing a material’s roughness while keeping its response to new lighting consistent. Research such as GS-ID explicitly tackles that separation. Those material and lighting properties do not arrive automatically with an ordinary splat capture.\",\"inline\":[\"Appearance has a related limitation: captured lighting and surface appearance can be mixed together. Changing a tint is much easier than independently changing a material’s roughness while keeping its response to new lighting consistent. Research such as \",{\"kind\":\"a\",\"href\":\"https://arxiv.org/abs/2408.08524\",\"children\":[\"GS-ID\"]},\" explicitly tackles that separation. Those material and lighting properties do not arrive automatically with an ordinary splat capture.\"]},{\"kind\":\"p\",\"text\":\"There is progress in production tools too: V-Ray now supports splat relighting. So dismissing splats as uneditable prototypes would miss useful work already happening. Their value for visualization still does not make them a replacement for detailed, dimensioned modeling or unrestricted material editing.\",\"inline\":[\"There is progress in production tools too: \",{\"kind\":\"a\",\"href\":\"https://blog.chaos.com/v-ray-7-update-4\",\"children\":[\"V-Ray now supports splat relighting\"]},\". So dismissing splats as uneditable prototypes would miss useful work already happening. Their value for visualization still does not make them a replacement for detailed, dimensioned modeling or unrestricted material editing.\"]},{\"kind\":\"h2\",\"text\":\"Then comes the conversation about the conversation\"},{\"kind\":\"p\",\"text\":\"When a correction triggers another broad regeneration, the repair loop can become its own job. Ask to fix a hole, then check whether the proportions, neighboring features, or materials changed as well. Explain what must stay fixed. Inspect again. Eventually, editing the model by hand starts to look like the relaxing option.\"},{\"kind\":\"p\",\"text\":\"For professional work, the useful measure is the time to a result you can trust and continue editing, including cleanup and retries. That is the bridge to the geometry underneath: what should the model preserve so the next request becomes a controlled change, rather than another attempt at resemblance?\"},{\"kind\":\"image\",\"src\":\"/posts/it-was-supposed-to-be-a-small-change/02-beautiful-delivery.png\",\"alt\":\"A beautifully made arched window arrives beside a rectangular opening it cannot fit; two designers compare the result with the actual requirement. AI-generated editorial illustration.\",\"width\":1536,\"height\":1024}]},{\"id\":\"what-is-a-shape\",\"title\":\"The next operation decides what kind of model you need.\",\"navTitle\":\"Choose geometry for the job\",\"demo\":\"cad-representations\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Suppose an assistant produces a curved part. If you need a concept image, its silhouette may be enough. If you need to change its radius, fit it to another part, or manufacture it, other information matters. The way we store the shape affects which of those tasks are straightforward.\"},{\"kind\":\"h2\",\"text\":\"Meshes: useful for surface detail and display\"},{\"kind\":\"p\",\"text\":\"A polygon mesh describes a surface with connected faces, often triangles. Meshes are useful for rendering, sculpting, scans, and many fabrication workflows. A sufficiently accurate, valid mesh can be a perfectly good deliverable. But a finely tessellated hole does not automatically retain a named diameter you can edit. More triangles can improve the surface approximation; they do not recover the decisions that produced it.\"},{\"kind\":\"h2\",\"text\":\"B-rep: useful for precise features and assemblies\"},{\"kind\":\"p\",\"text\":\"A boundary representation describes an object through its boundary and how the pieces connect. In the B-rep form commonly used by CAD kernels, edges and faces refer to mathematical curves and surfaces. Open CASCADE’s topology documentation explains this separation of geometry and connectivity. It is useful when a cylindrical hole, a mating face, or a fillet needs to remain geometrically meaningful. Operations still use numerical tolerances, and troublesome intersections still exist. A B-rep is no promise that every Boolean will have a pleasant afternoon.\",\"inline\":[\"A boundary representation describes an object through its boundary and how the pieces connect. In the B-rep form commonly used by CAD kernels, edges and faces refer to mathematical curves and surfaces. Open CASCADE’s \",{\"kind\":\"a\",\"href\":\"https://dev.opencascade.org/sites/default/files/pdf/Topology.pdf\",\"children\":[\"topology documentation\"]},\" explains this separation of geometry and connectivity. It is useful when a cylindrical hole, a mating face, or a fillet needs to remain geometrically meaningful. Operations still use numerical tolerances, and troublesome intersections still exist. A B-rep is no promise that every Boolean will have a pleasant afternoon.\"]},{\"kind\":\"h2\",\"text\":\"F-rep: useful when a field describes the design\"},{\"kind\":\"p\",\"text\":\"A function representation describes a solid using a function over space: its values distinguish inside, outside, and the boundary. A signed distance field is one particular kind. This is a useful approach for blends, lattices, and structures that vary through a volume, as nTop’s introduction to B-reps and implicits illustrates. Displaying or exporting that field still requires evaluation or conversion, with accuracy and cost to manage. It does not automatically supply the feature history or dimensions another tool expects.\",\"inline\":[\"A function representation describes a solid using a function over space: its values distinguish inside, outside, and the boundary. A signed distance field is one particular kind. This is a useful approach for blends, lattices, and structures that vary through a volume, as nTop’s \",{\"kind\":\"a\",\"href\":\"https://resources.ntop.com/resources/blog/understanding-the-basics-of-b-reps-and-implicits/\",\"children\":[\"introduction to B-reps and implicits\"]},\" illustrates. Displaying or exporting that field still requires evaluation or conversion, with accuracy and cost to manage. It does not automatically supply the feature history or dimensions another tool expects.\"]},{\"kind\":\"p\",\"text\":\"These labels are not completely exclusive: a mesh also describes a boundary. The useful distinction here is what information and operations a particular representation makes available.\"},{\"kind\":\"p\",\"text\":\"The direction I find useful is to choose geometry for the job. Keep precise curves, surfaces, and editable rules where dimensions and assemblies need them. Use meshes for display and work that benefits from them. Use fields where the design is naturally described that way. Make conversions deliberate, with clear limits on what survives. The designer should not have to choose a mathematical allegiance before drawing a chair.\"},{\"kind\":\"p\",\"text\":\"A representation is also different from a kernel. Open CASCADE, Parasolid, and ACIS are geometry engines; choosing one does not, by itself, decide how a designer will work. A kernel can compute a cylindrical hole. Something else must remember why that hole is centered, what it aligns with, and what should happen when the part changes.\"}]},{\"id\":\"remember-why\",\"title\":\"A model needs relationships, not just dimensions.\",\"navTitle\":\"Change something. Keep the logic.\",\"demo\":\"cad-intent\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Dimensions tell us how large something is. Relationships tell us how it should respond. A shelf belongs between two cabinet sides. A row of holes shares a spacing rule. A frame surrounds an opening at a fixed thickness. When the overall size changes, which of those decisions should survive?\"},{\"kind\":\"p\",\"text\":\"The small window example below isolates that distinction. Two frames can look identical before an edit. Stretch one horizontally and its vertical members become thicker. Change the other through a width parameter and its 60 mm frame stays 60 mm. Both operations do what they were told. The instructions describe different designs.\"},{\"kind\":\"p\",\"text\":\"The issue grows with the assembly. A wider cabinet may need longer shelves, redistributed doors, and hardware that stays a fixed distance from each edge. Without authored relationships, the designer becomes the change-propagation system. Very flexible. Difficult to cache.\"},{\"kind\":\"p\",\"text\":\"History, constraints, and procedural modeling already let us express such relationships. The challenge is making them easier to create, inspect, and combine with direct editing. A useful workspace should make the scope of an edit clear: this occurrence, every instance of the same definition, or the rule that generates them. A local exception should survive the next regeneration.\"},{\"kind\":\"p\",\"text\":\"Propagation also has limits. A host face may disappear. Two constraints may become impossible to satisfy together. The useful response is to identify what lost its reference and help repair it. Quietly attaching the feature to some other convenient face can turn a visible modeling error into a hidden design error.\"},{\"kind\":\"p\",\"text\":\"AI could help author and explain these relationships, then propose changes we can inspect in the model. The controls, the geometry, and the explanation should refer to the same thing. For that to feel useful, those interactions also have to happen at the pace of thinking.\"}]},{\"id\":\"the-wait\",\"title\":\"Iteration includes everything between two decisions.\",\"navTitle\":\"Make another try affordable\",\"demo\":\"cad-iteration\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The time between ‘perhaps like this’ and ‘no, the other way’ matters. It includes finding the command, expressing the change, waiting for computation, inspecting the result, and repairing whatever broke. Making one part of that loop faster can leave the rest untouched.\"},{\"kind\":\"p\",\"text\":\"Some of the cost comes from useful complexity. Autodesk’s Revit performance guidance identifies complex geometry, parametric relationships, and constraints among the factors that affect performance. That is not an argument against structured models. It is a reason to care about how much work each edit triggers. AI can add another wait if every adjustment sends the whole task back through generation.\",\"inline\":[\"Some of the cost comes from useful complexity. Autodesk’s \",{\"kind\":\"a\",\"href\":\"https://help.autodesk.com/cloudhelp/2023/ENU/Revit-Customize/files/GUID-269DCB99-AFA2-4D3F-8666-10E30C7415B6.htm\",\"children\":[\"Revit performance guidance\"]},\" identifies complex geometry, parametric relationships, and constraints among the factors that affect performance. That is not an argument against structured models. It is a reason to care about how much work each edit triggers. AI can add another wait if every adjustment sends the whole task back through generation.\"]},{\"kind\":\"p\",\"text\":\"Some of the cost is interaction. Can I select the part I mean? Find the value driving it? Compare an alternative without losing the original? Tell whether the result is current? Undo the change without unwinding five other decisions? These details determine how many ideas are cheap enough to try.\"},{\"kind\":\"p\",\"text\":\"A better loop needs responsive previews, updates limited to what actually changed, clear edit scope, and dependable undo. It should reuse valid work and explain failures in a way that gives us a next step. A refusal with a useful diagnosis can save more time than a fast, confident mistake.\"},{\"kind\":\"p\",\"text\":\"The figure is a schematic, not a speed benchmark. Its point is that inspection and revision belong inside the design process. Faster iteration gets us to a candidate worth keeping. The next question is whether that candidate can meet the demands of the real object.\"}]},{\"id\":\"details-that-matter\",\"title\":\"More detail should mean more understanding.\",\"navTitle\":\"From shape to buildable detail\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A detailed model is not simply one with more geometry. A chair can have beautifully rounded edges while its joints remain unresolved. A panel can have accurate dimensions while its fasteners collide with something behind it. The missing detail is a decision about how the object works.\"},{\"kind\":\"p\",\"text\":\"Parts have roles, materials, connections, and limits. Stock thickness, joint allowances, moving clearances, and the way one component meets another can all affect the geometry. Keeping those relationships in the model makes the detail useful when the design changes. Leaving them in someone’s head makes that person’s holidays a project risk.\"},{\"kind\":\"p\",\"text\":\"Geometric constraints and engineering checks are different kinds of knowledge. Keeping a bracket’s faces parallel does not establish that it can carry a load. A closed solid does not establish that a chosen process can manufacture it. Those conclusions need relevant assumptions, evidence, and, where appropriate, specialist judgment.\"},{\"kind\":\"p\",\"text\":\"The opportunity is to connect requirements to the model: which value drives a detail, which check has been performed, and which question remains unresolved. AI can help explain and manage that information. Its explanation does not substitute for the check.\"},{\"kind\":\"p\",\"text\":\"That is how a rough intention can grow into a highly detailed model with meaning. And once other people need to use it, that meaning has to survive the handoff.\"}]},{\"id\":\"somewhere-else\",\"title\":\"Sharing the shape is only part of the handoff.\",\"navTitle\":\"Reuse, review, and handoff\",\"demo\":\"cad-reuse\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A client may need to inspect a proposal and comment on it. A colleague may need to revise an assembly. A fabricator may need geometry, dimensions, tolerances, and an unambiguous revision. These are different handoffs. Sending everyone the same attractive viewport does not settle them.\"},{\"kind\":\"p\",\"text\":\"CAD already has serious tools for collaboration. Onshape’s versions and branching support controlled revisions and alternative directions. That addresses an important part of working together. Another part is whether the recipient can continue the design logic, particularly when the work moves between applications.\",\"inline\":[\"CAD already has serious tools for collaboration. Onshape’s \",{\"kind\":\"a\",\"href\":\"https://cad.onshape.com/help/Content/Document/versions_and_history.htm\",\"children\":[\"versions and branching\"]},\" support controlled revisions and alternative directions. That addresses an important part of working together. Another part is whether the recipient can continue the design logic, particularly when the work moves between applications.\"]},{\"kind\":\"p\",\"text\":\"Onshape’s import documentation makes the distinction concrete: imported CAD from another system does not bring its original feature tree. The resulting geometry can still be useful, and direct edits or new features can still be added. But receiving a solid is different from receiving the original recipe for changing it.\",\"inline\":[\"Onshape’s \",{\"kind\":\"a\",\"href\":\"https://cad.onshape.com/help/Content/Document/importing_files.htm\",\"children\":[\"import documentation\"]},\" makes the distinction concrete: imported CAD from another system does not bring its original feature tree. The resulting geometry can still be useful, and direct edits or new features can still be added. But receiving a solid is different from receiving the original recipe for changing it.\"]},{\"kind\":\"p\",\"text\":\"Reusable work needs that recipe, or a useful interface to it: controls, allowed inputs, and relationships that continue to hold. In the example below, several windows share one width until we give one a local override. This is a small demonstration of a broader question: can I reuse a design, adapt one instance, and still benefit from improvements to the shared definition?\"},{\"kind\":\"p\",\"text\":\"The same concern reaches drawings, quantities, and other outputs. Which revision do they describe? What updates when the model changes? A component that can be reused with understandable limits is more valuable than one that merely arrives intact. Every handoff should preserve as much useful work as the next person needs.\"},{\"kind\":\"image\",\"src\":\"/posts/it-was-supposed-to-be-a-small-change/03-shared-rule.png\",\"alt\":\"Two craftspeople use one adjustable jig to make related window frames with different widths and consistent frame thickness. AI-generated editorial illustration.\",\"width\":1536,\"height\":1024}]},{\"id\":\"the-scene-behind-the-output\",\"title\":\"The scene could become the center of creative AI.\",\"navTitle\":\"Why this reaches beyond CAD\",\"blocks\":[{\"kind\":\"p\",\"text\":\"There is a larger reason to care about preserving that work. I think solving reliable, editable 3D generation is the most important next step for creative AI. Its value reaches into image generation, video, games, filmmaking, architecture, and product design: all the places where we need to decide what exists, then control how it appears or behaves.\"},{\"kind\":\"p\",\"text\":\"A scene can hold those decisions together: which objects exist, their dimensions and positions, their materials, the lights, the cameras, and how things move over time. Images and shots can then draw on the same underlying description. The scene becomes a place to keep creative decisions, revise them, and use them again.\"},{\"kind\":\"p\",\"text\":\"For image generation, that means being able to place a product, choose a viewpoint, and establish its proportions before asking for a visual treatment. Adobe’s Scene to Image already uses a constructed 3D scene to guide composition, camera angle, and depth. A rough blockout can be enough for composition; an accurate product model matters when the product itself must stay recognizable and correct. Six campaign images should not require the chair to reapply for its fourth leg six times.\",\"inline\":[\"For image generation, that means being able to place a product, choose a viewpoint, and establish its proportions before asking for a visual treatment. Adobe’s \",{\"kind\":\"a\",\"href\":\"https://helpx.adobe.com/firefly/web/generate-images-with-text-to-image/generate-images-using-3d-scenes/scene-to-image.html\",\"children\":[\"Scene to Image\"]},\" already uses a constructed 3D scene to guide composition, camera angle, and depth. A rough blockout can be enough for composition; an accurate product model matters when the product itself must stay recognizable and correct. Six campaign images should not require the chair to reapply for its fourth leg six times.\"]},{\"kind\":\"p\",\"text\":\"For video and filmmaking, the same idea extends across time. We want to move a camera through a set, return to an earlier angle, and keep the objects and their positions consistent. NVIDIA’s GEN3C research uses an explicit 3D cache to guide video generation and camera movement. It is a bounded demonstration of how spatial information can improve control and consistency, rather than asking a video model to infer the whole arrangement again from each request.\",\"inline\":[\"For video and filmmaking, the same idea extends across time. We want to move a camera through a set, return to an earlier angle, and keep the objects and their positions consistent. NVIDIA’s \",{\"kind\":\"a\",\"href\":\"https://research.nvidia.com/labs/toronto-ai/GEN3C/\",\"children\":[\"GEN3C research\"]},\" uses an explicit 3D cache to guide video generation and camera movement. It is a bounded demonstration of how spatial information can improve control and consistency, rather than asking a video model to infer the whole arrangement again from each request.\"]},{\"kind\":\"p\",\"text\":\"For games, the scene also has to support interaction. The door needs a position, an opening motion, and appropriate collision geometry; a picture of a convincing door cannot supply those decisions. For architecture and design, the same model could connect the plan, the walkthrough, the material study, and the detailed component. Change an opening in the design, and the presentation should continue to describe that design. The renderer should not become a second architect with different measurements.\"},{\"kind\":\"p\",\"text\":\"Film and game production already organize work around shared scenes. OpenUSD supports composing assets and exchanging scene information across tools, including geometry, shading, lighting, and physics. The opportunity for AI is to make this kind of structured creation easier to enter and develop, then make the resulting scene useful to generative workflows too. A scene format helps carry the work; it does not create the model or resolve its design for us.\",\"inline\":[\"Film and game production already organize work around shared scenes. \",{\"kind\":\"a\",\"href\":\"https://openusd.org/release/\",\"children\":[\"OpenUSD\"]},\" supports composing assets and exchanging scene information across tools, including geometry, shading, lighting, and physics. The opportunity for AI is to make this kind of structured creation easier to enter and develop, then make the resulting scene useful to generative workflows too. A scene format helps carry the work; it does not create the model or resolve its design for us.\"]},{\"kind\":\"p\",\"text\":\"This is my bet: for visual work that needs repeatable spatial control, the editable scene will become the most valuable thing we keep. A finished image captures one view. A well-structured scene can support another view, another shot, another material, or another medium while preserving the decisions we already made. Generating that scene well would improve much more than the first 3D result.\"},{\"kind\":\"p\",\"text\":\"Not every illustration needs a 3D model. And a scene used as a reference does not guarantee that a generative model will obey it. We still need to distinguish fixed geometry from suggested appearance, inspect the output, and catch departures from the design. The more precise the creative control we want, the more valuable an explicit, editable description of the world becomes.\"},{\"kind\":\"p\",\"text\":\"That makes ease of modeling a much larger issue. If creating and revising the scene remains specialist work, that control stays expensive. Making the scene approachable is how more people get to direct the result.\"}]},{\"id\":\"the-workspace\",\"title\":\"The workspace should grow with the design.\",\"navTitle\":\"Bring the process together\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A scene that carries this much work needs a workspace that helps it develop. Begin with a form you can explore freely. Add dimensions and relationships as they become useful. Develop parts into detailed, reusable systems. Keep the rules understandable, the edits inspectable, and the requirements connected as the work moves toward review and delivery.\"},{\"kind\":\"p\",\"text\":\"Direct and procedural modeling should be able to help each other. Drag one part when that is the clearest way to work. Change a rule when a hundred parts should follow. Ask an assistant to help with either. The generated result should remain part of the model you can edit, rather than becoming a separate artifact to rebuild.\"},{\"kind\":\"p\",\"text\":\"That gives AI a continuing role: help make the first model, develop its details, explore alternatives, and explain dependencies. Sketches, selections, dimensions, and words can contribute to the same conversation. We should be able to inspect a proposed change and carry on from it. The useful unit of progress is a design we can continue working on.\"},{\"kind\":\"p\",\"text\":\"This is a demanding standard. How easy is it to begin? How far can the detail go? What survives a change? How quickly can we try another direction? What can the next person reuse? A new tool has to earn its place across that process.\"}]},{\"id\":\"eskiz\",\"title\":\"That is why we’re building Eskiz.\",\"navTitle\":\"Eskiz\",\"blocks\":[{\"kind\":\"p\",\"text\":\"We’re building Eskiz: a new approach to 3D modeling, enhanced by AI collaboration.\"},{\"kind\":\"p\",\"text\":\"The ambition is to move from an intention to highly detailed models, with the freedom to explore, the structure to make changes propagate, and an easier way to iterate. We want direct modeling, reusable logic, and AI assistance to work together, so the model can become more capable as the design develops.\"},{\"kind\":\"p\",\"text\":\"That ambition draws on the work we’ve been doing on procedural design and editable modeling systems. There is a lot underneath it. We’ll leave the machinery for future posts and show what it means through actual design work.\"},{\"kind\":\"p\",\"text\":\"Starting now, we’ll share details and progress weekly as we work toward the reveal. You can join the Eskiz waitlist to follow along.\",\"inline\":[\"Starting now, we’ll share details and progress weekly as we work toward the reveal. You can \",{\"kind\":\"a\",\"href\":\"https://www.eskiz.ai/\",\"children\":[\"join the Eskiz waitlist\"]},\" to follow along.\"]},{\"kind\":\"p\",\"text\":\"We want more of the work between an idea and a finished design to be design work. That is what we’re building toward.\"}]}]},{\"no\":\"002\",\"slug\":\"making-stylized-grass\",\"title\":\"Making stylized grass\",\"year\":2026,\"date\":\"October 2, 2026\",\"publishedAt\":\"2026-10-02\",\"minutes\":12,\"lede\":\"Art direction first, then the engineering that keeps a painted meadow responsive. Build it step by step with the real WebGL renderer.\",\"sections\":[{\"id\":\"a-small-patch\",\"title\":\"Art direction first\",\"navTitle\":\"The idea\",\"demo\":\"grass-style\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Making stylized grass is primarily an art problem. What shape should the field have? How soft should it feel? Where should the eye rest? The engineering supports those decisions, with much of the work going into drawing and animating enough blades without slowing the page down. This tutorial builds the grass used on this site, from a single blade to a complete field. The renderer behind every demo is on GitHub, at sangloo/stylized-grass.\",\"inline\":[\"Making stylized grass is primarily an art problem. What shape should the field have? How soft should it feel? Where should the eye rest? The engineering supports those decisions, with much of the work going into drawing and animating enough blades without slowing the page down. This tutorial builds the grass used on this site, from a single blade to a complete field. The renderer behind every demo is on GitHub, at \",{\"kind\":\"a\",\"href\":\"https://github.com/sangloo/stylized-grass\",\"children\":[\"sangloo/stylized-grass\"]},\".\"]},{\"kind\":\"p\",\"text\":\"One reference was Ghost of Tsushima, particularly Eric Wohllaib’s GDC 2021 talk, Procedural Grass in ‘Ghost of Tsushima’. It covers generating, rendering and animating large fields within a memory and performance budget. Our visual target is different, but the relationship between individual blades and the field they form was a useful starting point.\",\"inline\":[\"One reference was Ghost of Tsushima, particularly Eric Wohllaib’s GDC 2021 talk, \",{\"kind\":\"a\",\"href\":\"https://www.gdcvault.com/play/1027033/Advanced-Graphics-Summit-Procedural-Grass\",\"children\":[\"Procedural Grass in ‘Ghost of Tsushima’\"]},\". It covers generating, rendering and animating large fields within a memory and performance budget. Our visual target is different, but the relationship between individual blades and the field they form was a useful starting point.\"]},{\"kind\":\"p\",\"text\":\"For this meadow, I wanted something closer to a hand-drawn landscape: a slightly 2D appearance, fluffy clumps, soft silhouettes and broad, watercolor-like patches. Sharp, narrow tips made the field feel too wiry. Rounded leaves and overlapping color masses brought it closer to the illustration I had in mind. We are borrowing that visual language, not simulating paint.\"},{\"kind\":\"p\",\"text\":\"Every demo uses the production WebGL geometry and shaders. Start by comparing low and high outline coverage: too many outlines separate the leaves; fewer let them read as a painted mass. We will make these artistic choices explicit, then look at the engineering that keeps them affordable.\"}]},{\"id\":\"one-ribbon\",\"title\":\"Build one blade\",\"navTitle\":\"A blade\",\"demo\":\"grass-blade\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A blade begins as a flat ribbon: two points at the root, another pair farther up, and more pairs toward the tip. Each neighboring pair of rows is connected with two triangles. This collection of points and connections is a mesh. A ribbon is enough because our goal is a readable silhouette; modeling the thickness of every leaf would add work with little benefit at this scale.\"},{\"kind\":\"p\",\"text\":\"JavaScript creates this small strip and the data describing each blade. The GPU then runs a vertex shader—a program that positions each mesh point—to shape and bend the copies during rendering. We are not moving thousands of individual leaf objects in JavaScript every frame. Later, instancing lets those copies share the same strip.\"},{\"kind\":\"code\",\"text\":\"// The actual shader profile: t runs from root to tip.\\nfloat outer = mix(0.5, 0.36, clamp((iShape - 2.0) / 2.6, 0.0, 1.0));\\nfloat w = iParams.y * uWidth\\n  * pow(max(0.0, 1.0 - pow(t, iShape)), outer);\"},{\"kind\":\"p\",\"text\":\"Let t describe progress up the blade: zero at the root, one at the tip. The width profile decides how quickly the blade narrows. The iShape exponent controls that taper: larger values keep the sides wide for longer before closing at the tip. Blade width scales the profile sideways; Blade height scales it vertically. Compare the tip shapes at the same width and height to see which change is doing what.\"},{\"kind\":\"p\",\"text\":\"Roundness is an art-direction control. Keeping more width near the top makes overlapping leaves read as soft, rounded lobes. A sharper taper feels thinner and more wiry. Neither is more correct; the rounded version fits the fluffy, cartoon-like field we want. The final row still meets at a point, but the rows below it create a much fuller outline.\"}]},{\"id\":\"bend\",\"title\":\"Bend without moving the root\",\"demo\":\"grass-bend\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Moving every point sideways by the same amount would slide the entire blade out of the ground. Instead, multiply the sideways displacement by t². The root receives zero movement, halfway up receives a quarter of the displacement, and the tip receives all of it. The bend builds gradually along the blade.\"},{\"kind\":\"p\",\"text\":\"This is a designed curve, not a physics simulation. The shader also lowers the tip as it bends, adds some unevenness and limits the combined push from lean, wind and interaction. Those constraints keep the blade from stretching unnaturally. Move Lean and watch the root: anchoring it is what makes the motion read as bending.\"},{\"kind\":\"code\",\"text\":\"// In the vertex shader, push includes the blade’s lean.\\nfloat curve = t * t;\\n// This displacement is added to the ribbon position:\\nvec3 bend = push * (curve * h);\"}]},{\"id\":\"triangles\",\"title\":\"How many triangles does a leaf need?\",\"demo\":\"grass-mesh\",\"blocks\":[{\"kind\":\"p\",\"text\":\"A single rectangle can tilt, but it cannot represent much of a curve. More rows give the shader more points to bend. Each extra segment adds two triangles per blade, so the decision quickly matters across a field: 200,000 blades at three segments submit 1.2 million triangles; at ten segments, four million.\"},{\"kind\":\"p\",\"text\":\"Try the real strip’s three detail levels: 3, 6 and 10 segments. Turn on Show triangles and zoom in. Fewer segments reduce vertex processing and triangle setup; more segments smooth the bend and rounded tip. The strip places rows closer together near the tip, where the profile changes fastest, so those points do more useful work.\"},{\"kind\":\"p\",\"text\":\"Choose detail for the viewing distance. A simpler strip may look identical when the field is small on screen; a close-up makes its corners easier to see. That is the idea behind level of detail, although this demo lets you choose the level explicitly. Fewer triangles help, but they do not remove the cost of shading all the overlapping pixels.\"},{\"kind\":\"p\",\"text\":\"The vertex shader positions the points. The fragment shader colors the pixels covered by their triangles. Keeping those jobs separate helps diagnose a slow scene: reducing geometry addresses a different cost from reducing the area covered by overlapping leaves.\"}]},{\"id\":\"friends\",\"title\":\"Build a clump\",\"navTitle\":\"A patch\",\"demo\":\"grass-clump\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Equally spaced copies look planted on a grid. Instead, scatter roots around a shared center and relate their height and lean to their position within the clump. The center carries more mass, while the perimeter becomes lower and more open. The group then has a deliberate silhouette rather than looking like independent blades placed together.\"},{\"kind\":\"p\",\"text\":\"This is inspired by the uneven conditions plants grow in. Along a worn path, trampling and disturbance can leave shorter, sparser growth; a sheltered patch can remain fuller. That is a useful visual reference, not a universal rule for every roadside. Our planting algorithm uses interior depth and local coverage to create that variation, with occasional taller exceptions so the result does not look mechanically trimmed.\"},{\"kind\":\"p\",\"text\":\"The demo isolates one rounded clump made by the same planting code. Its blade budget is expanded to 800 for this experiment; ordinary meadow clumps are much smaller. Increase the count, then compare Roundness at a fixed width. Fuller tips overlap into a soft mass; pointed tips separate into thinner strokes. Height and root shading let you test the silhouette and the depth between leaves independently.\"},{\"kind\":\"image\",\"src\":\"/posts/making-stylized-grass/growth.png\",\"alt\":\"An illustrated blade in a tie tells a gathering of grass: I work in growth. AI-generated watercolor joke.\",\"width\":1536,\"height\":1024}]},{\"id\":\"rules\",\"title\":\"Randomness with a structure\",\"demo\":\"grass-rules\",\"blocks\":[{\"kind\":\"p\",\

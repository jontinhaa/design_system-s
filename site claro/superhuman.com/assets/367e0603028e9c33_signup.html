    <!--
      Transcend airgap.js (consent management). Loaded via a same-origin bootstrap script (rather
      than a static tag) so it can conditionally set data-regime: the Superhuman Go iOS in-app web
      view requests the "ATT" consent regime with a "regime=ATT" query param, which the identity
      backend forwards to this page. Using data-regime (and a query param, not a "#tcm-regime=ATT"
      URL fragment) avoids the airgap fragment-strip that destroyed the Sign in with Apple OAuth
      "#code&state" fragment and left users on a blank page. See airgap-bootstrap.js.

      The bootstrap is an external same-origin file, not inline, because the login CSP allows
      script-src 'self' but not 'unsafe-inline'. The env CSS URL is passed via data-css (index.html
      is Vite-templated; the bootstrap in public/ is not).

      IMPORTANT: airgap.js loads asynchronously (the bootstrap injects it dynamically to read the
      "regime" query param, and script-inserted scripts cannot be parser-blocking). Load order
      therefore does NOT guarantee airgap runs before other code, so any tracker (analytics, pixels,
      or anything hitting the network for a non-essential purpose) MUST wait for airgap before
      loading, via airgapReady() (src/lib/airgap-ready.ts) — see SignupTrack for the pattern. Keep
      the bootstrap limited to loading airgap: it must not do any data collection itself. (Transcend
      confirmed this dynamic async-load approach is documented and supported, valid precisely
      because every tracker is gated on airgap being ready.)
    -->
    <script src="/branches/main/airgap-bootstrap.js" data-css="https://superhumanstatic.com/super-funnel/main/public/css/v1/transcend-airgap.css"></script>

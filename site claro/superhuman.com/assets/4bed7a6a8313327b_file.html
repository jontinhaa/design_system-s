      /*
     * Background-only pre-paint so the page doesn't flash white before the
     * bundle parses. The full loading skeleton is rendered by React from
     * LoadingSkeleton.tsx. The `externalHeadScript` Vite plugin (configured
     * in vite.config.ts) bundles `src/prePaintTheme/prePaintTheme.ts` as a
     * synchronous classic IIFE, emits it as a hashed asset under the
     * configured Vite base, and prepends a `<script src="…">` tag to <head>. The
     * script sets `data-gds-theme` on <html> before paint, so this stays
     * in sync with the user's stored choice without violating CSP
     * `script-src 'self'`.
     */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fcfaf7;
        /* should match --color-background-base-subdued */
      }

      html[data-gds-theme='dark'],
      html[data-gds-theme='dark'] body,
      html[data-gds-theme='dark'] #root {
        background: #292827;
        /* should match --color-background-base-subdued */
      }
    </style>

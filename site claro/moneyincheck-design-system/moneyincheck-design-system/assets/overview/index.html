  <style>
  /* catalog copy: each title line is split by the page's own {w.class|text} token into a left and a right
     word group that sit either side of the knight, the way "Money / in Check" used the page's central gap.
     Same two absolutely placed lines; the gap column is the knight's visible width (26% of .hero__horse,
     centred), and the size is what lets "Money in" fit its half (4.73em wide). */
  .hero__title-line { display: grid; grid-template-columns: 1fr var(--ds-knight-gap) 1fr; align-items: baseline; }
  .hero__title-line .ds-title-left { grid-column: 1; justify-self: end; white-space: nowrap; }
  .hero__title-line .ds-title-right { grid-column: 3; justify-self: start; white-space: nowrap; }
  @media (min-width: 1081px) {
    .hero__title { --ds-knight-gap: 34.8rem; font-size: 14rem; }
    .hero__title-line--1 { top: 33rem; }
    .hero__title-line--2 { top: 46.2rem; }
  }
  @media (max-width: 1080px) {
    .hero__title { --ds-knight-gap: calc(min(70vw, 58rem) * .29); font-size: calc((100vw - 4.8rem - var(--ds-knight-gap)) / 9.7); }
  }

  /* design-system catalog bridge (only inside the catalog iframe): the catalog draws this page's own
     header above the frame at the same spot, so the page keeps its box but hides its copy; in "bg"
     mode (Components view) only the fixed paper grid and the #decor layer stay (chess coordinates,
     WebGL cloth bills, coin), scrolled by the catalog */
  html.ds-embedded #header { visibility: hidden; }
  html.ds-bg-only #app > section:not(#decor),
  html.ds-bg-only #lightbox, html.ds-bg-only #language, html.ds-bg-only .book-zoom,
  html.ds-bg-only .hero__compass, html.ds-bg-only .doodle-grid { visibility: hidden !important; }
  </style>
  <script>
  (function () {
    if (window.parent === window) return;
    var root = document.documentElement, bg = false, saved = 0;
    root.classList.add('ds-embedded');
    function post(m) { try { window.parent.postMessage(m, '*'); } catch (e) {} }
    function maxY() { return Math.max(0, root.scrollHeight - innerHeight); }
    function jump(y) {
      if (window.__lenis) window.__lenis.scrollTo(y, { immediate: true, force: true });
      else scrollTo(0, y);
    }
    addEventListener('message', function (e) {
      var d = e.data;
      if (e.source !== window.parent || !d || !d.ds) return;
      if (d.ds === 'bg' && !bg) { bg = true; saved = scrollY; root.classList.add('ds-bg-only'); jump((d.p || 0) * maxY()); }
      else if (d.ds === 'page' && bg) { bg = false; root.classList.remove('ds-bg-only'); jump(saved); }
      else if (d.ds === 'scroll' && bg) jump(d.p * maxY());
    });
    /* hand the page's grid metrics (set by the bundle from this viewport) to the catalog header */
    var last = '';
    function grid() {
      var cs = getComputedStyle(root), v = {};
      ['--g-px', '--g-py', '--g-ox', '--g-oy', '--g-line'].forEach(function (k) { v[k] = cs.getPropertyValue(k).trim(); });
      var s = JSON.stringify(v);
      if (v['--g-px'] && s !== last) { last = s; post({ ds: 'grid', vars: v }); }
    }
    addEventListener('resize', function () { requestAnimationFrame(grid); });
    addEventListener('load', grid);
    /* ready = loader curtain gone and the hero entrance finished (lines, horse, byline, smoker,
       bills faded in ~2.35 s after the curtain) */
    var t0 = Date.now();
    (function wait() {
      if (window.__loaderDone) {
        window.__loaderDone.then(function () { grid(); setTimeout(function () { post({ ds: 'ready' }); }, 2800); });
        return;
      }
      if (Date.now() - t0 > 15000) { post({ ds: 'ready' }); return; }
      setTimeout(wait, 50);
    })();
    /* the language list links to server routes (/es/, /fr/…) that only exist on the live site */
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="/"]');
      if (a && a.getAttribute('href').charAt(1) !== '/') e.preventDefault();
    }, true);
  })();
  </script>
